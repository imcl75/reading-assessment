<!DOCTYPE html>
<!-- 3in3/profile.html — Teacher profile view for 3 in 3 intervention -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 in 3 Profiles — Wallscourt Farm Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --brand: #1798d3; --brand-dk: #0a6fa8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif; background: #f0f6fb;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px 60px;
}
.logo { font-size: 2rem; margin-bottom: 4px; }
h1 { color: var(--brand); font-size: 1.5rem; font-weight: 800; margin-bottom: 2px; }
.sub { color: #888; font-size: 0.9rem; margin-bottom: 28px; }


/* Main panel */
#main-panel { width: 100%; max-width: 860px; }

.spinner {
  width: 36px; height: 36px; border: 4px solid #ddd;
  border-top-color: var(--brand); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 40px auto; display: block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Top bar */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.top-bar h2 { font-size: 1.2rem; font-weight: 800; color: #1a1a2e; }
.mark-btn {
  padding: 10px 20px; border: none; border-radius: 10px;
  background: var(--brand); color: #fff; font-size: 14px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: background .15s;
}
.mark-btn:hover { background: var(--brand-dk); }
.mark-btn:disabled { opacity: .5; cursor: not-allowed; }

/* Pupil grid */
.pupil-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px; margin-bottom: 28px;
}

.pupil-card {
  background: #fff; border-radius: 16px; padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
  border: 2px solid transparent; cursor: pointer; transition: all .15s;
}
.pupil-card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(23,152,211,.15); }
.pupil-card.active { border-color: var(--brand); background: #f0f8fd; }

.pc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pc-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--brand);
  color: #fff; font-size: 15px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pc-name { font-size: 15px; font-weight: 800; color: #1a1a2e; }
.pc-progress { font-size: 12px; color: #6b7280; margin-top: 1px; }

/* Domain bars */
.domain-bars { display: flex; flex-direction: column; gap: 6px; }
.domain-row { display: flex; align-items: center; gap: 8px; }
.domain-label { font-size: 11px; font-weight: 700; width: 70px; flex-shrink: 0; }
.domain-label.retrieval  { color: #2e7d32; }
.domain-label.vocabulary { color: #e65100; }
.domain-label.inference  { color: #6a1b9a; }
.bar-track { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
.bar-fill.retrieval  { background: #66bb6a; }
.bar-fill.vocabulary { background: #ffa726; }
.bar-fill.inference  { background: #ab47bc; }
.bar-pct { font-size: 11px; font-weight: 700; color: #6b7280; width: 28px; text-align: right; flex-shrink: 0; }
.no-data { font-size: 12px; color: #aaa; font-style: italic; }

/* Detail panel */
#detail-panel {
  display: none; background: #fff; border-radius: 16px; padding: 24px;
  box-shadow: 0 2px 14px rgba(0,0,0,.08); margin-bottom: 20px;
}
.detail-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
}
.detail-name { font-size: 1.2rem; font-weight: 800; color: var(--brand); }
.close-btn {
  background: none; border: 2px solid #ddd; border-radius: 8px;
  padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: inherit; color: #666;
}
.close-btn:hover { border-color: var(--brand); color: var(--brand); }

/* History table */
.mk-row { margin-top: 5px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 11px; color: #9ca3af; }
.mk { border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 6px; min-width: 28px; padding: 3px 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
.mk:hover { background: #f3f4f6; }
.mk.on { background: #1798d3; border-color: #1798d3; color: #fff; }
.mk:disabled { opacity: .5; cursor: default; }
.mk-err { color: #c62828; font-size: 11px; }
.txt-btn { margin-left: 10px; border: 1px solid #1798d3; background: #fff; color: #1798d3; border-radius: 7px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
.txt-btn:hover { background: #e8f5fd; }
.txt-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
.txt-box { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.txt-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eee; font-weight: 800; color: #1a1a2e; }
.txt-close { border: none; background: #f3f4f6; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.txt-body { padding: 18px 22px 24px; overflow-y: auto; font-size: 17px; line-height: 1.7; color: #1a1a2e; white-space: pre-wrap; }
.history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.history-table th {
  text-align: left; padding: 8px 10px; border-bottom: 2px solid #e5e7eb;
  font-size: 11px; font-weight: 800; color: #9ca3af; text-transform: uppercase; letter-spacing: .4px;
}
.history-table td { padding: 9px 10px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.history-table tr:last-child td { border-bottom: none; }

.answer-block { margin-bottom: 6px; }
.q-label { font-size: 11px; font-weight: 800; color: #9ca3af; margin-bottom: 2px; }
.q-answer { font-size: 13px; color: #1a1a2e; font-weight: 600; }

.score-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 800;
}
.score-badge.correct { background: #e8f5e9; color: #2e7d32; }
.score-badge.wrong { background: #ffebee; color: #c62828; }
.score-badge.pending { background: #fff8e1; color: #f57f17; }
.score-badge.review { background: #fff3e0; color: #e65100; border: 2px solid #ffa726; }

.domain-chip {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
}
.domain-chip.retrieval  { background: #e8f5e9; color: #2e7d32; }
.domain-chip.vocabulary { background: #fff3e0; color: #e65100; }
.domain-chip.inference  { background: #f3e5f5; color: #6a1b9a; }

.msg { font-size: 14px; color: #888; text-align: center; padding: 20px; }
.msg.ok { color: #2e7d32; }
.msg.err { color: #c62828; }

/* No pupils */
.no-pupils { background: #fff; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
.no-pupils p { color: #888; font-size: 15px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--brand); font-size: 0.88rem; font-weight: 700;
  text-decoration: none; margin-bottom: 18px;
  padding: 6px 14px; border-radius: 8px; background: rgba(23,152,211,.08);
  transition: background .15s;
}
.back-link:hover { background: rgba(23,152,211,.15); }
</style>
</head>
<body>

<div class="logo">📊</div>
<h1>3 in 3 Profiles</h1>
<p class="sub">Wallscourt Farm Academy — Intervention Tracker</p>
<p style="margin-bottom:20px;"><a class="back-link" href="home.html">← Home</a></p>



<!-- Main -->
<div id="main-panel">
  <div class="top-bar">
    <h2>Intervention Children</h2>
    <button class="mark-btn" id="mark-btn" onclick="triggerMarking()" disabled>✦ Mark with Claude</button>
  </div>
  <div id="mark-msg" class="msg" style="display:none"></div>

  <div id="detail-panel">
    <div class="detail-header">
      <div class="detail-name" id="detail-name"></div>
      <button class="close-btn" onclick="closeDetail()">× Close</button>
    </div>
    <div id="detail-content"></div>
  </div>

  <div class="pupil-grid" id="pupil-grid">
    <div class="spinner"></div>
  </div>
</div>

<script>
const BACKEND_URL = '/_api/planning/readassess-db';
const WFA_TOKEN = '__hub__';   // swapped for the real token by the staff sign-in relay

const CLASS_YEAR = 'Y4';
let allData = []; // raw session rows from backend
let pupils3in3 = []; // [{name, interventionYear}] for this class



// ── JSONP ─────────────────────────────────────────────────────────────────────
function jsonpFetch(url, timeout) {
  // Goes through /_api on this site: Cloudflare checks the staff sign-in and a Worker adds the real token.
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout || 30000);
  url += (url.includes('?') ? '&' : '?') + 'token=' + WFA_TOKEN;
  return fetch(url, { headers: { 'X-WFA-Proxy': '1' }, cache: 'no-store', signal: ctl.signal })
    .then(res => {
      if (res.status === 401) throw new Error('Your staff sign-in has ended. Reload this page and sign in again.');
      if (!res.ok) throw new Error('The school server returned an error (' + res.status + ').');
      return res.json();
    })
    .finally(() => clearTimeout(timer));
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  // Load session data (required) and groups (optional — failure is non-fatal)
  let sessionsData, groupsData;
  try {
    sessionsData = await jsonpFetch(BACKEND_URL + '?action=get3in3data');
  } catch(e) {
    document.getElementById('pupil-grid').innerHTML =
      '<div class="msg err">Could not load session data — check your connection and try again.</div>';
    return;
  }

  try {
    groupsData = await jsonpFetch(BACKEND_URL + '?action=getgroups', 8000);
  } catch(e) {
    groupsData = null; // fine — fall back to all pupils in 3in3 data
  }

  allData = Array.isArray(sessionsData) ? sessionsData : [];

  // Get pupil list for this class year
  try {
    const pupilsData = await jsonpFetch(BACKEND_URL + '?action=get3in3pupils&classYear=' + CLASS_YEAR, 8000);
    let list = Array.isArray(pupilsData) ? pupilsData : (pupilsData && Array.isArray(pupilsData.pupils) ? pupilsData.pupils : []);
    if (list.length) {
      // Normalise to [{name, interventionYear}]
      pupils3in3 = list.map(d => typeof d === 'object' ? d : { name: d, interventionYear: CLASS_YEAR });
    }
  } catch(e) { /* fall through */ }

  // Fallback: any pupil who has completed a session (no interventionYear info)
  if (!pupils3in3.length) {
    pupils3in3 = [...new Set(allData.map(r => r.name))].map(n => ({ name: n, interventionYear: CLASS_YEAR }));
  }

  renderGrid();
  updateMarkBtn();
}

function countPending() {
  let n = 0;
  allData.forEach(s => {
    if (!Array.isArray(s.questions)) return;
    s.questions.forEach(q => { if (q.score === null) n++; });
  });
  return n;
}

function updateMarkBtn() {
  const btn = document.getElementById('mark-btn');
  const pending = countPending();
  btn.disabled = pending === 0;
  btn.title = pending === 0 ? 'No pending answers to mark' : `${pending} answer${pending === 1 ? '' : 's'} waiting to be marked`;
}

// ── Render grid ───────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('pupil-grid');

  if (!pupils3in3.length) {
    grid.innerHTML = `<div class="no-pupils" style="grid-column:1/-1">
      <p>No children are assigned to a 3 in 3 intervention group yet.</p>
      <p style="margin-top:8px;font-size:13px;">Go to <a href="setup.html" style="color:var(--brand)">Setup</a> to add children to a 3 in 3 group.</p>
    </div>`;
    return;
  }

  grid.innerHTML = pupils3in3.map(pupil => {
    const name = typeof pupil === 'object' ? pupil.name : pupil;
    const interventionYear = typeof pupil === 'object' ? pupil.interventionYear : CLASS_YEAR;
    const sessions = allData.filter(r => r.name === name);
    const progress = getProgress(sessions);
    const domains = getDomainScores(sessions);
    return buildPupilCard(name, interventionYear, progress, domains);
  }).join('');
}

function getProgress(sessions) {
  if (!sessions.length) return { sessionsCompleted: 0, currentWeek: 1, currentSession: 'A' };
  const last = sessions[sessions.length - 1];
  return {
    sessionsCompleted: sessions.length,
    currentWeek: last.nextWeek || last.week,
    currentSession: last.nextSession || last.session
  };
}

function getDomainScores(sessions) {
  const totals = { retrieval: {got:0,max:0}, vocabulary: {got:0,max:0}, inference: {got:0,max:0} };
  sessions.forEach(s => {
    if (!Array.isArray(s.questions)) return;
    s.questions.forEach(q => {
      const d = q.domain;
      if (!totals[d]) return;
      totals[d].max += q.max || 1;
      if (typeof q.score === 'number') totals[d].got += q.score;
    });
  });
  const result = {};
  ['retrieval','vocabulary','inference'].forEach(d => {
    const t = totals[d];
    result[d] = t.max > 0 ? Math.round(t.got / t.max * 100) : null;
  });
  return result;
}

function buildPupilCard(name, interventionYear, progress, domains) {
  const initials = name.split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase();
  const progressText = progress.sessionsCompleted === 0
    ? 'Not started'
    : `${progress.sessionsCompleted} session${progress.sessionsCompleted === 1 ? '' : 's'} done`;

  const yrColors = { Y3:'#2e7d32', Y4:'#1798d3', Y5:'#e65100', Y6:'#6a1b9a' };
  const yrBgs   = { Y3:'#e8f5e9', Y4:'#e8f5fd', Y5:'#fff3e0', Y6:'#f3e5f5' };
  const yrBadge = `<span style="font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:${yrBgs[interventionYear]||'#f0f0f0'};color:${yrColors[interventionYear]||'#555'}">${interventionYear} content</span>`;

  const bars = ['retrieval','vocabulary','inference'].map(d => {
    const pct = domains[d];
    return pct === null ? '' :
      `<div class="domain-row">
        <span class="domain-label ${d}">${d.slice(0,3).toUpperCase()}</span>
        <div class="bar-track"><div class="bar-fill ${d}" style="width:${pct}%"></div></div>
        <span class="bar-pct">${pct}%</span>
      </div>`;
  }).join('');

  return `<div class="pupil-card" onclick="showDetail('${name.replace(/'/g,"\\'")}')">
    <div class="pc-header">
      <div class="pc-avatar">${initials}</div>
      <div>
        <div class="pc-name">${name}</div>
        <div class="pc-progress" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${yrBadge} ${progressText}</div>
      </div>
    </div>
    <div class="domain-bars">
      ${bars || '<span class="no-data">No scores yet</span>'}
    </div>
  </div>`;
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function showDetail(name) {
  document.querySelectorAll('.pupil-card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const sessions = allData.filter(r => r.name === name);
  document.getElementById('detail-name').textContent = name;

  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');

  if (!sessions.length) {
    content.innerHTML = '<p class="msg">No sessions recorded yet.</p>';
  } else {
    content.innerHTML = sessions.map(s => buildSessionDetail(s)).join('');
  }

  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
  document.querySelectorAll('.pupil-card').forEach(c => c.classList.remove('active'));
}

// ── View the passage a pupil read ─────────────────────────────────────────────
let textsJson = null;
async function loadTextsJson() {
  if (textsJson) return textsJson;
  const res = await fetch('../texts.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('could not load the texts');
  textsJson = await res.json();
  return textsJson;
}
function closeTextPopup() { const o = document.getElementById('txt-overlay'); if (o) o.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTextPopup(); });
document.addEventListener('click', async function(e) {
  const b = e.target.closest('.txt-btn');
  if (!b) return;
  e.stopPropagation();
  closeTextPopup();
  let title = 'Text', body = '';
  try {
    const all = await loadTextsJson();
    const yr = b.dataset.yr && all[b.dataset.yr] ? b.dataset.yr : CLASS_YEAR;
    const ti = all[yr].sessions[b.dataset.idx];
    const t = ti === undefined ? null : all[yr].texts[ti];
    title = 'Text ' + Math.ceil(Number(b.dataset.idx) / 2) + ' (' + yr + ' content)';
    body = t || 'The text for this session could not be found.';
  } catch (err) {
    body = 'Could not load the text (' + err.message + '). Reload the page and try again.';
  }
  const o = document.createElement('div');
  o.id = 'txt-overlay'; o.className = 'txt-overlay';
  o.innerHTML = '<div class="txt-box"><div class="txt-head"><span></span><button class="txt-close" type="button">Close ✕</button></div><div class="txt-body"></div></div>';
  o.querySelector('.txt-head span').textContent = title;
  o.querySelector('.txt-body').textContent = body;
  o.addEventListener('click', ev => { if (ev.target === o || ev.target.closest('.txt-close')) closeTextPopup(); });
  document.body.appendChild(o);
});

// ── Teacher sets a mark by hand ───────────────────────────────────────────────
const escAttr = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function markButtons(s, q) {
  const max = q.max || 1;
  let btns = '';
  for (let n = 0; n <= max; n++) {
    btns += `<button class="mk${q.score === n ? ' on' : ''}" data-name="${escAttr(s.name)}" data-idx="${escAttr(s.sessionIdx)}" data-key="${escAttr(q.key)}" data-n="${n}">${n}</button>`;
  }
  return `<div class="mk-row">Set mark: ${btns}</div>`;
}
document.addEventListener('click', async function(e) {
  const b = e.target.closest('.mk');
  if (!b) return;
  e.stopPropagation();
  const { name, idx, key, n } = b.dataset;
  const row = b.parentNode;
  row.querySelectorAll('.mk').forEach(x => x.disabled = true);
  const old = row.querySelector('.mk-err'); if (old) old.remove();
  try {
    const r = await jsonpFetch(BACKEND_URL + '?action=set3in3score&name=' + encodeURIComponent(name) + '&idx=' + encodeURIComponent(idx) + '&key=' + encodeURIComponent(key) + '&score=' + encodeURIComponent(n), 15000);
    if (!r || !r.ok) throw new Error((r && r.error) || 'the server did not accept it');
    const s = allData.find(x => x.name === name && String(x.sessionIdx) === String(idx));
    const q = s && Array.isArray(s.questions) ? s.questions.find(x => x.key === key) : null;
    if (q) { q.score = r.score; q.reasoning = 'Marked by teacher.'; q.needsReview = false; }
    document.getElementById('detail-content').innerHTML = allData.filter(x => x.name === name).map(x => buildSessionDetail(x)).join('');
    renderGrid();
  } catch (err) {
    row.querySelectorAll('.mk').forEach(x => x.disabled = false);
    row.insertAdjacentHTML('beforeend', '<span class="mk-err">Not saved: ' + escAttr(err.message) + '</span>');
  }
});

function buildSessionDetail(s) {
  const qRows = Array.isArray(s.questions) ? s.questions.map(q => {
    const scoreHtml = q.score === null
      ? '<span class="score-badge pending" title="Awaiting Claude marking">?</span>'
      : q.needsReview
        ? '<span class="score-badge review" title="Claude marked but flagged for teacher review">⚠ ' + q.score + '/' + q.max + '</span>'
        : q.score >= q.max
          ? '<span class="score-badge correct">✓</span>'
          : '<span class="score-badge wrong">' + q.score + '/' + q.max + '</span>';

    return `<tr>
      <td><span class="domain-chip ${q.domain}">${q.domain}</span></td>
      <td style="color:#555;font-size:13px;">${(q.question||'').replace(/<[^>]+>/g,'')}</td>
      <td style="color:#1a1a2e;font-weight:600;font-size:13px;">${q.answer || '—'}</td>
      <td>${scoreHtml}${markButtons(s, q)}</td>
      ${q.reasoning ? `<td style="font-size:12px;color:#888;max-width:180px;">${q.reasoning}</td>` : '<td></td>'}
    </tr>`;
  }).join('') : '<tr><td colspan="5" style="color:#aaa;font-size:13px;">No question detail available</td></tr>';

  return `<div style="margin-bottom:24px;">
    <div style="font-weight:800;color:#1a1a2e;margin-bottom:8px;font-size:14px;">
      Text ${Math.ceil((s.sessionIdx || 1) / 2)} · Set ${s.sessionSet || 'A'}
      <span style="font-weight:600;color:#9ca3af;font-size:12px;margin-left:8px;">${s.date}</span>
      <button class="txt-btn" type="button" data-idx="${escAttr(s.sessionIdx)}" data-yr="${escAttr(s.interventionYear)}">📖 View text</button>
      ${s.timeTaken && !/NaN/.test(s.timeTaken) ? `<span style="font-weight:600;color:#9ca3af;font-size:12px;margin-left:4px;">· ${s.timeTaken}</span>` : ''}
    </div>
    <table class="history-table">
      <thead><tr>
        <th>Domain</th><th>Question</th><th>Answer</th><th>Score</th><th>Feedback</th>
      </tr></thead>
      <tbody>${qRows}</tbody>
    </table>
  </div>`;
}

// ── Claude marking ────────────────────────────────────────────────────────────
async function triggerMarking() {
  const btn = document.getElementById('mark-btn');
  const msgEl = document.getElementById('mark-msg');
  btn.disabled = true;
  btn.textContent = 'Marking…';
  msgEl.style.display = 'block';
  msgEl.textContent = 'Sending to Claude — this may take a minute…';
  msgEl.className = 'msg';

  try {
    const result = await jsonpFetch(BACKEND_URL + '?action=mark3in3', 60000);
    if (result && result.ok) {
      msgEl.textContent = `✓ Marked ${result.marked || 0} pending answer${result.marked === 1 ? '' : 's'}.`;
      msgEl.className = 'msg ok';
      await loadData();
      // loadData() calls updateMarkBtn() — button will auto-disable if nothing remains
    } else {
      throw new Error();
    }
  } catch(e) {
    msgEl.textContent = 'Marking failed — check connection and try again.';
    msgEl.className = 'msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = '✦ Mark with Claude';
  }
}

// Staff page: Cloudflare Access already checks the sign-in, so there is no PIN.
loadData();
</script>
<p style="text-align:center;font-size:11px;color:#a0b8c8;margin-top:32px;opacity:.7">Y4-06.10.26e</p>
</body>
