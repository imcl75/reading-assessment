 after it. Ben balanced the egg on his spoon once more, and we walked the last few steps side by side. We came last, but nobody in Team Green laughed. They cheered louder than they had cheered all day.","The final event was the team relay. Team Yellow ran brilliantly, and their last runner crossed the line with her arms in the air. When the afternoon was almost over, Mr Evans, the headteacher, stood up to present the prizes. The trophy for the most points went to Team Yellow, who whooped and clapped enthusiastically.","Then Mr Evans smiled. “There is one more cup,” he announced. “It is for the team that showed the best sportsmanship. Today, I watched children help each other up, encourage one another and cheer for their rivals, and I am delighted to award this cup to Team Green.”","I felt as if my chest might burst with pride. I had not won a single race, but it was the best Sports Day I had ever had."]},{"id":"22-6","level":"Level 22","title":"How to Explore a Rock Pool","paras":["A rock pool is a small pool of sea water left behind among the rocks on the seashore. It is a wonderful place to find sea creatures, and you do not need any expensive equipment to look for them. Follow these steps to explore a rock pool safely and to look after the animals that live there.","You will need: a bucket, a small net, a pair of shoes with a good grip, and an adult to come with you.","First, always go with an adult. Ask them to check that the rocks are safe to walk on, and stay where they can see you. Wet rocks and seaweed are slippery, so walk slowly and never run.","Next, fill your bucket with sea water from the pool. This will be a temporary home for any animals you decide to look at more closely.","Then sit quietly beside the pool and watch. Many creatures hide when they feel movement, so give them a few minutes to come out. Look for crabs scuttling sideways, small fish darting between the weeds, and limpets, which are shellfish that stick tightly to the rocks.","After that, look carefully under the seaweed and around the edges of stones. Lift them gently with one hand, and put them back exactly as you found them. Anemones may look like blobs of red or green jelly when they are out of the water, but underwater they open up into a ring of soft, waving tentacles.","If you spot a small animal you would like to see up close, use the net gently to scoop it into the bucket. Never pull a limpet off a rock, and never pick up a crab by its legs. Look for a minute or two, and then tip the animal back into the pool where you found it.","Finally, when you have finished exploring, take away everything that you brought with you, and wash your hands when you get home.","Remember that rock pools are homes, not playgrounds. If you are careful and quiet, you may discover something amazing."]},{"id":"22-7","level":"Level 22","title":"Tenzing Norgay and the Top of the World","paras":["Mount Everest is the highest mountain on Earth. It stands more than 8,800 metres above the sea, in the Himalayas, on the border between Nepal and Tibet. Near the top, the air is very thin, so it is hard to breathe.","The Sherpa people live in the mountains near Everest. They know the paths well and are used to the cold, thin air. Tenzing Norgay was a Sherpa mountaineer. As a young man in 1935, he joined his first expedition to Everest, and over the years that followed he went back to the mountain again and again. By 1953 he had been on six earlier expeditions and knew the mountain better than almost anyone.","In 1953, a British team came to Everest. Its leader was John Hunt, and the team wanted to climb all the way to the top, which nobody had ever managed. Tenzing was chosen as the lead Sherpa, which meant that he helped to look after the other Sherpas. Edmund Hillary, a mountaineer from New Zealand, was also on the team.","The team worked slowly and carefully. They set up a line of small camps higher and higher up the mountain, and they carried food, tents and air tanks up to each one. Everyone had a job to do, and every job mattered.","At last, the day came for Tenzing and Edmund to try for the top. They set off from their highest camp in the early morning. The final part was steep, so they had to help each other. They reached the top at half past 11 on the 29th of May 1953.","They stayed there for only about 15 minutes. Edmund took photographs, and Tenzing later wrote that he pushed some chocolate into the snow as a gift to the mountain, which the Sherpa people hold sacred. Then the two men began the long climb down.","Both climbers said that reaching the top had been a team effort. In 1954, Tenzing became a teacher at a new mountaineering school in Darjeeling, in India, where he trained young climbers for many years."]},{"id":"23-1","level":"Level 23","title":"The Piano Tuner","paras":["Kofi had assumed that his aunt’s job would be dull. When Aunt Efua announced that she would spend Saturday tuning the grand piano in the town hall, he pictured a cluttered room full of clanking tools, rather like a garage. Still, with nothing else planned, he tagged along.","The hall was cool and echoing. On the stage stood a piano, its black surface polished until it gleamed like a mirror. When Aunt Efua lifted the great lid, Kofi gasped, because inside was a maze of shining strings, more than two hundred of them, stretched tightly across a metal frame.","“Every string produces a note,” she explained. “The tighter the string, the higher the note, but strings slowly loosen over time, and then the notes drift out of tune.” She slotted a metal lever onto a peg at the end of one string and turned it by the tiniest amount. “You do not tune a piano with your eyes,” she added. “You tune it with your ears.”","She pressed a single key again and again. Kofi frowned, for at first all he could hear was one steady note, but then he noticed a faint wobble within it, like a distant wah-wah-wah. “That is two strings that ought to sound identical,” said Aunt Efua. “When they disagree, you hear that pulsing. My job is to make it slow down until it disappears altogether.”","To Kofi’s surprise, she let him help. He pressed the key while she turned the peg, and he called out the instant the wobble melted away. “Stop!” he shouted. “There! It has gone.” Aunt Efua grinned. “You have remarkably good ears, Kofi.”","By lunchtime, his neck ached and his ears were tingling, yet he could hear differences that he had never noticed before. When Aunt Efua finally played a tune to test the piano, the notes rang out through the hall, clear and rich, and Kofi felt a surge of pride, as if he had helped to build the instrument himself.","On the way home, he asked whether it bothered her that nobody ever saw what she did. Aunt Efua laughed. “That is the best part,” she said. “If I do my job properly, nobody notices me at all; they only notice the music.”","Kofi gazed out of the window. Perhaps a job did not have to be noisy to be important, and perhaps the quietest work was sometimes the hardest to see."]},{"id":"23-2","level":"Level 23","title":"How a Canal Lock Works","paras":["A canal is a waterway dug by people, and its water lies almost flat. The land it crosses, however, is not flat at all. Hills and valleys mean that the ground rises and falls, and a boat cannot simply sail uphill. To solve this problem, canal builders invented the lock, a clever device that lifts boats up and lowers them down.","A lock is a long, narrow chamber with a heavy gate at each end. On one side of the lock, the canal is higher, and on the other side, it is lower. Each gate has a small opening in it called a paddle, which can be opened and closed to let water flow through. No pumps are needed. The water moves by itself, because water always flows from a higher level to a lower level.","Imagine that a boat is heading uphill. First, the boat enters the lock through the lower gate, which is open. The water in the lock is only as high as the lower canal. Next, the lock keeper closes the lower gate behind the boat and opens the paddles in the upper gate. Water from the higher canal begins to rush into the chamber, and the boat slowly rises with the water.","Eventually, the water inside the lock reaches the same height as the canal ahead. Water stops flowing once both sides are level. Only now can the upper gate be pushed open, because before that, the weight of the water on the other side held it firmly shut. The boat can then sail out and continue on its way at the higher level.","When a boat is heading downhill, everything happens in reverse. The boat enters the full lock through the upper gate, and the gate is closed behind it. Then the paddles in the lower gate are opened, and water drains out of the chamber into the lower canal. The boat sinks lower and lower until it is level with the water on the far side, and then the lower gate can be opened.","Many of Britain’s canals were built more than two hundred years ago, and some are still used today, mainly by narrowboats. A steep hill may need a whole staircase of locks, one after another, so that a boat can climb a great height in easy steps. The idea is simple, but it lets boats travel across hills without any engine doing the lifting."]},{"id":"23-3","level":"Level 23","title":"The Glasshouse","paras":["Outside, the rain hammered on the roof, but inside the glasshouse it was quiet and warm. Grandpa Joe pushed open the door for me and a wave of damp air rolled out to meet us, thick and sweet and smelling of soil. I stepped in, and the door clicked shut behind me, leaving the grey winter afternoon on the other side of the glass.","Every pane was fogged with tiny beads of water, so the whole world outside had melted into a soft, blurry green. Drops gathered on the glass, swelled and then slid down in shining trails. Above my head, a tangle of vines climbed the metal frame, their curling tendrils reaching out like small, searching fingers.","Along the benches sat rows of clay pots, each one crowded with plants. There were tomatoes, hanging in heavy red clusters, and pale green lettuces frilled like paper streamers. At the far end, a single orchid stood in a blue pot, its petals a deep purple, as if it had been dipped in ink. Grandpa Joe said that it had taken him three years to persuade it to flower.","I walked slowly along the narrow path, and the gravel crunched beneath my boots. A watering can dripped steadily in one corner, and each drop landed with a tiny plink. Somewhere near the roof, a bumblebee was buzzing lazily from flower to flower. It seemed to think that it was summer.","It was so warm that I unzipped my coat. The air felt heavy, almost like a blanket, and my glasses misted over. Grandpa Joe laughed and handed me a cloth. “That is the price you pay,” he said. “It is worth it, though, isn’t it?”","I picked a ripe cherry tomato and dropped it into my palm. It was still warm from the air, and its skin was smooth and shiny. When I bit into it, it burst, sweet and sharp, on my tongue. Beyond the glass, the rain drummed on and on, but in there, among the leaves, it felt like a secret place where winter could not reach."]},{"id":"23-4","level":"Level 23","title":"The Sound Makers","paras":["When you watch a film, you hear footsteps on a path, a door creaking open or a horse galloping across a field. You might think that these sounds were recorded while the film was being made, but most of them were not. They were added afterwards by a Foley artist, who has one of the most unusual jobs in the film industry.","The job is named after Jack Foley, a sound pioneer who worked in films almost a hundred years ago. A Foley artist works in a special studio. They watch the film on a screen and make each sound at exactly the right moment. If a character steps on to gravel, the Foley artist walks on a tray of real gravel in perfect time with the picture.","Why are the sounds not simply recorded when the film is made? One reason is that the microphones on a film set are aimed at the actors’ voices. Other noises are often too quiet, too muddled or drowned out by the crew nearby. Also, some things you see on screen make no sound at all, or do not exist in real life, such as a dragon flapping its wings.","So Foley artists collect strange objects and use them in surprising ways. The clip-clop of a horse can be made by knocking two coconut shell halves together. Crumpling a sheet of cellophane sounds very like a crackling fire. A pair of leather gloves, flapped quickly, makes the sound of a bird’s wings. Even the crunch of footsteps in snow can be created by squeezing a packet of cornflour.","To be good at the job, a Foley artist needs sharp ears, good timing and a lot of imagination. They listen carefully to the sounds around them and think, “What could I use to copy that?” Often the real thing does not sound right on film, and something quite different works far better. A real fire, for instance, may sound flat and quiet, while the cellophane sounds lively.","Many of the noises we think of as real are actually cleverly disguised props. The next time you watch a film, listen closely. Somewhere behind the screen, a Foley artist may have been waving a pair of gloves in a quiet studio."]},{"id":"23-5","level":"Level 23","title":"The Sandcastle Contest","paras":["The whole beach seemed to be buzzing. Flags fluttered above a long table, and families were already marking out squares in the sand with sticks and spades. It was the day of the Sandcastle Contest, and twins Idris and Halima had been planning for weeks.","“We will build the tallest castle anyone has ever seen,” declared Idris, dragging a bucket to the water’s edge. “With four towers and a moat.”","“And a drawbridge,” added Halima. “Made from a lolly stick.”","They worked for nearly two hours. Idris packed the wet sand into the bucket and tipped out perfect towers, while Halima carved windows with the edge of a shell and lined the walls with tiny pebbles. The castle rose until it stood almost as high as their knees. The sun beat down on their backs, and their fingers were wrinkled and gritty, but neither of them noticed.","At last, Halima stepped back and clapped. “It is perfect,” she breathed.","Just then, a golden retriever came bounding down the beach after a ball. With a single great leap, it crashed through the north tower and skidded straight across the middle of the castle, spraying sand in all directions.","The dog’s owner ran up, apologising. “I am so sorry!” she gasped. “I will help you rebuild it.” But the judges were already walking along the row, with only ten minutes left.","Idris stared at the heap of sand. His eyes stung, and he swallowed hard. Halima was not upset. She was studying the wreckage with her head on one side, as if she were reading a map.","“Look,” she said slowly. “It has gone all crumbly and mysterious. What if it is not a new castle any more? What if it is a ruin, thousands of years old?”","Idris blinked. Then his face split into a grin. Together, they scooped out a tunnel and stuck the lolly-stick drawbridge in at a slanting angle. They sprinkled seaweed on top of the fallen towers and set a shell on the highest pile of sand, like a flag.","When the judges reached them, Halima put on her grandest voice. “Welcome to the Lost City of Sandalia,” she said. “It was destroyed long ago by a mighty golden beast.”","The judges laughed out loud. That afternoon, a ribbon was pinned to the ruin, and it was not for the tallest castle. It said Most Imaginative."]},{"id":"23-6","level":"Level 23","title":"Mary Anning, Fossil Hunter","paras":["Mary Anning was born in 1799 in Lyme Regis, a small seaside town on the south coast of England. Her family was poor, and her father made furniture. In his spare time, he searched the nearby cliffs and beaches for fossils, which are the remains of animals and plants that lived long ago and have turned to stone. He sold the best ones to visitors to earn extra money.","When Mary’s father died, the family had very little money. Mary and her brother Joseph carried on searching for fossils to sell. The cliffs near their home were crumbling, and after heavy storms, new fossils were often left lying on the beach. Mary learned to spot them among the stones. She had to keep a sharp eye out, for the sea could wash them away.","When Mary was about twelve, Joseph found a strange skull sticking out of the cliff. It was long and narrow, with a great many sharp teeth. Over the next year, Mary carefully dug out the rest of the skeleton with a small hammer and brush. It took her months, and she had to work in bad weather. Scientists later decided that it belonged to a huge sea reptile called an ichthyosaur, which had lived millions of years before.","The find made Mary well known. Even so, it was hard for her to be taken seriously. She was a girl from a poor family, and at that time, most scientists were wealthy men. Many of them bought her fossils and wrote about them, but they did not always mention her name.","In 1823, Mary made another great discovery. She unearthed the first complete skeleton of a plesiosaur, another sea reptile, which had a small head and a very long neck. Some experts could not believe that an animal so odd had ever existed, and at first they thought the skeleton must be a fake. However, other scientists examined it closely and agreed that it was real.","Mary spent the rest of her working life hunting for fossils and selling them from a little shop in Lyme Regis. Visitors came from far away to see her collection and to learn from her. Today, her discoveries are on display in museums, and she is remembered as one of the most important fossil hunters in history."]},{"id":"23-7","level":"Level 23","title":"Racing Down the Track","paras":["Tanni Grey-Thompson is one of Britain’s most successful athletes. She was born in Cardiff, the capital city of Wales, in 1969. Tanni was born with a condition called spina bifida, which affects the spine and can make it difficult to walk. From the age of seven, she has used a wheelchair to get around.","Tanni loved sport as a child and began wheelchair racing when she was a teenager. A racing wheelchair is very different from the one used every day. It is long and light, with two large wheels at the back and usually a smaller one at the front. Racers sit low and push the wheels with special gloves to make them spin faster.","Wheelchair racing takes great strength and skill. Racers must build up powerful arms and shoulders, and they have to learn to steer at high speed. Tanni trained hard for many hours every week.","Her hard work paid off. In 1988, she went to the Paralympic Games in Seoul, where she won a bronze medal in the 400 metres. The Paralympic Games are a great sporting event for athletes with disabilities. Four years later, at the 1992 Games in Barcelona, she won four gold medals, in the 100, 200, 400 and 800 metre races.","Over her career, Tanni took part in five Paralympic Games. She won 16 medals altogether, and 11 of them were gold. She also won the London Marathon wheelchair race six times, and she set more than 30 world records. In 2004, at the Athens Games, she won two more gold medals in the 100 and 400 metre races.","Tanni also cared about helping others. She studied at university in England. Later she spoke up for disabled people, so that they could join in sport and everyday life more easily.","In 2005, she was made a Dame, an honour given by the King or Queen for outstanding work. Five years later, she joined the House of Lords, where politicians discuss and check the laws of the country. Tanni had gone from racing on the track to helping to shape the rules for everyone.","Many people see Tanni as an inspiring example. She has shown that with courage, practice and determination, a person can achieve remarkable things."]},{"id":"24-1","level":"Level 24","title":"How Bats Find Their Way","paras":["Bats are the only mammals that can truly fly, and most of them come out at night. There are more than a thousand kinds of bat, from tiny bats no bigger than a bumblebee to giant fruit bats with wings over a metre wide. In the dark, it is almost impossible to see, so most bats that hunt insects use a clever trick to find their way. This trick is called echolocation.","As a bat flies, it makes high-pitched squeaks that are too high for people to hear. The sounds travel through the air until they hit something, such as a tree, a wall or an insect. Then the sound bounces back to the bat as an echo.","The bat’s large ears catch the echo. Its brain works out how long the sound took to return. A short delay means the object is close, while a longer delay means it is further away. The pattern of the echo also tells the bat what shape the object is and whether it is moving.","Using echolocation, some bats can find a tiny moth in complete darkness. As the bat gets closer to its prey, it makes its squeaks faster and faster, like a drummer speeding up. This gives the bat a more and more exact picture of where the moth is. Some moths have learned to fight back. They can hear the bat’s squeaks and dive towards the ground to escape.","Some bats spend the whole day hanging upside down in caves, then leave together in huge groups at sunset. With thousands of bats squeaking at once, you might think they would get confused, but each bat seems able to pick out its own echoes from all the noise.","Echolocation also stops bats from crashing into things. They can even dodge a thin wire! Without this skill, a bat flying through a dark forest would keep hitting the trees. Scientists believe that echolocation helps bats to survive, because it allows them to hunt when there are fewer predators around and less competition for food.","People have copied the bat’s trick. Ships use a machine called sonar to send out sounds and listen for the echoes. By timing the echoes, sailors can find out how deep the sea is and whether there are rocks ahead. Dolphins also use echolocation, sending clicks through the water to find fish. It seems that nature invented the idea long before we did."]},{"id":"24-2","level":"Level 24","title":"The Pea That Did Not Matter","paras":["Queen Marguerite of Thornbury had one strict rule for choosing a bride for her son, Prince Rohan: the girl must be a true princess. “A true princess has such delicate skin,” the Queen liked to declare, “that she can feel a single pea beneath twenty mattresses.” Nobody had ever dared to argue with her, although several courtiers had privately wondered whether it was true.","One drizzly evening, a young woman knocked at the castle door, her boots caked in mud and her cloak soaked through. “I am no princess, only Nell,” she said. “My cart has lost a wheel on the road, so please may I shelter in your barn tonight?” The Queen looked her up and down before whispering to the maid, “She insists that she is not a princess, but that is exactly what a clever princess would say.”","Dot, the maid, was instructed to place a pea at the very bottom of a tall tower bed and to pile twenty soft mattresses on top of it. Dot did as she was told, more or less. Then Nell climbed the ladder, yawned, and was fast asleep before the candle had stopped smoking.","At breakfast, the Queen leaned forward eagerly. “Tell me, my dear, did you feel anything strange in the night?” Nell stretched contentedly. “I slept like a log,” she replied. “I have slept in haystacks, on ferry decks and once in a wheelbarrow, so that was the softest bed I have ever known.” The Queen was so dismayed that she dropped her spoon into her porridge.","Prince Rohan, who had been listening from the doorway, burst out laughing. “Mother, Nell has travelled all the way from the coast,” he said. “She mends carts and sells honey in every village along the road, so of course she was tired!” Nell held out a small jar. “This is to say thank you for the bed.” Then, very quietly, Dot cleared her throat. “Your Majesty, I must confess something. I took the pea out, because the poor girl looked so weary that it did not seem fair.”","For a long moment, nobody spoke. Then the Queen tasted a spoonful of honey and, to everyone’s astonishment, she smiled. “It is very good honey,” she admitted. “Perhaps I have been asking the wrong question, because a pea cannot tell me whether someone is kind.” That afternoon, the Prince and Nell mended the broken cart wheel together, while the pea was planted in the castle garden, where by summer it had grown into a tall, leafy plant covered in sweet green pods."]},{"id":"24-3","level":"Level 24","title":"Our Neighbours in Space","paras":["The Solar System is made up of the Sun and everything that travels around it. The Sun is a star, a giant ball of hot, glowing gas, and its pull is so strong that it holds eight planets in orbit around it. An orbit is the curved path that one object follows as it travels around another. The Sun’s light is so far away that it takes about eight minutes to reach Earth.","The four planets closest to the Sun are Mercury, Venus, Earth and Mars. They are made mostly of rock, and they are small compared with the planets further away. Mercury is the closest to the Sun and the fastest mover, completing one orbit in just 88 days. Venus, however, is the hottest planet. Its thick clouds trap heat like a blanket, so its surface is hotter than an oven. Mars is known as the red planet because its soil contains rusty iron.","Beyond Mars lie the giants. Jupiter is the biggest planet of all, and more than a thousand Earths could fit inside it. It is made mostly of gas, so there is no solid ground to stand on. Saturn is famous for its rings, which are made of ice and rock. The pieces range from tiny specks to large chunks. Saturn is also very light for its size. Scientists say that it would float in water, if anyone could find a bath big enough!","Uranus and Neptune are the two planets furthest from the Sun. They are freezing cold places that are very hard to spot from Earth, and they look blue because of a gas called methane in the air around them. Because they are so far out, they take a very long time to travel around the Sun. One year on Neptune lasts about 165 Earth years.","How do we know so much about worlds we cannot visit? Scientists send spacecraft called probes. Probes have flown past every planet in the Solar System, taking photographs and measuring what they find. A probe called Voyager 2 was launched in 1977, and it is still the only one to have visited Uranus and Neptune. Its journey shows that, even in space, there is always something new to discover."]},{"id":"24-4","level":"Level 24","title":"The Rules of the Den","paras":["By Saturday morning, the den beneath Yusuf’s apple tree was finally finished. It had taken three weekends, two balls of string and a great deal of arguing, but the walls of old pallets stood firm, and a blue tarpaulin stretched across the top like a roof. Yusuf’s best friends, Poppy and Tomasz, stepped back to admire it.","“Right,” said Poppy, producing a crumpled sheet of paper from her pocket. “Every proper den needs rules. Rule one: members only. Rule two: nobody enters without the password. Rule three: no little brothers or sisters.” She glanced pointedly towards the house, where Yusuf’s sister Zara was watching through the kitchen window.","Yusuf felt his face grow warm. “Zara is only six,” he muttered. “She has been helping me carry things all month.” “That is exactly the problem,” said Poppy. “She will touch everything and tell the whole street our password.” Tomasz shuffled his feet and studied the grass, clearly wishing that he were somewhere else.","“It is my garden,” said Yusuf. “It was my idea,” said Poppy. For several minutes neither of them would give way, and the silence between them grew as heavy as the clouds gathering above the apple tree.","The first drops of rain settled the argument, though not in the way anyone expected. Within seconds the wind had whipped the tarpaulin free at one corner, and it flapped wildly, threatening to tear the whole roof away. The three friends grabbed at it, but the rope kept slipping through their cold, wet fingers.","Then Zara appeared, wearing her wellingtons and a raincoat two sizes too big. Without a word, she scrambled underneath, took the rope from Yusuf and looped it round a pallet in a neat, tight knot. “Our Beavers leader showed me,” she said. “It is called a clove hitch, and it never comes undone.” She tied the other three corners in exactly the same way, and the tarpaulin stopped flapping.","Crouched inside the dry, dim den, listening to the rain drumming on the roof, Poppy glanced at her crumpled list. Slowly, she took a pencil, crossed out the third rule and scribbled something new underneath. “Rule three,” she read aloud, a little sheepishly. “Anyone who can tie a proper knot is welcome.” Zara beamed so widely that Yusuf could not help grinning too."]},{"id":"24-5","level":"Level 24","title":"A River’s Journey","paras":["Every river begins as a small trickle of water. This starting place is called the source, and it is often high in hills or mountains. Some rivers begin instead at a lake or a boggy patch of ground. Here, rain that has soaked into the ground bubbles out as a spring and begins to run downhill. Rivers always flow downhill because gravity pulls water towards the lowest ground.","Near the source, the river is narrow, shallow and fast, because the slope is steep. Even a small stream can be surprisingly powerful when it is moving quickly. The rushing water carries stones and pebbles that scrape at the river bed and banks. Over thousands of years, this wears away the rock and carves a V-shaped valley. Waterfalls can form where the river tumbles over a hard ledge of rock.","As the river travels on, smaller streams called tributaries join it, so it grows wider and deeper. The land becomes flatter, and the river slows down and begins to bend. On the outside of each bend, the water flows faster and wears away the bank. On the inside, the water flows more slowly, so it drops mud and sand. Over time, the bends grow into large loops called meanders.","Near the end of its journey, the river is wide and slow, and it flows so gently that it hardly seems to move at all. It carries fine mud called silt. After heavy rain, a river may burst its banks and spread across the flat land on either side, which is known as the floodplain. When the water drains away, it leaves a layer of silt behind. Silt is full of goodness that plants need, so floodplains often have some of the richest soil for growing crops.","Finally, the river reaches its mouth, where it flows into a sea or a lake. The water does not stay there for ever. The Sun’s heat turns water from the surface into an invisible gas called water vapour. This is called evaporation. High in the sky, the vapour cools and forms clouds. When the clouds become heavy, the water falls as rain, and it soaks into the hills once more. The journey then begins again. This never-ending journey is called the water cycle."]},{"id":"24-6","level":"Level 24","title":"Mum’s Saturday Secret","paras":["For three weeks, Mum had been disappearing every Saturday morning. She always said the same thing: “Just popping out,” and she always came back at lunchtime with sawdust in her hair. My twin sister, Aaliyah, and I had a theory. “Mum has a secret,” Aaliyah whispered, “and it is a woodwork one.”","Aaliyah kept a list of clues in her notebook. Clue one was the sawdust. Clue two was a paintbrush we found hidden behind the sofa. Clue three was Dad, who whistled cheerfully whenever we asked a question, and who always seemed to be standing in front of the loft ladder. “Nothing to see here!” he would say. It was the worst acting I had ever seen.","On the Saturday before our birthday, Grandad arrived early with a bag of sandwiches. “I am taking you both to the park for the morning,” he announced. “Not a word to your mother.” We fed the ducks and ate all the sandwiches, but Aaliyah kept glancing at her watch. “They are up to something,” she muttered.","When we got home at one o’clock, Mum and Dad tied scarves over our eyes and led us up the stairs. I could hear the ladder creak. “Ready?” asked Mum. Then the scarves fell away, and my heart was racing.","I did not recognise the loft. The dusty boxes had gone. In their place stood tall bookshelves painted sunshine yellow, a heap of squashy cushions, and a round window that let in a beam of light. The whole room glowed like the inside of a lantern. Above the door, a hand-painted sign read, “Aaliyah and Daniel’s Library.”","“I built the shelves at Uncle Rob’s workshop,” said Mum, brushing sawdust from her hair. “That is where the sawdust came from. I wanted you to have somewhere quiet to escape to when the world feels too loud.” I could not say a single word. Aaliyah found a brand-new book with both our names inside the cover, and she hugged it to her chest.","“Someone has to test the beanbags,” said Dad, and he flopped down first. We spent the whole afternoon reading. Before bed, Aaliyah opened her notebook and, under her list of clues, wrote two words in capital letters: “MYSTERY SOLVED.”"]},{"id":"24-7","level":"Level 24","title":"Round the World in Seventy-Two Days","paras":["Nellie Bly was a newspaper reporter who worked for the New York World, a paper that thousands of people read every day. Nellie was fond of adventure, and in 1888, she had a bold idea. Many readers knew a famous story by Jules Verne, in which a gentleman called Phileas Fogg travels around the world in eighty days. Nellie wondered whether a real person could do the same, or even do it faster. She asked her editor if she could try.","On the 14th of November 1889, Nellie boarded a steamship at Hoboken, a port near New York, and set off across the Atlantic Ocean. She wanted to move quickly, so she took just one small bag. The crossing took eight days, and she then went on to France by train and boat. There, in the town of Amiens, she visited Jules Verne himself. He wished her luck and told her that if she finished in seventy-nine days, he would applaud with both hands.","For weeks after that, Nellie hurried from one place to the next by train and by ship. She passed through the Suez Canal, a waterway that joins two seas, and visited Colombo, Singapore, Hong Kong and Japan. In Singapore, she bought a pet monkey. Every ship and train had to leave on time, because a single delay could wreck her plan. The longest stretch of all was the voyage across the Pacific Ocean, which lasted fourteen days.","When Nellie reached San Francisco, her newspaper arranged a special train to carry her across America. At 51 minutes past 3 o’clock in the afternoon on the 25th of January 1890, the train pulled into Jersey City, close to where she had begun. Nellie had travelled about 25,000 miles in 72 days, 6 hours and 11 minutes. She had beaten Phileas Fogg’s made-up record by more than a week.","Nellie did not know it at first, but she was in a race. A reporter named Elizabeth Bisland had left New York on the same day, heading around the world in the opposite direction for a magazine. Elizabeth was still travelling when Nellie arrived home, and Nellie won by about four days.","Nellie’s journey showed what a determined reporter with one small bag could do. Her newspaper printed stories about the trip, so that readers could follow what she had seen and done."]},{"id":"25-1","level":"Level 25","title":"The Final Leg","paras":["The stadium was much bigger than Kai had imagined. Rows of empty seats curved around the running track, and the loudspeaker crackled as an announcer read out the names of schools from all over the district. Kai gripped the cold metal baton until his knuckles turned pale. He was the last runner in the Year 6 relay, and he could not stop thinking about last Tuesday, when he had fumbled the baton in practice and it had clattered across the tarmac.","“Breathe,” said Ms Bell, the coach, crouching beside him. “Your job is simple. Take the baton, run as fast as you can, and trust your legs.” Kai nodded, though his stomach felt like a washing machine. Behind him, Grace, Omar and Priya were shaking out their arms and jogging on the spot. Grace would run first because she had the quickest start. Omar and Priya would follow, and Kai would take the final stretch.","The whistle blew, and Grace shot away like a released spring. By the time she reached Omar, Elm Park were lying second. Omar ran steadily, but on the second leg a tall runner from Hillcrest swept past him, and the gap began to widen. Priya dug in her heels and pushed with every ounce of strength she had. When she arrived at the changeover, Elm Park were in third place, only a few metres behind the leaders.","“Go, Kai!” Priya gasped. He was already moving, one arm stretched out behind him, his eyes fixed on the track ahead. For a heartbeat he felt nothing. Then the baton slapped perfectly into his palm. The roar of the crowd seemed to fade away, and everything he had feared vanished, replaced by the steady thump of his trainers on the track.","On the final bend, Kai overtook the runner in front. Now only one runner stood between him and the finish line, and that runner was tiring. Ten metres. Five metres. Kai lunged for the tape at the same moment as the leader, but the leader crossed first, by only the tiniest bit.","Kai bent over with his hands on his knees, gasping for breath. Then Grace crashed into him with a hug, and Omar and Priya piled in behind. “Second!” Grace shouted. “In the whole district!” Ms Bell hurried over, beaming. “Every changeover was perfect,” she said. “That is the hardest part of a relay, and you did it brilliantly.” Kai looked down at the silver medal hanging around his neck. He realised that, for the whole of the last leg, he had not once thought about dropping the baton."]},{"id":"25-2","level":"Level 25","title":"The Human Heart","paras":["The human heart is a muscle about the size of your clenched fist, and it never takes a rest. It beats without you ever having to think about it. It sits in the middle of the chest, slightly to the left, and is protected by the ribs. Its job is to pump blood around the body. Blood carries oxygen, a gas from the air we breathe, and goodness from our food to every part of us. Without a constant supply, the body’s cells could not work.","Inside, the heart has four hollow spaces called chambers. The two upper chambers are known as atria, and the two lower chambers are known as ventricles. Blood first flows into the atria. Next, the ventricles squeeze hard to push it out. As they squeeze, small flaps called valves shut, so that the blood cannot slip backwards. Then the ventricles relax, and the whole cycle starts again. The valves work like tiny doors that open one way only. The “lub-dub” sound that a doctor hears through a stethoscope is the sound of the valves closing.","Blood travels through tubes called blood vessels. Arteries carry blood away from the heart, while veins carry it back. The finest tubes are the capillaries, which are thinner than a hair, and they reach every corner of the body. A single drop of blood can travel all the way around the body in about a minute.","When an adult is resting, the heart beats roughly 70 times a minute. That adds up to more than 100,000 beats every day. Children’s hearts are smaller and usually beat a little faster. During exercise, the muscles need extra oxygen, so the heart speeds up to deliver it. You can feel each beat as a pulse in your wrist or neck. If you count the beats for one minute, you have measured your heart rate. Your heart rate also rises when you feel excited or nervous, which is why your heart may thump before a race.","Like any muscle, the heart grows stronger with exercise. A stronger heart can pump more blood with each beat, so it does not need to beat as often when the body is resting. This is why athletes often have slower resting heart rates than other people. Eating a balanced diet and sleeping well also help to keep the heart healthy. Doctors recommend that children get plenty of active play every day."]},{"id":"25-3","level":"Level 25","title":"A Day at a Victorian School","paras":["In the 1880s, a law made school compulsory for children aged between five and ten. Before then, many children had worked in fields or factories instead. Families often paid a few pennies each week for a child’s lessons, and this continued until 1891. A day at a typical village school began early and followed strict routines.","Children arrived by half past eight. Many had walked several miles, and boys and girls often entered by separate doors. When the bell rang, everyone lined up in silence. The teacher inspected each child for clean hands and tidy clothes before allowing them inside.","The classroom was crowded. A single teacher might teach fifty children of different ages, with the help of older pupils called monitors. Children sat in rows on hard wooden benches, facing the front. Younger pupils wrote with chalk on small slates, which could be wiped clean and used again because paper was expensive. Older pupils practised writing with a dip pen and a pot of ink, and blots were common.","The morning was for “the three Rs”: reading, writing and arithmetic. Pupils chanted their spelling and their times tables aloud until they knew them by heart. Learning by repeating was thought to be the best way of remembering. Anyone who chattered or daydreamed might be made to stand at the front of the room while the class carried on.","At midday, the children ate a simple lunch brought from home, usually bread and cheese, often sitting on the ground in the yard. They played outside, skipping with ropes, spinning wooden tops or rolling hoops along the ground. There were no toys with batteries or screens, so children made up their own games.","After lunch, the girls often practised needlework, sewing samplers with tiny, neat stitches, while the boys might do drill or drawing. On some afternoons, the school held lessons called object lessons, where the teacher showed a real item, such as a piece of coal or a seashell, and asked questions about it.","By four o’clock, the children lined up once more to say a prayer and to recite a poem before going home. Many hurried off to help with jobs such as feeding animals or fetching water. It was a long day, but for many children, it was the first time that they had ever been taught to read."]},{"id":"25-4","level":"Level 25","title":"The Harbour Before Sunrise","paras":["The harbour is still asleep when I arrive, wrapped in a blanket of cool, grey half-light. Nothing moves except the water, which slaps softly against the stone wall and slides away again, over and over, like someone breathing in their sleep. The air tastes of salt and rope and cold metal, and my breath hangs in front of me in small white clouds.","Along the quay, the boats bob at their moorings in tidy rows. There are rowing dinghies painted in faded reds and blues, a squat little ferry with a striped funnel, and a tall sailing boat whose mast rocks slowly from side to side, ticking against its ropes like a clock. Each boat has a name lettered on its stern in curling gold paint: Wren, Sea Biscuit, Marigold. I wonder who chose them, and whether they still remember why.","Then the sky begins to change. First, a thin line of pale pink creeps along the horizon, as if someone were drawing it with a fine pencil. Slowly the line widens and deepens, spilling orange across the clouds and washing the whole bay in a glow the colour of apricots. The windows of the tall, narrow houses on the hill catch the light one by one, and they flash as though they were waking up and winking at the sea.","Now the harbour begins to stir. A gull lands on a bollard and lets out a harsh, scornful cry, and within seconds the air is full of white wings and squabbling. Somewhere behind me a door bangs, and the smell of warm bread drifts down from the bakery at the end of the lane. A ferry worker in a yellow jacket strolls along the quay, jangling a bunch of keys. She unlocks the hatch of the ferry, and the engine coughs, splutters and then settles into a low, comfortable purr.","By the time the sun finally lifts clear of the water, everything has changed. The grey has melted away, and the harbour blazes with colour: the red of the dinghies, the gold of the lettering, the deep green of the weed on the steps. Even the puddles on the cobbles are shining. I sit on the edge of the wall with my feet dangling and my hands wrapped round a warm bread roll, and I decide that this is the best hour of the whole day."]},{"id":"25-5","level":"Level 25","title":"Why Every School Needs a Garden","paras":["Imagine a school where the playground has a corner full of beans, sunflowers and buzzing insects, and where pupils sometimes learn with soil on their hands. This is not a dream. Many schools already have gardens, and there are strong reasons why every school should do the same.","Firstly, a garden is a living classroom. Children can see for themselves how a seed becomes a plant, and how bees carry pollen from flower to flower. Lessons in science, maths and writing become far more memorable when they are linked to something real. Measuring the height of a sunflower or weighing a harvest of potatoes is much more exciting than working from a book.","Secondly, gardens can help pupils to eat more healthily. Studies suggest that children are more willing to try vegetables they have grown themselves. A pupil who might refuse a carrot at lunch may happily crunch one that they have pulled out of the ground and washed in the school sink.","Thirdly, gardening is good for our wellbeing. Digging, watering and weeding are calm activities that give children a break from screens and noise. Being outdoors in the fresh air can help pupils to feel more relaxed, and many find it easier to concentrate afterwards. A garden also teaches patience, since plants cannot be hurried.","Finally, gardens help nature and bring people together. Flowers and shrubs provide food for bees, butterflies and birds, and a small pond can become a home for frogs. Working together to look after a plot teaches teamwork, because every job, from planting to picking, needs someone to do it.","Some people argue that school gardens cost too much money and take up valuable lesson time. However, a garden does not need to be expensive. Seeds are cheap, and tools can be donated by families or local shops. Nor does it need to be big: a few raised beds or even some containers on a windowsill are enough to begin. As for lesson time, gardening is not an extra. It can be part of the lessons children are already having.","In conclusion, a school garden helps children to learn, to eat well, to feel calm and to care for the world around them. With so many benefits and so few drawbacks, it is hard to see why any school would say no. Every school should plant a garden and watch it grow."]},{"id":"25-6","level":"Level 25","title":"The Night the Tent Came Down","paras":["Zainab had packed the rucksack herself, and she was rather proud of it. It held torches, spare socks, a bag of marshmallows and, tucked into a side pocket, a small repair kit that Grandad had pressed into her hand before they left. “You never know,” he had said. Zainab had rolled her eyes, but she had packed it anyway.","By late afternoon, Dad and her younger brother Idris had put up the tent in a sheltered corner of the campsite, right beside a chattering stream. They cooked sausages on the stove, toasted the marshmallows until they were black and gooey, and watched the sun slip behind the hills. When it grew dark, the three of them wriggled into their sleeping bags and lay listening to the water. “This,” murmured Dad, “is the life.”","Zainab woke suddenly in the middle of the night. The tent walls were flapping like enormous wings, and the wind was howling around the campsite. Then came a sharp crack, and one side of the tent folded slowly inwards, draping cold, damp fabric over her face. “Dad!” squealed Idris. “Everyone stay calm,” said Dad, fumbling for the torch. “A pole has snapped, that is all.”","There was no question of mending it in the dark. Dad bundled the children into their sleeping bags, carried them across the field one at a time, and settled them on the back seat of the car, where the wind could not reach them. Rain began to patter on the roof. Idris fell asleep almost at once, but Zainab lay awake, thinking about the tent and about the little kit in her rucksack.","By morning the wind had died, and the sky had turned a clean, rinsed blue. The tent lay crumpled on the grass like a giant, deflated balloon, with the broken pole poking out at a sorry angle. Dad scratched his head. “We may have to go home,” he said. “I cannot see how to fix that.”","“Wait,” said Zainab. She fetched the repair kit and unrolled it on the grass. Inside lay a short metal sleeve, exactly the right width, and a roll of strong tape. She slid the sleeve over the crack, as Grandad had once shown her, and wound the tape tightly round it until the pole stood straight again. Dad stared. Then, very slowly, he began to laugh.","By breakfast time the tent was standing once more, a little crooked but perfectly sound. Zainab sat in the sunshine with a bowl of steaming porridge, and Idris held out a marshmallow on a stick. “Next time,” said Dad, “you are in charge of the packing.” “Next time,” grinned Zainab, “I am also in charge of the tent.”"]},{"id":"25-7","level":"Level 25","title":"Alone on the Ocean","paras":["Ellen MacArthur was born on the 8th of July 1976 in Derbyshire, a county in the middle of England, far from the sea. As a young child, she went out on a boat belonging to her aunt on the east coast, and she loved it at once. From then on, Ellen dreamed of sailing. She saved her money for years until she could buy a small dinghy, which is a little boat with a single sail, and she began to learn how to handle it.","Ellen worked hard to improve, and soon she was sailing longer and longer distances. Her next goal was more ambitious. She wanted to enter the Vendée Globe, a race in which each sailor travels around the world alone, without stopping and without any help. It is one of the hardest challenges in sailing, and it takes months to complete. In 2001, Ellen finished the race in second place. She was only 24, and at that time she was the youngest person to have finished it.","Ellen was not finished. She wanted to try to beat the world record for sailing around the world alone. To do this, she needed a much faster boat, so she sailed a trimaran, which has three long, narrow hulls instead of one. Her boat, called B&Q, was about 23 metres long. In November 2004, she set off from Falmouth, a port in the south-west of England, and sailed alone across the seas for the next ten weeks.","During the voyage, Ellen could only snatch short naps, because the boat needed her attention all the time. She also had to mend and steer the boat by herself. Even so, she kept going, one day after another, until the finish was in sight.","On the 7th of February 2005, Ellen sailed back into Falmouth. Her journey had taken just over 71 days, which was more than a day faster than any sailor before her. Thousands of people crowded the harbour to cheer, and boats of every size sailed out to meet her. She was 28 years old. Soon afterwards, she was given the title of Dame, and she was the youngest person to have received it at the time.","Ellen used her fame to help others. In 2003, she had set up a charity which takes young people sailing to help them rebuild their confidence. Later, in 2010, she launched the Ellen MacArthur Foundation. Its aim is to encourage people and businesses to use things again and again, so that less is wasted. Ellen’s journeys showed what a person with a big dream and plenty of patience could do."]},{"id":"26-1","level":"Level 26","title":"The Canoe on Crane Lake","paras":["Theo and his cousin Elsie had waited the whole year for the canoe trip. Their uncle Tomas, who managed the outdoor centre on Crane Lake, had promised that this summer they could paddle out to Heron Island by themselves. “Hug the shore until you reach the reeds,” he said, handing them each an orange life jacket, “and after that it is a straight line across. You will be there in twenty minutes.” Then he pressed a small compass into Elsie’s palm. “Just in case,” he added, with a wink.","The lake lay flat and silver in the early light, and the canoe glided over it almost without a sound. Theo sat at the front and Elsie at the back, and their paddles dipped in perfect time while a pale mist hung low over the water. Heron Island was a dark smudge on the horizon, and it seemed to grow larger with every stroke.","Halfway across, however, the mist thickened until it rolled over the surface in heavy white folds, swallowing the shore behind them and then the island ahead. Theo turned his head this way and that, but there was nothing to see except grey. “Which way now?” he asked. Elsie stopped paddling. “I thought you were watching the island,” she said. “I was,” Theo replied, “right up until it vanished.”","Then Elsie remembered the compass in her pocket. “Uncle Tomas said the island lies north-east of the jetty,” she said slowly. “If we follow the needle, we ought to reach it.” She balanced the compass on her knee and waited while the needle trembled and finally settled. Theo noticed that her hands were not quite steady, although her voice sounded perfectly calm. “Steer us that way,” she said, “and I will tell you whenever we begin to drift.”","It was slow, careful work. Theo counted his strokes aloud in a voice that was a little thinner than usual, and after every fifty strokes Elsie checked the needle. Somewhere in the whiteness a heron called, and both cousins jumped so violently that the canoe wobbled. The minutes stretched out, and Theo began to wonder whether they had chosen the wrong direction after all.","Just as his arms began to ache, a row of dark pine trees loomed out of the mist, and the front of the canoe scraped onto a beach of small grey pebbles. Theo let out an enormous breath, and Elsie began to laugh, softly at first and then so helplessly that the canoe rocked beneath them. Far behind them, a horn sounded across the water. Uncle Tomas had seen the mist rolling in from the jetty, and he was already on his way to find them.","“Next time,” said Theo, wiping his forehead, “I will watch the compass as well as the island.” Elsie shook her head, smiling. “Next time,” she said, “we both will.”"]},{"id":"26-2","level":"Level 26","title":"The Mill at the Bottom of the Sea","paras":["Long ago, in a cold northern land of steep fjords and dark pine forests, there lived a fisherman named Anders, who was so poor that in some winters his family had nothing to eat but turnips and a little stale bread. One morning, while he was mending his nets on the shore, a stranger with long grey braids stopped beside him and studied him thoughtfully. “You look like someone who shares whatever they have,” said the stranger. “I have a gift for you.”","From beneath her cloak she drew a small stone mill, no bigger than a loaf of bread, and placed it in the fisherman’s hands. “Turn the handle and speak your wish,” she explained. “The mill will keep grinding for as long as you please, but when you have enough, you must say, ‘Stop, mill, stop,’ and it will rest.” Before Anders could thank her, the stranger had vanished, leaving only a line of footprints in the sand.","Anders tried the mill at once. “Grind me a loaf of bread,” he whispered, and as he turned the handle, out tumbled a warm, golden loaf. Within days his table was piled high with cheese, apples and herrings. Yet Anders never kept the bounty to himself; each week he shared it generously with his neighbours, and the village had never been so cheerful.","News of the mill spread across the fjords and eventually reached the ears of a ship’s captain named Borg, a shrewd man who was also extremely greedy. He longed to possess the mill, and on a moonless night he crept into Anders’s cottage and carried it away to his ship. As soon as they were safely out at sea, he turned to his crew with a satisfied grin. “Now we shall never go hungry,” he declared. “What shall we ask for? Salt! We can sell it for a fortune.”","“Grind me salt,” he ordered, turning the handle. White crystals began to pour out, and the crew cheered. But Borg had never troubled to ask how the mill was stopped, and now he could not think of a single word that would work. The salt gushed faster and faster, rising around the sailors’ boots and then up to their knees. “Stop!” shouted Borg. “Halt! Enough!” But the mill paid no attention.","The ship sank lower and lower beneath its glittering burden. Just in time, Borg and his crew scrambled into a small rowing boat and paddled away, coughing and blinking. Behind them the great ship slid beneath the waves, and the little mill went down with it, still grinding.","Some people say that the mill lies on the sea floor to this very day. It has never found the words to make it stop, and so it goes on making salt, which is why, they say, the sea tastes salty."]},{"id":"26-3","level":"Level 26","title":"Dumplings for the New Year","paras":["Every year, on the last evening before the New Year, the whole of Mei-Ling’s family squeezed into her grandmother’s tiny flat to make dumplings together. Aunts, uncles and cousins arrived clutching mixing bowls and rolling pins, and Po Po, Mei-Ling’s grandmother, presided over the kitchen like a general commanding an army. This year, for the first time, Mei-Ling was considered old enough to help.","“Watch my hands,” said Po Po, laying a circle of dough on Mei-Ling’s palm. She dropped a spoonful of pork and chives into the centre, folded the dough over, and pinched the edge into a row of neat little pleats, as swiftly as a bird tucks in its wing. “Now you try.”","Mei-Ling’s first dumpling looked like a squashed slipper. The filling oozed out of one side, and the pleats collapsed the moment she pressed them. Her cousin Jun snorted with laughter. “That one is going straight to the compost!” he teased. Mei-Ling’s cheeks burned as she glanced at the tray in front of her, where dozens of flawless dumplings stood in rows like tiny white boats.","“Take no notice of him,” Po Po said gently. “When I was your age, mine burst open in the water. Your fingers will learn; it only takes a little patience.” She demonstrated again, slowly, and Mei-Ling copied every movement with fierce concentration. By the tenth dumpling the pleats had begun to hold, and by the twentieth she was humming along to the music on the radio.","Then Po Po held up a shiny silver coin between finger and thumb. “Every year, we hide one of these inside a single dumpling,” she explained. “Whoever finds it will have good luck for the whole year.” While the children looked away, she tucked the coin inside a dumpling and shuffled it into the tray, so that nobody could possibly tell which dumpling contained it.","When the dumplings emerged from the steaming pot, everybody crowded around the table, and the kitchen filled with the smell of ginger and warm dough. Mei-Ling took the nearest one and bit into it. Something hard clicked against her teeth. She drew out the coin, gleaming and wet, and held it up in astonishment.","“Mei-Ling has the luck!” cried her uncle, and the whole room applauded. Jun stared at her, and then, to her surprise, he grinned. “Was that one of the squashed ones?” he asked. Mei-Ling looked down at the little dumpling on her plate, which was lopsided, with the pleats undone at one end. “It was,” she said. Po Po smiled a secret smile and passed her the soy sauce."]},{"id":"26-4","level":"Level 26","title":"Orangutans: Rainforest Rangers in Danger","paras":["Orangutans are large, reddish-brown apes that live in the rainforests of Borneo and Sumatra, two islands in South-East Asia. Their name comes from two Malay words meaning “person of the forest”. When you watch an orangutan swinging through the branches, it is easy to see why.","Orangutans spend almost all of their lives high in the trees. Their arms are much longer than their legs, and an adult male can stretch his arms out to about two metres. Their hands and feet are strong and can grip like hooks. This helps them to climb slowly and carefully, reaching for branches that will hold their weight.","Most of an orangutan’s day is spent looking for food. They eat mainly fruit, but they also eat young leaves, bark, flowers and insects. Orangutans help the forest to grow. When they eat fruit, they swallow the seeds, and later they drop the seeds far away from the parent tree, where new trees can sprout. For this reason, they are sometimes called gardeners of the forest.","When night comes, each orangutan builds a new nest. It bends branches together and adds leaves to make a soft bed high above the ground. A mother orangutan looks after her baby for six or seven years, which is longer than any other animal apart from humans. During that time, the baby learns which fruits are safe to eat and how to build a nest of its own.","Sadly, all three kinds of orangutan are now critically endangered, which means they are at very high risk of disappearing from the wild. The biggest problem is that their forests are being cut down. Trees are cleared to make room for farms, and large areas have been turned into plantations of oil palms. Orangutans have less and less space to live in, and it is harder for them to find enough fruit.","Orangutans are also slow to have young. A mother may have only one baby every six to eight years, so their numbers cannot recover quickly.","Many people are working hard to help. Some groups protect areas of rainforest so that the trees cannot be cut down. Others care for orphaned babies in rescue centres, teach them the skills they need and then return them to the forest. Shoppers can help too, by choosing products made with palm oil that has been grown in ways that do not harm the rainforest. Every small choice makes a difference to the future of these clever, gentle apes."]},{"id":"26-5","level":"Level 26","title":"How Rain Is Made","paras":["Every drop of rain that has ever fallen belongs to an endless journey known as the water cycle. Because the same water is used over and over again, the rain that fell on your school this morning may once have been part of a river, a puddle, or even the sea.","The journey begins with the Sun, whose heat warms the water in oceans, lakes and rivers. As the water warms, some of it changes into an invisible gas called water vapour, and this process is called evaporation. Although you cannot see vapour rising into the air, it is happening constantly, which is why puddles disappear on a sunny day.","Warm water vapour drifts upwards, and the higher it climbs, the colder the surrounding air becomes. When the vapour cools, it changes back into tiny droplets of liquid water. This change is known as condensation. You can observe it at home whenever steam from a hot bath meets a cold mirror and turns into a film of drops.","High in the sky, the droplets gather around minute specks of dust, and millions upon millions of them cluster together to form a cloud. Each droplet is so light that it is held up by the moving air. Clouds may look like solid cotton wool, but they are really made of water droplets and, where the air is very cold, tiny crystals of ice.","Inside the cloud, the droplets constantly collide and merge, so that they gradually grow larger. Eventually a drop becomes too heavy for the air to support, and it begins to fall. If the air beneath the cloud is warm enough, the drop reaches the ground as rain; if the air is freezing, it may arrive as snow or hail instead.","When the rain lands, some of it soaks into the soil, where plants absorb it through their roots. The rest runs across the ground into streams and rivers, which carry it back to the sea, and the whole journey can start again.","Different kinds of cloud bring different kinds of weather. Tall, thick, dark clouds usually hold the most water, because they contain vast numbers of droplets, and that is why the heaviest rain tends to fall from them. Thin, high clouds, on the other hand, are generally made of ice crystals, and they seldom produce rain at all.","Without the water cycle, there would be no fresh water for people, animals or plants. Rain may spoil a picnic, but it is one of the most valuable gifts that we receive from the sky."]},{"id":"26-6","level":"Level 26","title":"Louis Braille and the Dots","paras":["Louis Braille was born in 1809 in the small French town of Coupvray, near Paris. His father made saddles and harnesses for horses, and Louis loved to watch him work in his workshop. When Louis was three years old, he picked up one of his father’s sharp tools and it slipped. The injury to his eye became infected, and soon both his eyes were badly harmed. By the time he was five, Louis could no longer see at all.","Louis was a bright, curious boy, and his family and neighbours helped him to learn. He listened carefully to his village priest and went to the village school, where he was often at the top of the class. When he was ten years old, he was awarded a place at a special school for blind children in Paris.","At the school, Louis was excited to find a library, but he was disappointed by the books. They were printed with large raised letters that pupils had to trace with their fingers. The letters were slow to read, and each book was heavy and huge. A single sentence could take a long time to work out. Louis longed for a faster way to read and to write.","One day, an army captain named Charles Barbier visited the school. He had invented a system he called “night writing”, which used patterns of twelve raised dots. Soldiers could read the messages with their fingertips in the dark, without needing a lamp or having to speak. However, the system was too complicated. Twelve dots were too many for a fingertip to feel at once.","Louis thought hard about the problem. He spent many hours working on it, pressing dots into paper with a sharp tool called an awl. At the age of fifteen, he found the answer. He cut the twelve dots down to six, arranged in two columns of three. Each letter of the alphabet could be made with a different pattern of dots, and one fingertip could feel a whole letter at once.","Louis went on to become a teacher at the school where he had once been a pupil. He also played the cello and the organ, and he even wrote music in his new dot system. In 1829, he published a book explaining how it worked. At first, many teachers did not want to use it, but pupils at the school loved it because it was quick and simple.","In the years that followed, the system spread across the world, and it was named Braille after its inventor. Today, blind and partly sighted people in almost every country still read books, labels and signs written in the dots that a fifteen-year-old boy first dreamed up."]},{"id":"26-7","level":"Level 26","title":"The Girl Who Climbed Mount Nasu","paras":["Junko Tabei was born on the 22nd of September 1939 in Miharu, a town in Japan. She was the fifth of seven children. When she was ten years old, her class went on a school trip to climb Mount Nasu, and she was captivated. From then on she wanted to climb as many mountains as she could.","Junko studied English and American literature at university, and afterwards she looked for other climbers to join. At that time, most of the clubs were run by men, and some people did not think women should be mountaineers. Junko did not let this stop her. She climbed with the men’s clubs, and she worked her way up many of the great peaks of Japan, including the famous Mount Fuji.","In 1969, Junko decided that women should have a club of their own. She founded the Ladies Climbing Club, and its motto was: “Let’s go on an overseas expedition by ourselves.” The members trained together, and their great goal was to climb Mount Everest, the highest mountain on Earth.","An expedition to Everest was very expensive, and at first Junko struggled to find enough money. Each member of the team had to pay part of the cost. Junko taught piano lessons to raise her share, and she worked as an editor. Later, a newspaper and a television company agreed to help pay for the trip. The team even made some of their own clothing and equipment, because there was very little made in women’s sizes.","In the spring of 1975, fifteen women set off for the Himalayas, the great mountain range where Everest stands. The team climbed slowly and carefully up the great mountain. Junko worked with a Sherpa guide named Ang Tsering, a member of the mountain people who live in that region. On the 16th of May 1975, the two of them reached the top of Everest. Junko became the first woman ever to stand on the highest point on Earth.","Junko did not stop there. She set herself a new challenge: to climb the highest mountain on every continent. She climbed peaks on continent after continent, and in 1992 she became the first woman to complete the set.","Junko also cared about the mountains themselves. She worked to protect mountain environments and to share her love of climbing with young people. For Junko, a mountain was never just something to be conquered. It was a place to be respected, to be enjoyed and to be looked after."]},{"id":"27-1","level":"Level 27","title":"Fog on Carrow Ridge","paras":["Amara had been looking forward to the hike for weeks, ever since her dad had promised that at the top of Carrow Ridge there stood a stone hut where they could eat hot soup and gaze across three valleys. She, her dad and her little brother Kwame set off early, when the morning was still clear and bright, and the path wound steadily upwards between bracken and silver birch trees. Kwame, who had far more energy than sense, ran on ahead, pretending to be a mountain goat.","After an hour, the trees thinned and the ground turned rocky, and a cold wind began to push at their backs. Dad glanced up towards the ridge, and Amara noticed a small frown crease his forehead. A grey cloud was sliding down the hillside towards them, as slowly and softly as a wave rolling up a beach. “Stay close,” he said. “Both of you.”","Within minutes the fog had wrapped itself around them, so thick that Amara could see no further than her own outstretched arm. The path had vanished, and every rock looked exactly like the next. Kwame slipped his hand into hers. “Are we lost?” he whispered. Although her heart was thumping, Amara answered as calmly as she could. “Dad will know what to do.”","Dad stood very still for a moment, thinking. “We do not need to see the summit,” he said at last. “Remember the blue paint on the stones? The rangers mark the path with blue dots, so all we have to do is find the next one.” They formed a line, holding hands, and stretched out as far as they dared, searching the ground on every side. A few steps away, Amara spotted a small blue circle on a flat grey stone. “Here!” she called.","They crept forward from dot to dot, sometimes finding the marks close together and sometimes having to spread out and feel their way across the damp rock. Kwame turned it into a game, counting each dot aloud, and Amara noticed that the fear that had knotted her stomach was slowly loosening. It was difficult to feel afraid when the three of them were working together so well.","After what seemed an age, the ground levelled off and a square shape appeared in the murk. It was the stone hut, its wooden door painted exactly the same blue as the dots. Inside, a small wood stove glowed, and a friendly couple in bobble hats poured them each a mug of tomato soup, which Amara held in both hands while the warmth crept into her frozen fingers.","An hour later, the wind changed direction and the fog began to tear apart into ragged strips. Sunlight poured through the gaps, and below them lay three green valleys, shining as if somebody had polished them. Kwame pressed his nose against the window. “It was worth it,” he said. Dad grinned at Amara. “It was, wasn’t it?” he said quietly. “And you led us wonderfully well, you know.” Amara felt taller than the ridge itself."]},{"id":"27-2","level":"Level 27","title":"The Pond at Bramble Lane","paras":["For as long as anyone could remember, the corner behind the old bus shelter on Bramble Lane had been a dumping ground for shopping trolleys, broken chairs and crisp packets. Then, one spring, Mrs Osei from number 12 pinned a notice to the shelter: “Let’s turn this into a wildlife pond! Meet here on Saturday. Bring gloves.” Jaswinder, who was eleven, thought it sounded silly. Nevertheless, on Saturday morning he turned up, mostly because his mum insisted.","To his surprise, nearly thirty people were there, including a builder with a digger, a group of Brownies and Mr Chen, who was eighty and carried a folding stool. The first job was rubbish. By lunchtime, the neighbours had filled ten sacks and pulled out four trolleys, a bicycle wheel and something that nobody could identify. Jaswinder discovered that it was rather satisfying to see the corner appear from underneath the mess.","The following weekend, the builder’s digger scooped out a wide dip in the earth, deep in the middle and gently sloping at the sides. “Frogs and hedgehogs need a shallow edge,” Mrs Osei explained. “Otherwise, they cannot climb out.” Jaswinder helped to spread a thick black liner across the hole, and the Brownies covered its edges with soil and stones. Then a hosepipe was fetched, and everyone watched the water creep upwards, inch by inch.","Over the next few weeks, the pond was planted. Mr Chen donated a bucketful of water mint from his garden, and the school gave them a box of marsh marigolds. Jaswinder built a log pile for beetles and a small ramp made from an old plank. He also painted a sign that read, “Bramble Lane Pond: Look, but don’t lean.”","For a while, nothing seemed to happen. The water stayed still and clear, and Jaswinder wondered if all the effort had been wasted. Then, one warm evening in June, he saw a tiny ripple. A pond skater was skating across the surface on its long, spindly legs. The following week, there were dragonfly larvae in the weeds, and a small blackbird was bathing in the shallows.","By September, the pond had become the most popular spot on the lane. Children counted tadpoles on their way to school, and Mr Chen sat beside it every afternoon on his stool. One morning, Jaswinder found a little frog sitting on the plank ramp, blinking at the sunshine. He held his breath and did not move for a full five minutes.","That evening, he wrote in his notebook: “At first I thought this was a silly idea. Now I think it is the best thing on our road. Everybody helped, and there was a job for everyone.” He read it over twice, and then he added one more line: “Next year, we plant the wildflowers.”"]},{"id":"27-3","level":"Level 27","title":"The Attic at Nana Joy’s","paras":["The ladder to Nana Joy’s attic creaks on every single rung, as if it resents being woken from a long sleep. At the top, a small wooden hatch swings open, and out drifts the smell of the past: dust, old paper and a faint, sweet trace of lavender. I clamber through carrying a torch, although I do not really need it, because a round window at the far end lets in a long beam of afternoon light, and within it thousands of dust specks drift like tiny sparkling planets.","The attic is a crowded place. Boxes are stacked all the way up to the rafters, each labelled in Nana’s loopy handwriting: “Christmas”, “Mum’s books”, “Cables (do not throw)”. In one corner stands a rocking horse with a single glass eye, and it seems to follow me wherever I move. Above my head, a row of coats hangs from a beam, their sleeves swaying gently in the draught, and I half expect one of them to reach out and wave.","I kneel beside a trunk with brass corners that generations of hands have polished to a soft glow. The lid opens with a satisfying groan, and inside lies a bundle of silk scarves in ruby, emerald and gold, folded as precisely as envelopes. Beneath them rests a pair of tiny ballet shoes, their ribbons faded to the colour of weak tea. I lift one to my nose, and it smells of chalk and of a very long time ago.","At the very bottom of the trunk I discover a photograph in a cardboard frame. A young woman in a sparkling costume is laughing at the camera, one leg lifted and both arms flung wide as though she is about to take flight. On the back, in faded pencil, someone has written: “Joy, opening night, 1968.” I turn the picture over again and study the face properly. The nose is the same, and so are the crinkles around the eyes.","From below, a voice calls up the ladder. “Have you found anything interesting?” Nana Joy pokes her head through the hatch, her cheeks pink from the climb, and then she sees the photograph in my hands and stops. For a moment the attic is completely silent, and the dust hangs motionless in the light.","“Ah,” she says, with a small, astonished laugh. “I wondered where that had gone.” She lowers herself onto a box and takes the photograph as tenderly as if it were a butterfly. “I had forgotten how much I loved that stage,” she murmurs. “Shall I tell you about it?”","I nod. Outside, the light is slowly turning from white to honey. The rocking horse keeps its glass eye fixed on us, and I settle down among the scarves to listen, thinking that an attic is not a place for old things at all. It is a place where stories wait."]},{"id":"27-4","level":"Level 27","title":"Should Our Valley Have a Wind Farm?","paras":["A company has asked to build twelve wind turbines on the hills above Little Marlow, and the valley is divided. Some people think the plan is a good one. Others are firmly against it. Before you decide what you think, it helps to look at both sides.","Supporters point out that wind turbines make electricity without burning coal, oil or gas. Burning fuels releases gases that warm the planet, but a spinning turbine releases none. Wind is also a source that never runs out, unlike fuels, which take millions of years to form. Twelve turbines could make enough electricity for several thousand homes. The company has also promised that some of the money it earns would help to pay for a new village hall.","Supporters also say that turbines are a sensible use of a windy place. The hills above Little Marlow are exposed and breezy for much of the year, so the blades would turn on most days. A wind farm can be built in months, while a power station may take years. A farmer who lets the company use a field is paid rent for it. If the turbines were ever removed, the land could go back to farming, because they stand on small concrete bases and do not damage the soil.","Opponents, however, worry about how the hills would look. Turbines can be over a hundred metres tall, and they can be seen from many kilometres away. People who love the view fear that the peaceful skyline would be spoilt. Walkers and tourists might stop visiting, and local cafés and guest houses could lose customers.","Some neighbours are also concerned about noise. When turbines turn, the blades make a soft whooshing sound. The people who live nearest say it might disturb them, especially at night. Others worry about wild birds, which can be harmed if they fly into the blades. However, experts say that careful planning of where to put the turbines can reduce this risk.","Finally, there is the question of reliability. Turbines produce electricity only w
