<script>
'use strict';
const TEXTS = {"fluency":[{"id":"18","level":"Level 18","title":"The Red Kite","paras":["On Saturday morning, Ben and his dad went to the park. Ben took his new red kite. The wind was strong, so the kite went up very fast. Ben let out more string. The kite flew higher and higher until it was a tiny red dot in the sky. Then the wind suddenly stopped. The kite began to fall. Ben ran across the grass, pulling the string as fast as he could. Just before the kite landed in the pond, the wind came back. Ben's dad laughed out loud. \"That was close!\" he said. Ben held on tight and smiled."]},{"id":"19","level":"Level 19","title":"Hedgehogs","paras":["Hedgehogs are small animals with sharp spines on their backs. They often live in gardens, parks and woods. Hedgehogs sleep during the day and come out at night to look for food. They eat beetles, worms, slugs and snails. When a hedgehog is scared, it rolls into a tight ball so its spines stick out all around it. In winter, hedgehogs find a quiet, safe place and sleep for many long months. This is called hibernation. Their bodies use very little energy while they sleep, so they can stay alive until spring comes and there is food to eat again."]},{"id":"20","level":"Level 20","title":"The Swimming Club","paras":["Kai was nervous. It was his first day at the swimming club, and he did not know anyone there. He stood at the edge of the pool and looked at the deep water. \"Come on in,\" called a girl with a blue hat. \"I'm Priya. The water is not as cold as it looks.\" Kai took a deep breath and stepped down the ladder. The water was cool but not freezing. Soon he was kicking his legs and laughing. By the end of the lesson, he had learned to float on his back and had made a brand new friend."]},{"id":"21","level":"Level 21","title":"Market Day","paras":["Every Sunday, the town square is turned into a busy market. Stalls line the cobbled streets, covered with striped canvas roofs in red, yellow and green. The air smells of fresh bread, roasting nuts and sticky honey. Farmers shout out their prices, hoping to attract customers to their crates of shiny apples and juicy tomatoes. A man with a violin plays lively tunes near the fountain while children weave between the crowds. By midday, the square is so full of shoppers that it is hard to walk in a straight line. It is a lovely place to spend a morning."]},{"id":"22","level":"Level 22","title":"Fishing at Dawn","paras":["Yasmin's grandfather had promised to teach her how to fish. They rose before dawn and carried their rods down to the quiet lake. Mist floated over the water like a soft, grey blanket. \"The secret is patience,\" whispered Grandad, passing Yasmin a wriggling worm. Yasmin threaded it onto the hook and cast her line. Minutes slowly ticked by. Nothing happened. Yasmin was beginning to feel bored when the float suddenly bobbed under the surface. She gripped her rod tightly and reeled as fast as she could. At the end of her line, a silver fish flashed in the morning sunlight."]},{"id":"23","level":"Level 23","title":"How Volcanoes Erupt","paras":["Volcanoes form where hot, melted rock called magma pushes up from deep beneath the Earth's surface. As the magma rises, pressure builds up inside the mountain, much like the fizz in a shaken bottle of lemonade. Eventually, the pressure becomes far too great and the volcano erupts. Molten rock, ash and gases burst out of an opening at the top of the mountain. Once the magma flows out of the volcano, it is known as lava. The lava cools and hardens into solid rock. Over many years, repeated eruptions build up layers, making the volcano taller and wider over time."]},{"id":"24","level":"Level 24","title":"The Talent Show","paras":["Zara had been dreading the school talent show all week. Her friends had signed up to dance and juggle, but she could only play the recorder, and not very well. As she waited behind the curtain, her palms felt clammy and her stomach churned wildly. \"You'll be fine,\" whispered her teacher. Zara walked onto the stage and lifted the recorder to her lips. The first note wobbled, but she kept going. Slowly, the tune grew steadier. When she finished, the audience erupted into applause. Zara grinned so widely that her cheeks ached, and she wondered why she had ever worried."]},{"id":"25","level":"Level 25","title":"Why We Should Recycle","paras":["Recycling is one of the simplest ways we can look after our planet. When we throw away paper, plastic and glass, they often end up buried in enormous landfill sites, where they can take hundreds of years to break down. However, if we sort these materials into separate bins, they can be collected and turned into useful new products. Recycling aluminium cans uses far less energy than making brand-new ones. It also means that fewer trees are cut down and less pollution is released into the air. Everyone, young or old, can make a real difference by recycling every day."]},{"id":"26","level":"Level 26","title":"The Old Lighthouse","paras":["The old lighthouse had been empty for years, but Josh was convinced he could see a light flickering in the top window. Late one evening, he crept along the cliff path with a small torch, his heart thumping loudly. The wooden door creaked as he pushed it open. Inside, thick cobwebs hung from the ceiling like ragged curtains. He climbed the spiral staircase, one step at a time, until he reached the lamp room. There, sitting calmly on a wooden crate with a candle beside her, was a girl reading a book. \"Shh,\" she said quietly. \"You'll scare the seagulls.\""]},{"id":"27","level":"Level 27","title":"Life in a Hive","paras":["Honeybees live together in enormous colonies, sometimes containing tens of thousands of individuals. Each bee has a job. The queen lays all the eggs, worker bees gather nectar and pollen from flowers, and drones mate with the queen. When a worker discovers a good source of nectar, she returns to the hive and performs a special \"waggle dance\". The direction and length of the dance tell the other bees exactly where to find the flowers. Without bees, many of the fruits and vegetables we enjoy would not grow, because bees carry pollen from one plant to another as they feed."]},{"id":"28","level":"Level 28","title":"The Letter","paras":["Eleanor gazed at the letter in her trembling hands, unsure whether to laugh or cry. For months, she had rehearsed what she would say if she ever won the scholarship, yet now all her carefully chosen words had completely vanished. Her father watched silently from the doorway, hardly daring to breathe. \"Well?\" he asked eventually. \"Don't keep me in suspense.\" Eleanor looked up, her eyes shining. \"I got it,\" she whispered, and then, louder, \"I actually got it!\" Her father rushed across the room and swept her into a hug so tight that the letter fluttered gently to the floor."]},{"id":"29","level":"Level 29","title":"Phones for Children?","paras":["Some people argue that children should not be given mobile phones until they are at least twelve years old. They claim that phones distract pupils from schoolwork and encourage them to spend far too much time indoors. Furthermore, young children may come across websites that are unsuitable for their age. On the other hand, supporters point out that phones allow parents to contact their children in an emergency. They also say that learning to use technology responsibly is a valuable skill. Perhaps the best solution is for families to agree on sensible rules together, balancing the benefits against the risks."]},{"id":"30","level":"Level 30","title":"The Odd Socks","paras":["Tentatively, Amira pushed open the heavy classroom door, expecting a reprimand for being late. Instead, the room fell silent. Twenty-eight faces swivelled towards her, and Mr Okafor put down his red marker pen with deliberate slowness. \"Amira,\" he said, \"would you care to explain why you are wearing one green sock and one orange one?\" She glanced down in dismay. In her frantic rush that morning, she had failed to notice the mismatch. A ripple of giggles spread across the room. Amira felt her ears burning, yet somehow she found herself smiling. \"It's a new fashion trend,\" she announced proudly."]},{"id":"31","level":"Level F1","title":"Why the Tide Turns","paras":["Twice a day, the sea rises up the shore and then slowly drains away again. These movements are called tides, and they are caused mainly by the Moon. The Moon’s gravity pulls on the Earth, and because water can move freely, the oceans bulge towards it. As the Earth spins, different coastlines pass through the bulge, so the water level rises and falls. Fishermen, sailors and beachcombers all depend on tide tables to predict when the water will be at its highest. Ignoring them can be dangerous, since a rising tide can cut off a beach within a few minutes."]},{"id":"32","level":"Level F2","title":"The Violin","paras":["Ruby’s heart hammered as the auctioneer raised his wooden gavel. For weeks, she had admired the battered old violin in the dusty shop window, imagining the music it might make. Now, with only twelve pounds in her coat pocket, she watched the bidding climb steadily beyond her reach. A hush settled over the crowded room. Then, from the back, an elderly man’s voice rang out: “Sold, to the young lady in the green coat!” Ruby spun round in sheer astonishment. The man winked kindly, pressed the violin into her trembling hands and murmured, “Somebody once did the same for me.”"]},{"id":"33","level":"Level F3","title":"Should Zoos Exist?","paras":["Zoos have long divided public opinion. Supporters argue that they protect endangered species by breeding rare animals that might otherwise vanish forever. They say that visiting a zoo helps young people to care about wildlife. Critics disagree. They believe that wild animals should not live in enclosures, however large, and they point out that many captive animals pace up and down, which suggests they are unhappy. Very few zoo-bred animals are ever returned to the wild, so critics ask whether zoos really help. In the end, each person must weigh the benefits against the concerns and decide where they stand."]},{"id":"34","level":"Level F4","title":"The Storm","paras":["By the time the storm reached the headland, Elsa had already secured every rattling shutter. Wind screamed around the lantern room, and the ancient stone tower shuddered as waves pounded the rocks below. She tightened her grip on the rail, gazing out at the churning darkness. Somewhere out there, beyond the reef, a ship was struggling. Without hesitation, she relit the great brass lamp, its beam slicing through the driving rain. For hours she stayed grimly at her post, weary but unyielding, until at first light a small fishing boat limped safely into the harbour, its exhausted crew waving gratefully."]},{"id":"35","level":"Level F5","title":"The Envelope","paras":["The letter arrived on the coldest morning of the whole year, wedged between an unpaid gas bill and a takeaway menu. Nora recognised the spidery handwriting at once, and her stomach tightened. For three years, her grandfather’s silence had hung over the family like a stubborn fog, and nobody would explain why. She slid a trembling finger beneath the flap, hesitating. What if the words inside only made everything worse? Then, before she could change her mind, she tore the envelope open and began to read, her breath clouding the frosty window as the house creaked and settled around her."]},{"id":"36","level":"Level F6","title":"The Rosetta Stone","paras":["In 1799, French soldiers repairing an old fort in Egypt uncovered a slab of dark grey stone covered in strange writing. The Rosetta Stone, as it became known, carried the same message in three different scripts: hieroglyphs, a simpler Egyptian script and ancient Greek. Scholars could easily read Greek, so they compared the three versions line by line. Even so, it took more than twenty years for a French linguist, Jean-François Champollion, to work out how hieroglyphs worked. His discovery, announced in 1822, allowed people to read thousands of years of Egyptian history for the first time in many centuries."]}],"phonics":[{"id":"1-0","level":"Phase 2","title":"On and Off the Bus","paras":["Mum, Dad and Nell get on the bus. Dad gets the bus tickets. Dad has the tickets in his pocket. Mum, Dad and Nell sit at the top of the bus."],"images":["img/p1-0a.jpg?v=2e99f556","img/p1-0b.jpg?v=dcb6c9bc"]},{"id":"1-1","level":"Phase 2","title":"The Dog Pig","paras":["The sad dog fell in the pit. \"Mum! The dog is in the pit!\" \"Get a net! Get a bag! Get a sack!\" The dog is big. The dog is fat."],"images":["img/p1-1a.jpg?v=4033cac6","img/p1-1b.jpg?v=825aba52"]},{"id":"1-2","level":"Phase 2","title":"A Hug and a Kiss","paras":["The dog can get a hug. The cat can get a hug and a kiss. Can Pam hug a duck? Can Kim hug a hen? Is it a dog in a cup?"],"images":["img/p1-2a.jpg?v=242a1d84","img/p1-2b.jpg?v=0a22ee83"]},{"id":"2-0","level":"Phase 3 (Weeks 1–3)","title":"Jack is Not Well","paras":["Jack is sad. He had no luck. He is not well. He is ill. He is sick and will go to the vet. Mum, Viv and Jack go to the vet. “No fuss,” the vet tells Viv."],"images":["img/p2-0a.jpg?v=62684341","img/p2-0b.jpg?v=2e3fcbfb"]},{"id":"2-1","level":"Phase 3 (Weeks 1–3)","title":"Hats","paras":["Caz can sit in the sun. Will Caz be hot? No! Caz has a sun hat. Caz will not be hot in the sun. Kez has a hat. The hat is a fez. The fez is red."],"images":["img/p2-1a.jpg?v=0d458f73","img/p2-1b.jpg?v=748ac56e"]},{"id":"2-2","level":"Phase 3 (Weeks 1–3)","title":"Is It Hot?","paras":["Yasmin has a pan. She has a metal pan. The metal pan has a lid. The metal pan is on the gas. If the gas is on, will the pan get hot? Yes, it will get hot."],"images":["img/p2-2a.jpg?v=0cf6bd07","img/p2-2b.jpg?v=2e1190fe"]},{"id":"3-0","level":"Phase 3 (Weeks 4–6)","title":"The Long Red Coat","paras":["Shem had ten chickens. Zak had a foal. Beth had Gosh, the goat. Gosh was a big, bad goat! Beth had a long red coat. At night Beth hung the long red coat on a peg. The peg was high up in the shed."],"images":["img/p3-0a.jpg?v=99efb58b","img/p3-0b.jpg?v=78552318"]},{"id":"3-1","level":"Phase 3 (Weeks 4–6)","title":"Sheepdogs","paras":["This is a sheepdog. This sheepdog is not a pet. He has a job on a farm. His job is to keep the sheep on the farm. Look at this sheepdog run. She is quick! Zoom! This sheepdog can get the sheep if they run off."],"images":["img/p3-1a.jpg?v=9d370458","img/p3-1b.jpg?v=7d3a0a4b"]},{"id":"3-2","level":"Phase 3 (Weeks 4–6)","title":"The Vixen","paras":["The van is too quick. The van will hit the vixen. Vic feels sad. He sighs and runs into the road. Jeevan feels sad too. She is looking for the vixen. She sees it vanish into the woods. It is not hurt."],"images":["img/p3-2a.jpg?v=e02e584b","img/p3-2b.jpg?v=c865d68c"]},{"id":"4-0","level":"Phase 3 (Weeks 7–8)","title":"Darth, Boss of the Road","paras":["But then Darth gets a shock. A turnip hits him on his ear. \"Ow!\" he yells. \"That hurts such a lot!\" He sits down on a chair as tears run down his chin. \"Boo hoo!\" he sobs. Chan, Martha and Gareth look down at him."],"images":["img/p4-0a.jpg?v=41bf4826","img/p4-0b.jpg?v=73d1b28c"]},{"id":"4-1","level":"Phase 3 (Weeks 7–8)","title":"Moaning Min","paras":["Min is good at moaning. She moans if she has to cook the food. She moans if she has to sort things in the living room. She moans if she has to pick up her books. She moans if she has to go to the woods in her boots."],"images":["img/p4-1a.jpg?v=b3bc27bc"]},{"id":"4-2","level":"Phase 3 (Weeks 7–8)","title":"Ding Dong!","paras":["The food van zooms into the farmyard and up to the farm. \"Food!\" yell Duck, Dog and Chick. The van parks in the yard. The van man is on the porch. He rings the bell. Ding Dong! Can Farmer Sam hear the bell? No, she cannot hear the bell!"],"images":["img/p4-2a.jpg?v=1162c3b0","img/p4-2b.jpg?v=95482f41"]},{"id":"5-0","level":"Phase 4","title":"Stuck!","paras":["Malak was hidden in the weeds. \"There you are!\" said Camila. \"I think you are stuck,\" said Tarek. Camila got into the pond. She had a cloth to pick Malak up. Malak was so wet! Camila and Tarek were wet too! Next morning, Malak was missing. Camila and Tarek had to hunt for her."],"images":["img/p5-0a.jpg?v=e5f27b58","img/p5-0b.jpg?v=472b9395"]},{"id":"5-1","level":"Phase 4","title":"Big Bins","paras":["Amma and Aban were sad. There was litter on the road. There was litter on the sand and next to the huts too. There was a litter bin next to the road, but it had no room in it. \"I do not like all this litter,\" said Amma. \"Let us pick it all up.\""],"images":["img/p5-1a.jpg?v=2917f7d5","img/p5-1b.jpg?v=7b1eade6"]},{"id":"5-2","level":"Phase 4","title":"The King's Crown is Missing!","paras":["“Help! Help!” said the king. He was so upset! Now he did not look at all important! “Quick! I need my crown back!” he said. The queen said, “I will summon that clever owl. He might get the crown for us.” Tap! Tap! Tap! Owl ran into the room! The owl said, “I have come to help!”"],"images":["img/p5-2a.jpg?v=9d845e9b","img/p5-2b.jpg?v=9fa1a660"]},{"id":"6-0","level":"Phase 4 Mastery","title":"Lunches for Alfred","paras":["Alix and Kris are in the park when they see Alfred. Then Alfred trips up. Alix rushes to him. Kris dashes to him. They help Alfred to sit up. \"Dear me,\" moans Alfred. \"I feel faint. You see, I have to miss my lunches. I have no food in my flat.\" Alix helps Alfred to stand up."],"images":["img/p6-0a.jpg?v=a08cb3bc","img/p6-0b.jpg?v=72e75141"]},{"id":"6-1","level":"Phase 4 Mastery","title":"Too Much Stuff!","paras":["Dom and Jem were going on a trip. Dom was packing his bag. It was a big bag. \"I cannot lift my bag,\" said Dom. \"You have too much stuff in it,\" Jem explained. \"You need to unpack the bag,\" she went on. \"Unzip the bag and I will help you. But we must be quick, or we will miss the bus!\""],"images":["img/p6-1a.jpg?v=ea24bdc2","img/p6-1b.jpg?v=51bc00af"]},{"id":"6-2","level":"Phase 4 Mastery","title":"Stan's Glittering Trail","paras":["Stan sat next to Slug in the moonlight. “Look at the moon and the stars glittering up there!” said Stan. “I am just a dull, brown snail. I wish I was glittering too.” Stan felt a little sad. “If I can get as high as the moon and stars,” said Stan, “do you think I will glitter too?”"],"images":["img/p6-2a.jpg?v=b0969b9d","img/p6-2b.jpg?v=ebbfaf74"]},{"id":"7-0","level":"Phase 5a (Weeks 1–4)","title":"Stunt Star","paras":["Jazz is proud of what she can do. It’s a thrilling feat. On Thursday, she has fun doing tricks on her hands. She can tilt the chair, then spin and twist it around. She needs strong arms and hands to do such tricks. On Friday, Jazz looks at the top ramp. It’s the highest ramp in the park. It’s steep too. That’s a big drop from the top! This high ramp will be a big test for Jazz."],"images":["img/p7-0a.jpg?v=6bab510d","img/p7-0b.jpg?v=2866332c"]},{"id":"7-1","level":"Phase 5a (Weeks 1–4)","title":"Three Clues","paras":["Kirsten grinned. “I like Delroy,” she said. “He has a big garden with fir trees at the end.” On Saturday, Kirsten got out her best trainers and a blue shirt. Mum took her up the road. There were lots of people in the garden. “Have fantastic fun!” said Mum. Then Mum left, and Kirsten ran off to play with Amal and Carlos."],"images":["img/p7-1a.jpg?v=9027f75d","img/p7-1b.jpg?v=d1973f98"]},{"id":"7-2","level":"Phase 5a (Weeks 1–4)","title":"Airship Rescue","paras":["Dew stood under the brand new airship and looked up. It seemed so big! She saw dark clouds hanging in the air. The ground crew were looking up at the clouds too. Was a storm on its way? A man called Paul shouted to her. He was one of the crew. “Dew! We need to shelter from the storm,” he said. “A twister has been spotted.”"],"images":["img/p7-2a.jpg?v=4383fb5d","img/p7-2b.jpg?v=aa5801c6"]},{"id":"8-0","level":"Phase 5a (Weeks 5–6)","title":"Caves","paras":["You can see caves at the coast, next to the sea. You can see caves inland too. Caves at the coast are made when the wind and the waves destroy the rock. This can take a long time. Some caves go deep under the cliffs. You can sometimes go inside these caves. But do not get cut off when the tide comes in!"],"images":["img/p8-0a.jpg?v=5bb1f2c9","img/p8-0b.jpg?v=3489fee0"]},{"id":"8-1","level":"Phase 5a (Weeks 5–6)","title":"Looking at the Stars","paras":["Is that a star? Yes. Those dots of light are stars. Stars send out light. We can see planets too. They look like dots of light as well. Some planets are brighter than stars. Looking at stars can be like looking at a map. You can use them to navigate. There are patterns in the stars too. Look, that pattern of seven stars is the big dipper. And you might see the Pole Star too."],"images":["img/p8-1a.jpg?v=9bfedd63","img/p8-1b.jpg?v=36645663"]},{"id":"8-2","level":"Phase 5a (Weeks 5–6)","title":"Canute's Flute","paras":["“I will play a tune for you,” said Canute. “Excuse me,” Luke said. “What have you got in that box?” Canute grinned and lifted the lid. Inside was a long, silver pipe. “This is my flute,” said Canute. “I use it to make people feel better.” He jumped off the mule and trotted into the street. Then he started to play the flute. The tune was so astonishing that the rain stopped in an instant."],"images":["img/p8-2a.jpg?v=21554e5d","img/p8-2b.jpg?v=66387d61"]},{"id":"9-0","level":"Phase 5a (all)","title":"Spot the Magnets","paras":["Are there magnets in this room? Yes! In fact, there might be lots. How will this food stay cool? Magnets! A magnetic strip on the inside keeps it shut and helps keep the food cool. How do these things stay out of the way? Magnets! Magnets attract things made of steel. These letters have magnets in them, so they stick to the steel. Little magnets are good for sticking up notes too."],"images":["img/p9-0a.jpg?v=33cdb56d","img/p9-0b.jpg?v=1a6390f3"]},{"id":"9-1","level":"Phase 5a (all)","title":"Camping Kit","paras":["It will take lots of people to heave the tent upright! Some tents are made from ripstop fabric, which is strong and will not rip. There are five poles to keep the tent up. The tent pegs are made of steel. Sometimes pegs are made of plastic. But when you hammer tent pegs into the ground, plastic ones can snap if the ground is too hard."],"images":["img/p9-1a.jpg?v=aeb6ac3d"]},{"id":"9-2","level":"Phase 5a (all)","title":"The King's Cats","paras":["Queen June was sitting on her throne playing her silver flute. All of a sudden, there was a loud yell. “The King and his cats have come to visit!” “Oh no!” Queen June said. “Not the cats!” “Sister, we have come to stay for three weeks!” said the King. The King had lots and lots of cats. He kept them with him all the time."],"images":["img/p9-2a.jpg?v=607aa6f9","img/p9-2b.jpg?v=d7b7f286"]},{"id":"10-0","level":"Phase 5b","title":"Jogging into Space","paras":["It was Monday and Gill and Chris were at Space Club. They were both looking up at the night sky. “Look!” Gill said. “I can see the lights of a spacecraft. It is orbiting our planet.” “Space starts about sixty miles up in the sky,” she whispered. “I read that in a book.” “No way!” Chris replied. “Gill’s right,” their teacher told him. “I want to go into space,” said Gill."],"images":["img/p10-0a.jpg?v=4e57b920","img/p10-0b.jpg?v=6bd9e32e"]},{"id":"10-1","level":"Phase 5b","title":"The Tap Tap Kids","paras":["Spring, Sage and Toby were born in a barn on a farm. One day, Mum said, “I think you could play outside this morning.” The three kid goats had never been outside the barn so they went WILD! They jumped up everywhere. Tap, tap, tap went their feet on the tin roof. They had so much energy! The farmer was on her tractor in the field. “STOP!” she called, with a frown. “All this tapping is very annoying!” The kids jumped onto the bonnet of her tractor and began to tap!"],"images":["img/p10-1a.jpg?v=0f053bf3","img/p10-1b.jpg?v=23cb7263"]},{"id":"11-0","level":"Phase 5c","title":"Jake the Snake","paras":["By the side of a big fishing lake there was an old viper called Jake. He got his fang stuck in a deep pile of muck. He was really a silly old snake. In the lake were a drake and a duck. They could see Jake had run out of luck. The duck said, “Can I help?” as Jake started to yelp. “We will help get your trapped fang unstuck.”"],"images":["img/p11-0a.jpg?v=a5388033","img/p11-0b.jpg?v=d2ead8d6"]},{"id":"11-1","level":"Phase 5c","title":"I'm Not a Monster!","paras":["I’m a water bear. Some people call me a moss piglet. Can you count how many legs I have? I can live almost anywhere, from the tops of mountains to the bottom of the deep sea. I may look rather frightening, but I’m not a monster. I’m very, very small, so you can hardly spot me without a microscope! I was chosen to go on a special mission ... into space. I stayed alive because I can survive without air in almost any temperature."],"images":["img/p11-1a.jpg?v=594b28ba"]}],"comprehension":[{"id":"18-1","level":"Level 18","title":"The Lost Mitten","paras":["It was the first snowy morning of winter, and Lily could not wait to go outside. She pulled on her boots, her scarf and her bright red mittens. Then she ran into the garden with her little brother, Sam.","The snow was deep and soft, and it sparkled in the sunshine. Lily made a snowball and threw it at the fence. Sam laughed and tried to catch it. Soon they were both covered in snow from head to toe.","Next, they decided to build a snowman. Lily rolled a big ball for the body, and Sam rolled a smaller one for the head. Sam ran into the kitchen and came back with a carrot for the nose. Lily found two round pebbles for the eyes.","After a while, Lily looked down at her hands. One of her mittens was missing! “Oh no,” she said. “I must have dropped it.”","Lily and Sam searched all over the garden. They looked under the bench and behind the shed. Lily’s fingers were getting very cold, and she began to feel sad. That mitten had been a present from her gran.","At last, Sam saw something red poking out of the snow beside the gate. “Found it!” he shouted, and he pulled it out. It was wet and cold, but it was not lost any more.","Lily was so pleased. She gave Sam a big hug and said thank you. Then Dad called from the back door. “Come in, you two! Your cheeks are as red as apples.” Soon they were inside, drinking hot chocolate."]},{"id":"18-2","level":"Level 18","title":"The New Climbing Frame","paras":["On Monday morning, a big new climbing frame stood in the school playground. It was red and yellow, with a tall slide and a rope bridge. All the children stared at it. Tomasz had never seen anything so exciting.","At playtime, everyone ran to the climbing frame. Tomasz climbed up the ladder, but he stopped at the top. The rope bridge wobbled in the wind. His legs felt shaky, and he looked down at the ground far below.","“I can’t do it,” he whispered. He climbed back down and sat on a bench. He watched the other children cross the bridge, one by one. His friend Freya waved from the top, but Tomasz pretended not to see her.","Soon Freya came and sat beside him. “The bridge is scary at first,” she said. “It was scary for me, too. Shall we try it together? I will go first, and you can hold the rope.”","Tomasz took a deep breath. Slowly, he climbed the ladder again. Step by step, he crept across the bridge, holding the rope tightly. It wobbled, but Freya was right in front of him, and she kept saying, “Nearly there!”","At the end, Tomasz jumped onto the platform and laughed. “I did it!” he shouted. Then he whooshed down the slide with his arms in the air. When the bell rang, he did not want to go in. “Can we do it again tomorrow?” he asked."]},{"id":"18-3","level":"Level 18","title":"Breakfast in Bed","paras":["Kojo woke up early on Saturday. The house was quiet. His mum had been working late all week, and she was still fast asleep. “Let’s help her today,” Kojo whispered to his little sister, Abena.","First, they tiptoed downstairs to the kitchen. Kojo took out the bread, and Abena found the butter. Kojo put two slices of bread in the toaster and waited. Pop! The toast jumped up, golden and warm.","Next, Kojo picked a flower from the garden and put it in a small glass of water. “Mum loves yellow flowers,” he said. Dad filled the kettle for them and made a cup of tea just the way Mum liked it, with a little milk and no sugar.","Then they put everything on a tray. Abena carried it up the stairs very slowly. One step, two steps, three steps. The cup rattled, and a little tea spilled onto the tray. “Oh dear,” said Abena. Kojo quickly wiped it up with a tissue.","They pushed open Mum’s door. She opened one eye and then the other. When she saw the tray, she sat up and smiled. “Is that breakfast in bed for me?” she asked. “Yes!” said the children.","Mum ate the toast and drank the tea. “This is the best breakfast ever,” she said. “I feel so lucky.” Then she gave them both a big hug. Kojo felt warm inside."]},{"id":"18-4","level":"Level 18","title":"How to Grow Cress","paras":["Cress is a small plant that grows very quickly. You do not need a garden, because you can grow it on a window sill in about a week. It is fun to grow, and you can eat it in a sandwich. All you need is a few things from around the house.","You will need a small plastic tub, some cotton wool, a packet of cress seeds, and a jug of water.","Step 1. Put the cotton wool in the bottom of the tub. Make sure that it fills the tub and lies flat.","Step 2. Pour a little water onto the cotton wool until it is damp. It should not be dripping wet.","Step 3. Sprinkle the seeds over the top. Spread them out so that they are not all in one pile. Do not cover them up.","Step 4. Put the tub on a bright window sill, where the cress can get plenty of light. Add a little water each day to keep the cotton wool damp.","After two or three days, you will see tiny white roots and green shoots. After about a week, your cress will be as tall as your finger. Now it is ready to eat.","To pick your cress, ask an adult to help you cut the stems with scissors. Then rinse the cress under the tap. It is delicious on bread and butter, or in a salad. You can start again with fresh cotton wool and new seeds."]},{"id":"18-5","level":"Level 18","title":"All About Wind","paras":["Wind is air that is moving. We cannot see it, but we can feel it on our faces, and we can see what it does. Wind makes the leaves on trees shake, and it makes flags flap.","Some winds are very gentle. A soft wind is called a breeze. A breeze feels cool on a hot day. It can blow the fluffy seeds of a dandelion away.","Other winds are much stronger. A strong wind can blow hats off heads, and it can make umbrellas turn inside out. A very strong wind is called a gale. In a gale, big branches can snap off trees, so it is best to stay indoors.","Wind is useful, too. Sailing boats have big sails that catch the wind and push the boat across the water. A windmill has long blades that spin round when the wind blows. Long ago, people used windmills to grind grain into flour. Nowadays, tall wind turbines turn in the wind to make electricity.","How can we tell how strong the wind is? Look at the trees. If only the leaves are moving, the wind is gentle. If the small branches are moving, the wind is stronger. If whole trees are swaying, the wind is very strong.","So the next time you go outside on a windy day, stop and look around. What can you see the wind doing?"]},{"id":"18-6","level":"Level 18","title":"Rabbits as Pets","paras":["Rabbits are soft, furry animals, and many families keep them as pets. A rabbit can live for eight years or more if it is looked after well.","A pet rabbit needs a safe home. A hutch is a wooden house for a rabbit. It needs a warm place to sleep, and it needs a run joined to it so that the rabbit can hop about. Rabbits need lots of space to run and jump every day.","A rabbit’s most important food is hay or grass. A rabbit’s teeth never stop growing, so chewing hay keeps them from getting too long. Rabbits also like fresh vegetables, such as cabbage and carrots, but they should only have a small amount. A rabbit must have fresh water every day.","Rabbits are friendly animals, and they do not like to be lonely. In the wild, they live in big family groups. A pet rabbit is happiest with another rabbit for company. If it has to live on its own, its owner should spend lots of time with it every day.","Some rabbits have long fur that needs to be brushed gently each day. Their hutch should be cleaned often, too, so that it stays fresh and dry. A tidy hutch keeps a rabbit happy.","Rabbits can make lovely pets. They need time and space, but they give a lot back to a family who look after them well."]},{"id":"18-7","level":"Level 18","title":"Beatrix Potter and Peter Rabbit","paras":["Beatrix Potter was born in London in 1866. She loved animals, and she loved to draw. When she was a girl, she kept many small pets in her schoolroom. She had mice, newts, birds and rabbits. She drew and painted them again and again.","One of her rabbits was called Peter Piper. Beatrix liked to watch him and draw him. He gave her an idea for a story about a naughty little rabbit.","In 1893, Beatrix wrote a picture letter to a boy called Noel. The letter told the story of four young rabbits. One of them was called Peter. Beatrix drew pictures in the letter to go with her words.","Later, Beatrix wanted to turn her story into a book. Several publishers said no. So in 1901 she had 250 copies printed herself, for her friends and family. The next year, a company called Frederick Warne made the book for shops to sell. It was called The Tale of Peter Rabbit, and it was a big success.","Beatrix wrote many more books about animals. In 1905, she used the money from her books to buy a farm called Hill Top. It is in the Lake District, in the north of England. She drew the farm and the countryside for her stories.","Beatrix loved the countryside and wanted it to stay beautiful. She left about 4,000 acres of land, and many farms, to the National Trust. This is a charity that looks after special places. Today, people can visit these places and enjoy them."]},{"id":"19-1","level":"Level 19","title":"A Day at the Farm Park","paras":["On Sunday, our family went to Hillside Farm Park. Dad packed sandwiches and drinks, and my little cousin Yusuf came with us. I sat in the back of the car and counted the sheep in the fields.","As soon as we arrived, we went to see the animals. In the big barn, a keeper showed us how to feed the lambs with bottles of milk. The lambs pulled so hard on the bottles that Yusuf nearly fell over. Everyone laughed, and Yusuf laughed loudest of all.","After that, we walked to the pond to feed the ducks. There was a sign that said, “Please give the ducks only the special duck food.” Dad bought a small bag, and we threw it in little handfuls. A very greedy white duck pushed to the front and ate most of it.","At lunchtime, we ate our sandwiches at a wooden picnic table. It was a windy day, and half of Mum’s crisps blew away. A small brown hen strutted over to see if any had landed near her. She pecked at them, one by one.","In the afternoon, we went on a tractor ride around the farm. The trailer bumped over the grass, and we held on tight to the sides. The farmer pointed out the pigs, who were rolling in a muddy puddle. “They are keeping cool,” she told us. Yusuf held his nose and giggled.","Before we left, we visited the gift shop. I chose a rubber pig for my desk, and Yusuf picked a woolly toy lamb. On the way home, we were all so tired that Dad turned the radio off. Yusuf fell asleep before we had even reached the main road, still holding his lamb."]},{"id":"19-2","level":"Level 19","title":"The Missing Counter","paras":["It was raining hard, so Ben and his sister Lola had to stay indoors. They had already read their comics and built a tower out of cushions. Now they were bored. “Let’s play Space Race,” said Lola, pulling a dusty box from under the sofa.","They spread the board on the carpet. It showed a winding path of stars that led to a shiny silver rocket at the end. Lola chose the green counter, and Ben chose the blue one. Then they rolled the dice to see who would go first.","The game was close. First Lola was ahead, then Ben zoomed past her with a lucky six. Just as Ben was about to land on the last star, he reached out to move his counter. It was gone.","“Where is it?” he cried. “It was right here!” They searched under the sofa and behind the cushions. Lola lifted up the box and shook it. Nothing fell out. Ben was sure that Lola had hidden it as a trick, but she promised that she had not.","Just then, Biscuit, their little brown dog, wandered in from the kitchen. He was wagging his tail and looking very pleased with himself. Lola knelt down and peered into his basket. There, between a chewed bone and a soggy sock, sat the blue counter.","“Biscuit!” they groaned together. Lola wiped the counter on her jumper, and Ben put it back on the board. This time, Ben rolled a five and reached the silver rocket first. “I win!” he cheered. Lola shrugged. “Fine,” she said, “but I’m going to beat you in the next game.” Biscuit yawned and went back to sleep."]},{"id":"19-3","level":"Level 19","title":"Show and Tell Friday","paras":["On Friday morning, Kai walked into class holding a small cardboard box very carefully. It was Show and Tell day, and inside the box was something special. His friends crowded round, but Kai shook his head. “You will have to wait,” he said with a grin.","After the register, Mrs Osei asked who wanted to go first. Kai’s hand stayed by his side. His tummy felt as if it was full of butterflies. Instead, Chloe showed the class a blue feather that she had found in the park, and Hamza told a joke about a penguin, which made everybody groan and giggle.","Then it was Kai’s turn. His legs felt wobbly as he walked to the front of the class. He stood the box on the table and took a deep breath. “This is my grandad’s old compass,” he began quietly.","He lifted out a round brass compass with a shiny glass top. A thin red needle trembled inside it. “Grandad used it when he went walking in the hills,” Kai explained. “The needle always points north, so he never got lost.” He turned slowly on the spot, and everyone watched the needle swing round and settle again.","“Can I have a go?” asked Hamza. “Please may I try?” said Chloe. Soon a line of children had formed beside the table. Mrs Osei let each child hold the compass for a moment and find north, and she reminded them all to be gentle.","By the end of the lesson, Kai’s worries had melted away. “That was the best Show and Tell we have had all year,” said Mrs Osei. Kai carefully put the compass back in its box. He could not wait to tell Grandad how much everybody had liked it."]},{"id":"19-4","level":"Level 19","title":"Ladybirds","paras":["Ladybirds are small, round beetles. Many are red with black spots. Some are yellow or orange. A few are black with red spots. A ladybird has six legs and two pairs of wings. The hard outer wings keep the thin inner wings safe. The inner wings are the ones it uses to fly.","The bright colours are a warning. Birds see the colours and learn to stay away. A ladybird can also give out a yellow liquid that tastes nasty when it is in danger.","Gardeners like ladybirds. They eat tiny insects called aphids. Aphids feed on plants and can harm flowers and vegetables. One ladybird can eat lots of aphids in a day. That helps the plants to grow well. This is why some gardeners buy ladybirds and set them free in the garden.","A ladybird starts life as a tiny yellow egg. The eggs are laid on leaves, near aphids. After a few days, a larva comes out of each egg. The larva looks nothing like a ladybird. It is long and spiky and has no wings. It eats lots of aphids and grows bigger and bigger. Then it turns into a pupa. Inside the pupa, its body changes. After about a week, an adult ladybird comes out.","In autumn, the weather gets cold. Ladybirds look for a safe place to spend the winter. Lots of them gather together under bark, in cracks in walls or inside dry plant stems. They stay there and hardly move. When spring comes and the weather is warm, they wake up and fly away."]},{"id":"19-5","level":"Level 19","title":"How to Make a Bird Feeder","paras":["Do you like to watch birds in the garden? Wild birds often find it hard to get food in the cold months, so you can help them by making a bird feeder. It only takes about twenty minutes, and you can hang it outside for the birds to enjoy.","You will need: a large, dry pine cone; a piece of string about thirty centimetres long; some solid fat for birds, called suet; a bag of wild bird seed; a spoon; and a tray.","Step 1. Tie the string tightly around the top of the pine cone. Make a big loop at the end so that you can hang the feeder up later.","Step 2. Pour the bird seed onto the tray and spread it out. Ask an adult to soften the fat by leaving it in a warm room beforehand. It should be soft, but not runny.","Step 3. Use the spoon to push the fat between the scales of the pine cone. Be sure to fill every gap, and cover the outside of the cone as well.","Step 4. Roll the sticky pine cone in the bird seed until it is coated all over. Press the seeds on gently so that they stick.","Step 5. Hang your feeder from a branch outside, in a place where you can see it from a window. Then wait and watch. It may take a few days before the birds find it. Once they do, you will have lots of hungry visitors.","Remember to wash your hands well when you have finished."]},{"id":"19-6","level":"Level 19","title":"How Bread Is Made","paras":["Every day, people around the world eat bread. A loaf of bread might seem simple, but making one takes several steps and a tiny helper called yeast. Yeast is a living thing so small that you cannot see one.","First, the baker mixes flour, water, salt and yeast in a large bowl. The ingredients stick together to make a soft, sticky lump called dough. Next, the baker kneads the dough. This means pressing, stretching and folding it again and again for about ten minutes. Kneading makes the dough smooth and stretchy.","Then the dough is left in a warm place to rest. While it rests, the yeast begins to feed on the sugars in the flour. As it feeds, it makes lots of tiny bubbles of gas. The bubbles get trapped inside the stretchy dough and push it upwards, so the dough slowly grows bigger and bigger. Bakers say that the dough is rising.","Next, the baker shapes the dough into a loaf and puts it on a tray. It is left for a little longer to rise again. Finally, the loaf goes into a very hot oven.","In the oven, the heat makes the bubbles grow even bigger, and the dough rises a little more. Then the heat turns the soft dough into a firm loaf. The outside of the loaf turns golden brown and crispy, and this is called the crust. The inside stays soft and full of small holes, where the bubbles used to be.","After about half an hour, the baker takes the loaf out of the oven. It is best to let it cool before you cut it. Then the bread is ready to eat."]},{"id":"19-7","level":"Level 19","title":"Running for Gold in Athens","paras":["Kelly Holmes was born on the 19th of April 1970 in a village called Pembury, in Kent. When she was 18 years old, she joined the army. In the army, Kelly played many sports, and she became the army judo champion. Later, she chose to concentrate on running.","Kelly trained very hard. She ran in races in many places, and she worked with her coaches to become faster and stronger.","In 2004, the Olympic Games were held in Athens, in Greece. Kelly was 34 years old, and she went there to run in two races. The first was the 800 metres, which is twice around a running track.","On the 23rd of August 2004, Kelly ran in the 800 metres final. Near the end of the race, she moved into the lead. She held off the other runners and crossed the line first. Her time was less than two minutes. Kelly had won an Olympic gold medal.","Five days later, on the 28th of August 2004, Kelly ran in the 1500 metres final. This is a longer race. It is nearly four times around the track. Once again, Kelly sped up near the end and finished in front of all the others. She had won a second gold medal.","Only two women before Kelly had ever won both of these races at the same Olympic Games. Now she had joined them.","After the Games, Kelly was made a Dame. This is a special title that is given to people who have done something very important. Kelly’s two gold medals showed what can happen when a person keeps on trying."]},{"id":"20-1","level":"Level 20","title":"The Last Two Minutes","paras":["Zainab pulled on her goalkeeper gloves and tapped them together. It was the last game of the season, and the Riverside Rovers were playing Oakfield. The score was two goals each. There were only two minutes left on the clock.","“Stay calm, Zainab,” called her coach, Mr Bell. “You can do this.” Zainab nodded, but her tummy felt as if it was full of butterflies.","Suddenly, an Oakfield player raced down the pitch with the ball at her feet. She was fast, and the Rovers’ defenders could not catch her. Zainab crouched low and stared at the ball. The girl swung her leg back and kicked as hard as she could.","Zainab leapt to her left. She stretched out her arms as far as they would go, and the ball smacked into her gloves. She held on tightly, even though it stung her hands. “Well saved!” shouted the crowd.","Zainab jumped to her feet and threw the ball out to Jonah, who was waiting near the halfway line. Jonah dribbled past one player, then another. He looked up and saw Tamsin running towards the goal all on her own. He passed the ball to her at just the right moment.","Tamsin did not stop to think. She kicked the ball into the corner of the net, and Oakfield’s goalkeeper could only watch it fly past. The Rovers had scored! A moment later, the referee blew her whistle three times. The match was over.","The team cheered and hugged one another. Mr Bell shook Zainab’s hand. “That save won us the game,” he said, smiling. Zainab looked down at her sore fingers and grinned. She did not mind the sting one little bit."]},{"id":"20-2","level":"Level 20","title":"Owls at Night","paras":["Owls are birds that mostly hunt at night. During the day, most owls rest in trees, barns or old buildings. When the sun goes down, they wake up and look for food. Owls live in many parts of the world, and there are more than two hundred kinds.","An owl has very large eyes. They help it to see in the dark. The eyes cannot move around like ours, so an owl turns its whole head instead. It can turn its head a long way round to look behind it. Owls also have excellent hearing. Their ears are hidden under the feathers on the sides of their heads. An owl can hear a tiny mouse moving in the grass.","Owls have soft, fluffy feathers. The edges of their wings are soft too. This means an owl makes almost no sound when it flies. A mouse cannot hear it coming until it is too late.","Owls eat small animals such as mice, worms and beetles. They have sharp claws, called talons, for catching their food. Then they use a strong, curved beak to tear it up. Some owls swallow small animals whole. Later, the owl coughs up a small pellet of the parts it cannot digest, such as fur and tiny bones. Scientists collect these pellets to find out what an owl has been eating.","Many owls make their nests in holes in trees. Some use old nests that other birds have left behind. The mother owl lays her eggs, and she sits on them to keep them warm. After a few weeks, the chicks hatch. Both parents bring food to the nest until the young owls are big enough to fly."]},{"id":"20-3","level":"Level 20","title":"Grandad's Shell Box","paras":["Every summer, Kavi visited his grandad by the sea. Grandad had a wooden box that sat on the shelf in his front room, and it was full of shells. Kavi loved that box more than anything.","“Where did they all come from?” Kavi asked one evening, as he lifted out a spiral shell that was as pale as cream.","“From beaches all over the world,” said Grandad. “I found that one in Portugal. And this striped one came from a beach in Kenya. Your gran and I collected them on our travels.” Grandad ran a finger along each shell as if it were made of glass.","“I want to start a collection,” said Kavi. “Will you help me?” Grandad chuckled. “There’s no better place to start than right outside the door.”","The next morning, they took two buckets and walked down to the beach. The tide had gone out, and the sand was wet and shiny. Kavi bent over and soon found a tiny pink shell, then a flat white one, then a curly grey one. Grandad showed him how to pick out the whole shells and leave the broken ones.","By lunchtime, Kavi’s bucket was heavy. Back at the cottage, he washed each shell in warm water and laid them out on a towel to dry. Grandad gave him a small cardboard box with sections inside, like an egg carton.","That evening, Kavi wrote a label for every shell. He wrote where it was found and the date. His handwriting was rather wobbly, but he did his best. Then he put the box on the shelf, right next to Grandad’s wooden one.","“You know,” said Grandad quietly, “that is the best-looking shelf in the whole house.” Kavi smiled all the way to bedtime."]},{"id":"20-4","level":"Level 20","title":"How to Make Flatbreads","paras":["Flatbreads are soft, warm and very tasty. You can eat them with soup, roll them around a filling or dip them into a sauce. They are quick to make, and you do not need to wait for the dough to rise. Ask an adult to help you, because you will be using a hot pan.","You will need:","• 300 grams of plain flour, plus a little extra for rolling\n• half a teaspoon of salt\n• 150 grams of plain yoghurt\n• two tablespoons of olive oil\n• a rolling pin, a large bowl and a frying pan","Method","First, wash your hands. Tip the flour and the salt into the bowl and stir them together with a spoon. Next, add the yoghurt and the oil. Mix everything until it starts to come together in one lump.","Now use your hands to squeeze and knead the dough for about five minutes. It should feel soft and smooth, and it should not stick to your fingers. If it is too sticky, add a sprinkle of flour. If it is too dry, add a spoonful of yoghurt.","Cover the bowl with a clean tea towel and leave the dough for twenty minutes. This makes it easier to roll out.","After that, cut the dough into six equal pieces. Roll each piece into a ball. Dust your table with flour and roll each ball into a flat circle about as thick as a coin.","Ask your adult to heat the frying pan until it is hot. Cook one flatbread at a time. After about a minute, small bubbles will appear on top. Flip the bread over and cook the other side for a minute too. Stack the cooked flatbreads under a clean tea towel to keep them warm.","Serve your flatbreads while they are still warm. They are best eaten on the same day."]},{"id":"20-5","level":"Level 20","title":"The Train to the Sea","paras":["On Saturday morning, my dad woke me up before the sun had come up. “Come on, Mia,” he whispered. “We have a train to catch.” I sat up straight. We were going to the seaside for the very first time.","At the station, the platform was full of people with bags and buckets. I held Dad’s hand tightly as the train rattled in. It was long and green, and it let out a loud hiss when it stopped. We climbed aboard and found two seats by the window.","The train began to move slowly, then faster and faster. Houses and gardens flashed past. I counted seven horses in one field, and then a tractor, and then a tiny church on a hill. Dad gave me a cheese sandwich, and I ate it while I watched the world zoom by.","After an hour, we went through a long tunnel. Everything went dark, and the windows turned into mirrors. I could see my own face looking back at me. I squeezed Dad’s arm, but he only laughed. “Wait for it,” he said.","Then we shot out into the light, and there it was. The sea stretched out flat and shining, as far as I could see. It was bluer than my school jumper. White birds circled above it, and their cries sounded like laughing.","“Is that really the sea?” I asked. “It’s so big!” Dad nodded and smiled.","A few minutes later, the train slowed down and stopped. The doors slid open, and a salty breeze rushed in. I jumped down onto the platform and pulled Dad towards the sand. It had been a long journey, but I did not feel tired at all."]},{"id":"20-6","level":"Level 20","title":"Diwali, the Festival of Lights","paras":["Diwali is a festival. Millions of people all over the world celebrate it. It is often called the Festival of Lights. Hindu, Sikh and Jain people all celebrate Diwali, but they may do so for different reasons. It happens in autumn, in October or November.","Diwali lasts for five days. The main night is the third day. On that night there is no moon, so the sky is very dark. This makes the lights shine even more brightly.","Lamps are a big part of Diwali. Families light little clay lamps called diyas. They put them on windowsills, on doorsteps and along garden walls. Some people hang up strings of coloured lights too. The whole street can glow. Lighting the lamps is a way of welcoming happiness into the home.","Before the festival, people clean their homes from top to bottom. They also make patterns called rangoli on the floor by the front door. A rangoli can be made from coloured powder, rice or flower petals. The bright shapes are there to welcome visitors.","Food is important at Diwali too. Families cook special meals and make sweets to share. Laddoos are little round sweets. Barfi is cut into small squares. People give boxes of sweets to friends and neighbours. Sharing food with others is a very happy part of the festival.","Many people wear their best or new clothes for Diwali. Families visit each other, send cards and give gifts. Children often enjoy this part of the festival very much. In some places, there are fireworks at night that fill the sky with colour.","Diwali is a time for family and friends to come together. Lighting a lamp, making a rangoli or sharing a sweet are all ways to spread joy and kindness."]},{"id":"20-7","level":"Level 20","title":"Stevie Wonder, Musician","paras":["Stevie Wonder is a very famous musician. He was born on the 13th of May 1950 in Saginaw. This is a city in Michigan, in the United States. Stevie has been blind since he was a baby. He grew up in a city called Detroit.","Music filled Stevie’s life from a very young age. He learned to play the piano, the harmonica and the drums. By the time he was eight years old, he was already a skilled musician. He sang beautifully too.","While he was still a boy, Stevie joined a record company called Motown. The company gave him a new name: Little Stevie Wonder.","In 1963, when Stevie was 13 years old, he made a record called “Fingertips”. It was recorded in front of a live audience. It became number one in the American charts. No singer had ever been so young to have a number-one hit there.","In the 1970s, Stevie made a series of famous albums. They included Talking Book in 1972, Innervisions in 1973 and Songs in the Key of Life in 1976. Many people bought these albums. Lots of the songs are still played today.","Stevie has won 25 Grammy Awards. These are important prizes in the world of music. They are given out every year to musicians from many countries. He has also won an Academy Award for a song called “I Just Called to Say I Love You”. In 2014, he was given the Presidential Medal of Freedom. This is one of the highest honours in the country.","Today, Stevie Wonder’s songs are loved by people of all ages. His music shows how one person can bring joy to people all around the world."]},{"id":"21-1","level":"Level 21","title":"The Bookshop on Chapel Lane","paras":["On Saturdays, Ravi helped his aunt in her bookshop for old books. It was a narrow, crooked little shop, and every wall was piled high with books. Ravi’s job was to dust the shelves and put returned books back in their proper places.","One rainy afternoon, an elderly man came in, shaking the drops from his umbrella. “I am looking for a book I loved as a boy,” he said, “but I have forgotten the title.” Ravi’s aunt was busy at the till, so Ravi stepped forward. “I could help you look,” he said.","“What do you remember about it?” asked Ravi. The man frowned and stared at the ceiling. “It had a green cover,” he said slowly. “It was about a boy who sailed across the sea in a small boat. And there was a parrot who could talk.”","Ravi began to search. He pulled out a green book called Farmer Jack, but the man shook his head. He tried another, about a family of ducks, but that was not right either. The man sighed. “Perhaps it was too long ago,” he said.","“Wait,” said Ravi. He remembered a shelf near the window where he had been tidying that morning. He hurried over and ran his finger along the spines. Halfway along, he spotted a faded green cover with a tiny picture of a boat. The title was The Boy and the Blue Parrot.","He carried it back to the man, who took it in both hands as though it were made of glass. He opened the first page and read a few lines. Then his face broke into a huge smile. “This is the very one,” he whispered. “I have not seen it for sixty years.”","At the door, he turned to Ravi. “Thank you,” he said. “You have a real gift for finding things.”","When the door had closed, Ravi’s aunt winked at him. “You may just have a job here when you are older,” she said. Ravi grinned and went back to his dusting, feeling ten feet tall."]},{"id":"21-2","level":"Level 21","title":"From Bean to Bar","paras":["Chocolate comes from the seeds of a tree called the cacao tree. These trees grow only in warm, wet parts of the world, such as West Africa and South America. It takes a great many steps to turn those seeds into the smooth chocolate that we buy in shops.","The story begins with the cacao pod. A pod is about the size of a small rugby ball, and it grows straight out of the tree’s trunk and branches. Inside each pod are about forty seeds, called beans, which are covered in a sticky white pulp. Farmers cut the pods open with a large knife and scoop out the beans.","Next, the beans are piled up and covered with leaves for several days. During this time, they heat up and begin to change. This step is called fermenting. It is very important, because it is what starts to give the beans their rich, chocolate flavour.","After that, the beans are spread out in the sun to dry. Farmers turn them over regularly so that they dry evenly. When they are dry, the beans are packed into sacks and sent by ship to factories all over the world.","At the factory, the beans are roasted in large ovens. Roasting makes the flavour stronger and the smell delicious. Then the thin shells are cracked off, and the insides are ground into a thick, dark paste.","The paste is not yet sweet. To make the chocolate we like to eat, makers mix in sugar. For milk chocolate, they also add milk. The mixture is then stirred slowly for many hours until it is silky smooth.","Finally, the warm liquid chocolate is poured into moulds and left to cool. As it cools, it becomes hard and shiny. The bars are wrapped and packed, and then they are ready to be taken to shops.","So the next time you enjoy a piece of chocolate, remember how far it has travelled and how many people helped to make it."]},{"id":"21-3","level":"Level 21","title":"Snail Race","paras":["Every year in Aisha’s school, the Year Threes held a snail race. Aisha had been looking forward to it for weeks. She had found her snail under a flowerpot in the garden, and she had named him Turbo.","On the morning of the race, Mrs Kelly drew a large circle on the playground with chalk. The snails were to be placed in the middle, and the first snail to reach the edge would be the winner. Aisha set Turbo down carefully and crossed her fingers.","“Ready, steady, go!” called Mrs Kelly. For a long moment, nothing happened. Then Turbo pulled his head into his shell and stayed exactly where he was. Aisha groaned. The other snails were slowly creeping outwards, leaving shiny silver trails behind them.","“Oh, Turbo,” Aisha muttered. “Please move.” Her friend Elliot leaned over her shoulder. “Mine is nearly at the edge,” he said proudly. “He’s called Lightning.” Aisha sighed. It seemed that Turbo had not been the best choice.","Then something odd happened. The playground had been warming up in the sun all morning, and Turbo’s head slowly reappeared. He stretched out his long, soft body and began to glide across the ground. He was not fast, but he kept going without stopping.","Meanwhile, Elliot’s snail had wandered off in the wrong direction and was heading back towards the middle. Other snails had stopped to rest, and one had even begun to climb up a boy’s shoe.","Turbo kept moving steadily. Inch by inch, he crept towards the chalk line, and Aisha held her breath. At last, his front end slid across it. “We have a winner!” cried Mrs Kelly. The whole class cheered.","Aisha scooped up her snail and held him in her palm. “You were just waiting for the right moment,” she said, laughing. Turbo stayed in his shell, looking quite pleased with himself. Then Aisha carried him carefully back to the flowerpot where she had found him."]},{"id":"21-4","level":"Level 21","title":"The Great Swallow Journey","paras":["Every spring, swallows arrive in Britain from a long way away. These small, graceful birds have shiny blue backs, red throats and long, forked tails. Each swallow weighs less than a slice of bread. Yet, each year, it makes one of the longest journeys of any small bird.","Swallows spend the winter in southern Africa, where it is warm and there are plenty of insects to eat. When spring comes, they set off north. The journey is more than five thousand miles long, and it takes several weeks. On the way, the birds cross the sea, the Sahara Desert and the mountains of Europe.","Swallows do almost everything while flying. They catch flies and other insects in mid-air, and they can even drink by skimming low over a pond and scooping up water in their beaks. This means they do not need to land very often, which is useful on such a long trip.","Amazingly, a swallow often returns to the same place that it left the year before. If it can, it will use the same nest. Swallows build their nests from small balls of mud mixed with grass. They stick them inside barns and sheds, or under the roofs of buildings. The nest is shaped like a little cup.","A female swallow lays four or five eggs. Both parents take turns feeding the chicks, and they may make hundreds of trips each day to bring insects to the nest. After about three weeks, the young birds are ready to fly.","By late summer, swallows gather in large groups. You may see them sitting in a row on a wire, chattering to one another. When autumn arrives, the insects become harder to find. It is then that the swallows leave to make the long journey back to Africa.","No one knows for certain how swallows find their way. Scientists think they may use the sun, the stars and even the shape of the land below them. Whatever their secret, swallows show that even a tiny bird can travel a very long way."]},{"id":"21-5","level":"Level 21","title":"Lantern Night","paras":["It was the evening of the Lantern Festival, and the whole town had come out to the park. The sky was turning from pink to deep blue, and the air was crisp and cool. Nobody wanted to go home.","Along the path, hundreds of paper lanterns hung from the branches of the trees. Some were round and red, like tiny glowing suns. Others were shaped like fish, with orange scales and long tails that swayed in the breeze. A lantern in the shape of a dragon curled around a lamppost, and its eyes flickered gold.","Children ran between the trees, holding their own lanterns on sticks. Mei carried a white rabbit that she had made at school with her friends. Its ears were made from folded paper, and a small candle glowed inside its round body. She held it high above her head so everyone could see.","The smells drifted across the grass. There were sweet rice balls from a little stall, and roasted chestnuts that crackled in a paper bag. Someone was selling hot orange juice in tiny cups. A musician beside the fountain played a gentle tune on a wooden flute.","At eight o’clock, a drum began to beat. Boom, boom, boom. The crowd turned towards the lake, where a line of floating lanterns was being lowered on to the water. They bobbed gently, and their reflections wobbled and danced.","Mei’s grandmother came to stand beside her. “Isn’t it lovely?” she said softly. Mei nodded and squeezed her hand. She thought the lake looked as though someone had scattered stars across it.","Slowly, the lanterns drifted apart. The drum grew quieter and then stopped altogether. For a moment, the whole park was silent. Then the crowd began to clap, and the sound rolled across the water like a wave.","Mei walked home slowly, her rabbit lantern still glowing in her hand. She knew that she would remember that night for a very long time."]},{"id":"21-6","level":"Level 21","title":"Should We Walk to School?","paras":["Every morning, the roads outside our school are full of cars. Parents queue at the gates, engines humming, while children hurry in through the traffic. I believe that many more of us should walk to school, and there are three good reasons why.","First, walking is good for our health. Children need to be active every day, and a walk to school is an easy way to do it. Even a short walk gets our hearts pumping and our legs moving. When we arrive, we are awake and ready to learn. Pupils who have been sitting in a car often feel sleepy and slow.","Second, walking is better for the environment. Cars burn petrol, and this makes fumes that dirty the air. The air near a busy school gate can be unpleasant to breathe. If fewer families came by car, the air would be cleaner for everyone, and the road outside would be safer too.","Finally, walking is enjoyable. On foot, we can chat with friends and notice things that we would miss from a car window, such as a squirrel darting up a tree or the first flowers of spring. Some of my best conversations have happened on the way to school.","Some people argue that walking takes too long, or that the weather is often bad. However, many families live close enough to walk in less than fifteen minutes. And, as the saying goes, there is no such thing as bad weather, only the wrong clothes. A good coat and a pair of boots solve the problem.","Of course, not every family can walk. Some children live too far away, and some need a car for other reasons. But those who can walk should try it.","In conclusion, walking to school is healthy, kind to the planet and fun. If we all tried it just one day a week, our school would be a happier, cleaner and safer place."]},{"id":"21-7","level":"Level 21","title":"Helen Keller and Her Teacher","paras":["Helen Keller was born in 1880 in a town called Tuscumbia, in the American state of Alabama. When she was very small, she lost both her sight and her hearing. It was very hard for her to tell her family what she wanted.","In March 1887, when Helen was nearly seven, a young teacher named Anne Sullivan came to live with the family. Anne could spell words on a person’s hand using her fingers. She gave Helen a doll and spelled the word d-o-l-l into Helen’s palm. Helen liked the doll, but she did not yet understand that the shapes Anne made with her fingers were words.","Then, on the 5th of April 1887, Anne took Helen outside to the water pump. She held one of Helen’s hands under the pump while the cool water splashed over it. With her other hand, Anne spelled the word w-a-t-e-r, first slowly and then quickly. At last, Helen understood that the shapes in her hand were the names of things.","After that, Helen wanted to know the name of everything she touched. Anne said that in just a few hours Helen had learned thirty new words, including door, open and give.","Helen kept learning for many years. She learned to read braille, which uses patterns of raised dots that can be read with the fingertips. She also learned to write and, with a great deal of practice, to speak.","Anne went to lessons with Helen and spelled out what the teachers said. In 1904, Helen finished her studies at a college called Radcliffe. She was the first person who was both blind and deaf to earn a university degree.","Helen went on to write many books, and she travelled to many countries to give talks. Her story shows how much a person can achieve with a good teacher and plenty of patience."]},{"id":"22-1","level":"Level 22","title":"The New Girl","paras":["Maya had sat at the same table since Reception, so when she arrived on Monday morning and noticed an unfamiliar girl beside the window, she stopped in the doorway. The girl had short black hair and a bright yellow rucksack, and she was gazing intently at her shoes as though they might offer some escape.","“Everyone, this is Nia,” announced Mr Hall. “She has just moved here from Nigeria, and I am looking for someone to take care of her today.” Nobody volunteered. The whole class seemed to have become fascinated by the ceiling, because everybody was far too shy to speak.","Maya felt her stomach flip over. Then she remembered her first day at gym club, when nobody had said a single word to her, and she raised her hand slowly before she could change her mind.","At break, Maya showed Nia where the water fountain was and which toilets never had a queue, but Nia only nodded politely. At lunch, she merely picked at her sandwich.","“Don’t you like it?” asked Maya.","“It is fine,” Nia replied quietly. “I just miss my old school, where everybody knew my name.”","Maya thought hard. Suddenly, she pulled a felt-tip pen out of her pocket, grabbed a paper napkin and drew a wobbly circle. “Let’s play a game,” she suggested. “I draw a shape, and you add to it until it turns into an animal.”","Nia took the pen, gave the circle two long ears and a fluffy tail, and then she giggled. “It’s a rabbit!” she exclaimed.","Next, they drew a giraffe, a snail and a very peculiar fish with legs. By the time the bell rang, the napkin was crammed with scribbles, and the two friends were laughing so loudly that the lunchtime supervisor turned round to see what was happening.","As they walked back to class, Nia stopped. “Thank you, Maya,” she said. “You are the first person who has asked me to play.”","“Tomorrow, you can choose the game,” Maya replied, “and I will bring more paper.”","Nia was no longer staring at her shoes. She held her head high, and her yellow rucksack bounced cheerfully with every step."]},{"id":"22-2","level":"Level 22","title":"Life in a Pond","paras":["A pond is a small area of still water, often with plants growing around its edges. From the bank, a pond can look quiet, but it is really a busy habitat. A habitat is the place where a plant or an animal lives and finds everything it needs. Hundreds of small creatures can live in one garden pond.","A pond has different layers, and each one suits different animals. On the surface, pond skaters glide across the water without sinking. Their bodies are very light, and their long, thin legs spread their weight out, so they do not break the surface.","Below the surface, in the open water, fish and tadpoles swim about. Tadpoles hatch from the jelly-like eggs that frogs lay in spring. They feed on tiny green plants, and slowly they grow back legs and then front legs.","At the bottom of the pond, there is thick mud. Snails, worms and dragonfly nymphs live here. A nymph is a young dragonfly that has no wings. It hides in the mud and snaps up tadpoles and other small creatures as they pass by. When it is fully grown, the nymph climbs up the stem of a plant. Its skin splits open, and the adult dragonfly crawls out and flies away.","Plants are important in a pond too. Water lilies have flat leaves that float on the top. These give shade and hiding places for the animals underneath. Plants that grow under the water make oxygen, which many pond animals need to breathe.","Some animals visit the pond but do not live there. Birds come to drink and to wash their feathers. A heron may stand very still at the edge for a long time, waiting to catch a fish.","If you dig a pond in your garden, you can help wildlife by making one side slope gently. Then animals that fall in can climb out safely. Before long, the first visitors will arrive."]},{"id":"22-3","level":"Level 22","title":"The Missing Biscuits","paras":["On Monday, there were ten shortbread biscuits in Nani’s old blue tin. By Tuesday evening only eight remained, and by Wednesday there were just five, which left Nani thoroughly puzzled.","Hassan and his cousin Ellie were staying for the week. Ellie glanced at Hassan with narrowed eyes. “You had two extra yesterday,” she declared. “I saw you.”","“I did not!” protested Hassan, his face turning red. “I only ate the one that you gave me.”","They glared at each other until Nani raised her hand. “Nobody is in trouble,” she said calmly, “but I would very much like to know who is responsible.”","Hassan resolved to become a detective. He fetched his notebook and searched the kitchen carefully. On the windowsill beside the tin, he discovered a scatter of crumbs, and there were tiny scratches on the lid, one corner of which looked nibbled. Outside, the ledge was dotted with small muddy prints that had thin, pointed toes.","“Ellie, come and look at this!” he called. “Whoever took the biscuits did not use the door. They climbed in through the window.”","“Then it must be a burglar,” said Ellie, folding her arms.","Hassan shook his head. “A burglar would have stolen the entire tin, and no burglar has feet as small as these.”","The following afternoon, the cousins concealed themselves behind the curtain, leaving the window open a crack. They waited for what felt like hours. Just as Ellie’s legs began to ache, a bushy grey tail appeared. A squirrel leapt onto the sill, sniffed the air suspiciously and prised the lid off the tin with its paws. It seized a biscuit, stuffed it into its cheek and scampered away.","“It’s a squirrel!” hissed Hassan, and Ellie giggled so much that the curtain shook.","When they explained everything, Nani laughed until she had to wipe her eyes. “Well, that is a relief,” she said. “I was beginning to think I had forgotten how to count!”","From then on, the tin lived on a high shelf, and a small pile of nuts waited on the windowsill instead. Ellie apologised to Hassan, and he generously shared his last biscuit with her."]},{"id":"22-4","level":"Level 22","title":"How a Zip Works","paras":["Look closely at the zip on a coat or a school bag, and you will see two long rows of tiny teeth. When the zip is closed, the teeth on one side lock into the teeth on the other, holding the two edges of cloth tightly together. Yet all it takes to open or close a zip is one small pull. How does it work?","The secret is a small part called the slider. The slider is the piece you hold when you pull the zip up or down. Inside it, there is a Y-shaped channel, like a tiny tunnel that splits into two at one end.","Each tooth in the zip has a bump on one side and a hollow on the other. When two teeth are pressed together, the bump on one tooth fits into the hollow on its partner, like two pieces of a puzzle. This is called interlocking.","When you pull the slider up, the two rows of teeth enter the wide end of the Y separately. As they travel along the tunnel, the walls squeeze the rows closer and closer together. By the time the teeth leave the narrow end, the bumps and hollows have met and clicked into place. The zip is closed.","Pulling the slider down does the opposite. Inside the slider, there is a small wedge that pushes between the teeth and forces them apart. The two rows come out through the wide end of the Y separately, and the zip is open again.","Every zip also has a stop at the top and another at the bottom. These small pieces of metal or plastic make sure that the slider cannot slip off the end of the rows.","Zips were first made more than a hundred years ago. They soon became popular because they were much quicker to fasten than a long line of buttons or laces. Today, you can find them on coats, bags, tents, sleeping bags and even on the cushions on your sofa."]},{"id":"22-5","level":"Level 22","title":"Sports Day","paras":["Yesterday was Sports Day, an event I had been both looking forward to and dreading for weeks. The sun was shining, the field smelt of freshly cut grass, and every child was wearing the colour of their team. I was in Team Green.","My first race was the sack race. I hopped as quickly as I could, but halfway down the track my legs became tangled and I toppled onto the grass. My team groaned, and I felt my cheeks burn with embarrassment. Then my friend Ben dashed over from the side of the track and held out his hand. “Up you get!” he said. “You are nearly there.” I finished in fourth place, and, surprisingly, I did not mind at all.","After lunch came the egg-and-spoon race, which was the one I was most nervous about. I walked as carefully as possible, holding my breath and keeping my eyes fixed on the wobbling egg. Beside me, Ben was doing exactly the same, until his egg suddenly slipped off the spoon and bounced away across the grass.","I could have carried on. I was in second place, and the finish line was only a few steps ahead. Instead, I stopped and helped him to chase
