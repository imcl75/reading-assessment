iour has challenged an old belief. Scientists once thought that making tools was a talent confined to humans and their closest relatives. The New Caledonian crow, a glossy black bird with a heavy, straight beak, would scarcely earn a second glance on a woodland path. Yet how it finds its food has drawn researchers from around the world, who have spent decades watching, filming and testing it.","The crow’s principal prey is a plump grub that burrows into rotting timber, safely beyond the reach of even the longest beak. To extract it, the bird selects a slender twig and snaps it to a suitable length. It strips away the leaves and side shoots that would get in the way, pushes the twig into the tunnel and waits until the grub clamps its jaws on the tip. Then the crow draws out its meal. Some individuals refine the technique, breaking a twig off at a fork so that a small hook remains at one end, which they trim with meticulous care. Others tear strips from the serrated leaves of a pandanus plant, making narrow tools whose edges are lined with tiny barbs.","Perhaps more striking is the crows’ regard for their equipment. Individuals have been seen carrying a favoured tool from one feeding site to the next, rather than making a new one each time. Such conduct is rare, because it implies foresight: a bird that saves a tool for later seems to recognise that the object is worth keeping.","Tool-making is not an instinct that arrives fully formed. Young crows remain close to their parents for many months, and during that time they observe the adults at work with close attention. Youngsters can be seen handling twigs long before they are skilful, and it takes them a considerable time to master the craft. Biologists therefore regard the skill as largely learned rather than inherited.","A famous experiment at a university in Oxford showed how flexible this ability can be. Researchers placed a tiny bucket of food at the bottom of a narrow, upright tube and offered a crow a length of straight wire, which was useless for lifting the bucket by its handle. The bird wedged one end of the wire into a gap and tugged the other end with its beak until it bent, then hooked the bucket out. Because crows in the wild have no access to wire, the bird had not repeated a habit; it had solved a problem it had never met.","How much the crows truly comprehend remains contested. Some researchers argue that the birds reason about cause and effect, whereas others maintain that trial and error, together with a good memory, can account for the results. Whichever view eventually prevails, the crows have already forced scientists to reconsider what a small brain is capable of."]},{"id":"31-6","level":"Level F1","title":"A Key in the Lining","paras":["The coat had hung on the rail for three weeks before Ines finally carried it to the till, a long bottle-green thing with cuffs rubbed thin and a faint smell of lavender and old paper. “Four pounds,” said the woman behind the counter, pencil in hand, not lifting her eyes from a half-finished crossword. “Nobody else wanted it.” Ines, who was saving every spare coin for trainers and could scarcely afford a bus fare, paid anyway, without being able to say why.","It was on the bus home that her fingers, wandering idly along the hem, found something hard beneath a small tear in the lining: a brass key no longer than her thumb, knotted to a faded blue ribbon, with a card folded around it. The handwriting was so slanted and old-fashioned that she had to tilt the card towards the window to decipher it. “If you have found this,” it read, “ask at number 9, Coldharbour Lane.”","She read it four times and then rang the bell two stops early. Coldharbour Lane proved to be a narrow street of tall terraced houses whose doors had faded over the years to tired shades of red and green, and number 9, the last of them, had a crooked gate and lace at the window. Ines hesitated on the pavement, her imagination sprinting through every story she had ever read, before she pushed the gate open.","The door was opened by a small, upright woman with silver hair and a pencil tucked behind one ear, whose glance travelled from the coat to the key and back again as something in her face loosened. “Three weeks,” she said. “I had begun to fear that nobody was curious any more.”","Ines stared, for she had seen that pencil before, and that same dry way of speaking. “You were at the till,” she said, “and you told me nobody else wanted it.” “And nobody did,” said the woman. “That was rather the point.”","She led Ines along a hall crowded with photographs of children squinting into the sun, each clutching a recorder or a trumpet, and into a front room where an upright piano stood beneath a knitted shawl, its lid shut. “I am Mrs Bhatt,” she said, “and this street was a good deal noisier in my time. These days my fingers ignore my instructions, and since the spring the piano has stayed closed. It is a poor thing for an instrument to be locked away with nobody to play it.” She nodded at the key. “I hoped someone might come and turn it.”","“So the coat was a trick,” said Ines, but Mrs Bhatt corrected her gently: “An invitation. A trick means I set out to fool you.”","Ines looked at the key, then at the piano, then at the key again, and found that the trainers she had been saving for mattered a little less than they had that morning. She knelt, fitted the key into the lock and turned it. The lid rose with a sigh, and the first note she pressed rang out through the room, low and true, as if the piano had been waiting for her all along."]},{"id":"31-7","level":"Level F1","title":"The Doctor of Aldeburgh","paras":["Elizabeth Garrett Anderson was born in London on the 9th of June 1836, at a time when almost every doctor in Britain was a man. Women were expected to look after their homes and families, and the medical schools where doctors were trained did not welcome them. Elizabeth, however, was determined to become a doctor, and she was prepared to be patient and clever in order to succeed.","Her first step was to work as a nurse at the Middlesex Hospital in London in 1860. At the same time, she took private lessons in subjects such as Latin, Greek and anatomy, which is the study of the human body. She also applied to several medical schools, but each one turned her away. Many people might have given up at that point, and few would have blamed them. Elizabeth looked instead for another way in.","She discovered that a group called the Society of Apothecaries, whose members prepared and sold medicines, set its own examination, and that its rules did not say that only men could take it. If she passed, she would be given a licence to practise as a doctor. In 1865, Elizabeth sat the examination and passed, becoming the first woman to qualify as a doctor in Britain in this openly recognised way. Soon afterwards the Society changed its rules so that other women could not follow the same route, but by then the door had already been opened.","A qualified doctor still needed patients, so in 1866 Elizabeth opened a dispensary in London. A dispensary is a place where people can see a doctor and receive medicine, and hers was for women and children. She named it St Mary’s Dispensary for Women and Children. It was a modest beginning, but it gave her the chance to prove, day after day, that a woman could care for patients with skill and kindness.","Elizabeth did not want to be the only one. In 1874 she helped to found the London School of Medicine for Women, a place where women could train as doctors without having to search for a loophole, which is a gap in the rules. She served as its dean, or leader, until 1902.","In 1902, Elizabeth retired to the seaside town of Aldeburgh, in Suffolk. She did not stop working for her community, however. In 1908 the people of Aldeburgh elected her as their mayor, and she became the first woman to hold that office in England. By then she was married to James Skelton Anderson, whom she had wed in 1871, and she had become known by the name Garrett Anderson. The girl who had once been told that medicine was no place for women had become, in the end, the leader of a whole town."]},{"id":"32-1","level":"Level F2","title":"What the Pear Tree Knew","paras":["The pear tree at the far end of Grandad’s allotment was older than my mother, and it carried its age with an air of quiet superiority. The pear stood apart from the fussing apple trees, gnarled and unhurried, its branches twisted like the knuckles of an old hand, and I had spent most Saturdays of my childhood beneath it.","This autumn, for the first time, I went alone. Grandad had moved in the summer to a ground-floor flat, where his stiff knees no longer had to contend with the steep path, and before he left he had pressed the shed key into my hand with the solemnity of a monarch handing over a crown. “Somebody ought to see to the pears,” he had said, gazing out of the window rather than at me, as though the request had cost him a good deal more than he intended to admit.","The fruit was ready; I could tell because the air beneath the branches hung thick and sweet, and the wasps, drunk on sugar, drifted through it without the slightest interest in me. I hauled the tall ladder into place and began to pick, easing each pear from its stalk with a small, reluctant twist. By noon six crates stood in a row.","What I had not anticipated was how much of Grandad I would find in the work. With every branch I reached, I heard his instructions: never pull, always twist; leave the small ones, since they are still deciding. His advice had always arrived sideways, folded inside stories about his own father, who had grown this tree from a pip and been laughed at by every plot-holder on the row. “Pears take their time,” Grandad would say. “A decade before the first fruit, and most people haven’t the patience.” It had not occurred to me until that afternoon that he might not have been talking about pears.","By late afternoon I faced a difficulty, because six crates were far more than one family could eat. I might have sold them at the gate, as the neighbouring plot-holders did, but I thought instead of Mr Okafor, who had once left a jar of chutney on our shed step without so much as a note, and of the young couple with twins, who never seemed to own a spare minute between them. I began to carry pears down the path, one paper bag at a time.","Dusk was gathering by the time I reached Grandad’s flat with the last bag cradled against my chest. He was in his armchair, and when I laid a single pear in his palm he turned it over, pressed his thumb beside the stalk, and smiled slowly, as though it were a letter from someone he had missed.","“You twisted them,” he said. It was not a question.","“I did.”","“And the small ones?”","“Still deciding.”","He laughed, a dry, delighted laugh, and bit into the fruit; juice ran down his chin. Somewhere between the ladder and the armchair I had understood that the tree had never been about pears at all. It concerned what a person leaves for others, and how long they are willing to wait for it."]},{"id":"32-2","level":"Level F2","title":"Bogs That Breathe","paras":["When most people imagine a threatened habitat, they picture a rainforest or a coral reef. Few think of a bog. Yet the soggy, spongy landscapes known as peatlands are among the most valuable places on Earth, and in many countries, including the United Kingdom, they are quietly disappearing.","A peat bog begins with water that cannot drain away. In waterlogged ground, dead plants do not rot in the usual way, because rotting depends on tiny living things that need air, and there is very little air in sodden soil. Instead, the remains of plants, especially mosses, pile up layer upon layer and are slowly squashed into a dark, crumbly material called peat. The process is extraordinarily slow: a bog may grow by only about a millimetre a year. The deepest peat in Britain began to form thousands of years ago.","This matters because plants take in carbon dioxide from the air as they grow. When plants rot, most of that carbon returns to the atmosphere. In a bog, however, it stays locked in the peat. Although peatlands cover only about three per cent of the world’s land, they hold more carbon than all of the world’s forests put together. Scientists sometimes describe them as a vast natural storeroom for carbon.","The trouble begins when bogs are drained. For centuries, people have dug peat to burn as fuel, drained the land to create farms, or sold the peat as compost for gardens. Once a bog dries out, air reaches the peat, and the rotting that was paused for thousands of years begins again. The stored carbon escapes as carbon dioxide, and a bog that once helped to keep the planet cooler starts to warm it instead.","Bogs matter for other reasons too. Their mosses soak up rainwater like enormous sponges, which slows the flow of water into rivers and can reduce flooding in towns downstream. Rare wildlife lives in them: dragonflies breed in the bog pools, and a small plant called the sundew traps insects on sticky, glistening hairs to gain the nutrients that the poor, acidic soil cannot provide. Because peat contains so little air, it can also preserve ancient wooden objects for centuries, so bogs are valued by people who study the past.","The encouraging news is that some of the damage can be reversed. Conservation teams block the ditches that drain a bog, building small dams from wood, plastic or peat, so that water backs up and the ground grows wet again. Volunteers then plant clumps of sphagnum moss, the main peat-forming plant, and within a few years the bare, cracked surface begins to turn green. Many gardeners now choose peat-free compost, which reduces the demand for digging bogs up.","Restoring a bog requires patience. Nobody can rebuild in an afternoon what nature took thousands of years to make. Even so, each wet, mossy field that is brought back to life is a step in the right direction, because a healthy bog does its work quietly, day after day, without anyone noticing."]},{"id":"32-3","level":"Level F2","title":"A Piece Out of Place","paras":["On Thursday afternoon the chess club at Larkhill Primary made a startling discovery: the white queen had vanished. Mr Adeyemi, who ran the club, held the wooden box open, and the empty velvet hollow gaped at the children like a missing tooth. “Every piece was here at lunchtime,” he said, his voice unusually tight, “and I counted them myself, so with the tournament tomorrow we have a serious problem: nobody can play without a queen.”","Eleven children stood around the table, each wearing an expression of studied innocence. Hana, who read detective stories by torchlight under her duvet, said nothing at all, for she maintained that the truth was rarely hidden and was merely waiting for someone patient enough to notice it.","“Who had the box last?” she asked eventually, but nobody could say, for the box had lived in the cupboard in Room 6 since lunch and the only key hung on a hook behind Mr Adeyemi’s desk. Yet the cupboard door, Hana observed, stood open by the width of a finger, and when she crouched she saw on the carpet a single glittering speck of silver, while the air near the shelf carried a faint, sharp smell that she could not immediately place.","“Perhaps somebody took it as a joke,” muttered Ewan, folding his arms. “Or as a strategy,” retorted Imogen, glaring at him, “since some people would do almost anything to avoid playing me.”","Hana ignored them both, because she was watching Callum. He stood at the edge of the group with his hands buried in his sleeves, which in itself was unremarkable, since Callum was shy and habitually hovered on the fringes of things. What held her attention was the restless movement of his fingertips inside the cuffs, which pressed together and then parted with a tiny, reluctant tug, as though something tacky were clinging to them. She thought again about the smell: sharp, chemical, faintly sweet. It belonged in the art room, beside the trays of glitter, and it belonged to glue.","Hana asked whether anyone had used the room after lunch, and Mr Adeyemi answered that only Callum had, since he had stayed behind to stack the chairs; every head turned, and Callum’s face flushed the colour of beetroot.","Hana stepped closer and lowered her voice so that only he could hear. “I don’t think you took it,” she said. “I think you mended it.”","For a long moment Callum studied the floor. Then, slowly, he drew the white queen from his blazer pocket. A jagged crack ran through her crown, sealed with a bead of glue, and a dusting of silver glitter clung to her base. “I knocked the box off the shelf,” he whispered. “Her crown snapped off, and I was too embarrassed to say, so I took her to the art room. I only wanted to fix her before anyone found out.”","Mr Adeyemi turned the piece over in his palm, and his frown dissolved. “A little glue between friends,” he said. “I can think of far worse crimes.” Callum gave a shaky laugh, and Hana, smiling, set the queen on the radiator to dry."]},{"id":"32-4","level":"Level F2","title":"Should Museums Be Free?","paras":["Every year, millions of people walk through the doors of museums to admire dinosaur skeletons, ancient jewellery and paintings hundreds of years old. In some places, entry costs nothing; in others, visitors must pay at the desk. Should museums be free for everyone, or is it fair to charge?","Those who believe in free entry begin with fairness. Museums look after objects that belong, in a sense, to everybody, and it seems wrong that a family with little money should be shut out of its own history. A single ticket may seem cheap to one person, but for a family of five the cost can mount up quickly. When entry is free, children who would never otherwise visit can wander in on a wet afternoon, and a lifelong curiosity may begin with a single glance at a fossil.","Supporters also point out that free museums encourage short, relaxed visits. Someone can spend twenty minutes studying one painting and return next week to see another, rather than feeling obliged to squeeze in everything to justify the price of a ticket. Free museums can also bring life to the streets around them, since visitors often stop at nearby cafés and shops.","Those who favour charging offer a different argument. Museums are expensive to run. Fragile objects must be kept at the right temperature, guarded, cleaned and repaired by trained experts, and the buildings themselves need heating, lighting and repairs. If governments or councils cannot provide enough money, the museum must earn it elsewhere, and ticket sales are one of the most reliable ways of doing so.","They also argue that a small fee can be fair if it is paid only by people who choose to visit. Taxpayers who never set foot in a museum still help to fund a free one; charging moves part of the cost to those who enjoy it. Some museums have found a compromise. They keep their main galleries free but charge for special exhibitions, or they invite visitors to give whatever they can afford as they leave.","Each side has an answer to the other. Critics of charging say that even a suggested donation can make people feel awkward if they have little to give. Critics of free entry reply that donations rarely cover the full cost of keeping a museum open and that the quality of its collections may suffer.","In the end, both sides want much the same thing: for museums to survive, and for as many people as possible to enjoy them. The real disagreement is about who should pay. Perhaps each community must decide for itself how to balance the fairness of open doors against the practical cost of keeping them open. Readers may wish to weigh up the arguments and reach a view of their own."]},{"id":"32-5","level":"Level F2","title":"The Apprentice’s First Sheet","paras":["Haru had been Master Sato’s apprentice for nearly a year, and in all that time she had never once been permitted to make a sheet of paper. Instead she carried water, stripped the bark from bundles of branches until her fingers cracked, and swept a workshop floor that was already spotless, all the while wondering whether she would ever prove worthy of the craft for which the village of Yamane, folded into a valley of tall cedars, was renowned.","Winter arrived early that year. Frost furred the roofs, and the river that ran past the workshop was so cold that it made her wrists ache, yet Master Sato insisted that this was the finest season for the work, since the cold kept the fibres pure and the water clean. “Cold water is honest,” he liked to say. “It hides nothing.”","On the first morning of the new year, the old man placed in Haru’s hands a wooden frame with a bamboo screen stretched across it. “Today you will make paper,” he said, and Haru’s heart leapt as she dipped the frame into the great vat, where pale pulp drifted in water made slippery by the juice of a plant root, and lifted it out, rocking it forward and back exactly as she had watched it done for months.","The sheet that resulted was a disaster: thick as felt in one corner, and so thin in another that daylight shone through it like a window. Haru’s face burned. “It is ruined,” she said. “I am sorry, Master.” Master Sato made no reply. He peeled the damp sheet from the screen, laid it on a board and handed back the frame, and Haru made a second sheet, then a third, then a tenth, her arms trembling and the cold gnawing at her fingers. By afternoon her sheets were less ragged, and by evening a few were almost even, though none resembled the smooth, silky paper that filled the shelves.","When the lamps were lit, the old man carried the day’s pile to the drying boards and smoothed each sheet flat with a soft brush. Only one did he lift to the glow of the lantern: the very first, with its heavy corner and its see-through one. “Look,” he said. “The light passes through here and stops there. This is the only sheet that shows me what you were thinking.” Haru frowned; she had assumed it would be the first to be thrown away.","“Every sheet you make from now on will be better,” said Master Sato, “but that is the easy part. The hard part is remembering how it felt to be bad at it.” Then he slid the paper into a wooden drawer, where Haru glimpsed other sheets already yellowed with age, each of them with a crooked corner. “My master kept mine,” said the old man, and he blew out the lamp."]},{"id":"32-6","level":"Level F2","title":"Letters Cast in Metal","paras":["Before the middle of the fifteenth century, every book in Europe had to be copied out by hand. Scribes, most of them monks, sat for months at a time bent over a single volume, dipping their pens and forming each letter with painstaking care. The results could be beautiful, but they were so slow to produce and so costly to buy that only churches, universities and wealthy families could afford more than a handful of books. For almost everybody else, reading material was scarce.","In the German city of Mainz, around 1450, a goldsmith named Johannes Gutenberg began to wonder whether there might be a quicker way. Printers of the time already carved whole pages into blocks of wood, but a block could print only the page it had been cut for, and the carving itself was laborious. Gutenberg’s insight was to make each letter separately, so that the same pieces could be arranged to form any page and then rearranged for the next.","Making such letters demanded all of his skill as a metalworker. He cut the shape of each character into a hard metal punch, pressed the punch into a softer piece of metal to form a mould, and poured a hot mixture of lead, tin and antimony into the mould, where it cooled into a small block bearing a raised, back-to-front letter. Hundreds of identical letters could be cast from a single mould, and because they were made of metal they were tough enough to be used again and again.","Gutenberg also had to find an ink that would cling to metal, since the watery ink used by scribes simply ran off. After many experiments he produced a thick, sticky ink made with oil. For the press itself he adapted a heavy wooden screw press of the kind used to squeeze juice from grapes. The letters were arranged in a frame, line by line, and inked; a sheet of paper was laid on top, and the screw was turned to press the paper down firmly. When the sheet was lifted away, the page was printed, and the same letters could be inked again at once.","Gutenberg’s greatest project was a Latin Bible, which occupied him and his workers for several years. Roughly a hundred and eighty copies were printed, each running to well over a thousand pages, and a scribe would have needed a very long time to copy even one. The work was expensive, however, and Gutenberg had borrowed heavily to pay for it. When the debt fell due, he lost his workshop, and his former partners carried on printing without him.","The idea, though, could not be stopped. Printers set up presses in one city after another, and by about 1500 there were presses in more than two hundred European towns. In 1476 William Caxton opened the first press in England, at Westminster, and began to print books in English. As books grew cheaper, more people learned to read, and news, ideas and knowledge travelled faster than they ever had before."]},{"id":"32-7","level":"Level F2","title":"A Prize from Sweet Wormwood","paras":["Tu Youyou was born on the 30th of December 1930 in the port city of Ningbo, in the east of China. Years later, she would help to answer an important question that was troubling doctors in many countries: how could a serious disease called malaria be treated more effectively?","Malaria is spread by mosquitoes. When one bites a person, it can pass on a tiny living organism called a parasite, which makes the person ill with fevers and chills. By the 1960s, the medicines used against malaria were beginning to lose their power, because the parasites had become used to them. Doctors needed a new treatment, and they needed it quickly. Tu’s team belonged to a national research effort known as Project 523.","In 1969, Tu was asked to lead a research team in China that would search for one. Rather than start with a laboratory full of chemicals, she began by reading. She and her colleagues studied old medical books and collected traditional recipes, which were often made from plants. By 1971, they had looked at more than two thousand of these recipes and had prepared 380 different plant extracts from about 200 plants. Each extract was tested on mice to see whether it could fight the parasite.","Sweet wormwood was one of the plants that caught the team’s attention, but the usual way of preparing plants, which involved heating them, did not bring out its power. Tu did not give up. She returned to the old books and found a clue in a text about 1,600 years old, written by a scholar named Ge Hong. It advised soaking the plant in water rather than boiling it. Tu realised that heat might be destroying the very ingredient she was looking for.","She changed her method, using a gentler way of extracting the plant’s ingredients at a low temperature. This time the results were striking. In 1972, her team managed to isolate the pure substance, which means to separate it from everything else in the plant. They named it qinghaosu. Today it is known around the world as artemisinin. Medicines based on artemisinin are now used in many parts of the world, and they have helped to treat a great many people with malaria.","In 2011, she received the Lasker-DeBakey Clinical Medical Research Award, a major medical prize, and she was the first person from China to do so. In 2015, Tu was awarded the Nobel Prize in Physiology or Medicine, one of the most respected honours in science, which she shared with two other scientists. She was the first woman from mainland China to win a Nobel Prize. Her discovery, which began in old books and was proved in a laboratory, shows how old knowledge and careful modern testing can work side by side."]},{"id":"32-8","level":"Level F2","title":"Stephen Hawking: Asking the Biggest Questions","paras":["Stephen Hawking was born on the 8th of January 1942 in the university city of Oxford, and it was there, at University College, that he studied physics and earned first-class honours. In October 1962 he moved to Cambridge to begin research, which means trying to answer a question that nobody has yet answered, and in 1966 he gained a doctorate there. Cambridge became his base as a scientist, and he remained a fellow of one of its colleges throughout his life.","Hawking’s chief interest was the universe as a whole, and in particular the objects known as black holes. A black hole is so dense that the pull of gravity close to it is so strong that nothing that falls in, not even light, can escape. For that reason, scientists had long assumed that a black hole could only ever take things in. In 1974, however, Hawking worked out that black holes should give off a faint glow of radiation, now known as Hawking radiation. This meant that a black hole slowly loses energy. Over an immense stretch of time, it could even fade away altogether.","The idea was so surprising that it changed how physicists thought about black holes. In the same year, Hawking was elected a Fellow of the Royal Society, a long-established society of scientists, and in 1979 he became Lucasian Professor of Mathematics at Cambridge, a position once held by Isaac Newton. In 1982 he was awarded a CBE, an honour given in Britain for outstanding achievement. Among the many other honours he received were the Copley Medal and the Albert Einstein Award.","Throughout these years, Hawking’s body grew weaker, and he came to use a wheelchair. Later he lost his own speaking voice, and he communicated through a computer that spoke on his behalf. At first he operated it with a handheld switch and, eventually, with a single cheek muscle. The voice it produced became instantly recognisable across the world. Yet none of this stopped him from working, and he stayed scientifically active for many years.","Hawking was not content for his ideas to stay within universities. In 1988 he published A Brief History of Time, a book that explained the universe to ordinary readers rather than to specialists. It became a surprise bestseller, remaining on the Sunday Times best-seller list for a record-breaking 237 weeks, and millions of copies were sold. Further books followed, among them The Universe in a Nutshell in 2001 and, four years later, A Briefer History of Time, which he wrote with Leonard Mlodinow.","In 2009 he received the Presidential Medal of Freedom, an honour given by the United States. Prizes, though, tell only part of the story. Hawking’s lasting importance lies in the questions he chose to ask, and in his willingness to share the answers with anyone curious enough to listen."]},{"id":"33-1","level":"Level F3","title":"Tallest in the Tent","paras":["Beneath the canvas of the village show tent, where the air hung thick with the smell of trampled grass and warm tea, the judge’s pen hovered above her clipboard for what felt like an hour. Outside, a brass band competed with the shrieks of children on the bouncy castle, but Imani could hear nothing except the relentless pounding of her own pulse.","Her sunflower stood at the end of the long table, tall and brazen, its enormous face angled towards the light as though it were fully aware of being watched. She had grown it from a seed scarcely larger than her thumbnail, and every morning since April she had watered it, measured it and murmured encouragement, while her little sister, unimpressed, had rolled her eyes and enquired whether it had answered back.","Beside it stood Dev’s entry. Dev lived three doors down and had walked to school beside her for as long as either of them could remember. His sunflower was slighter, its stalk bent in a diffident curve, its head drooping a little lower than seemed dignified. When the two of them had pushed their seeds into the soil in spring, they had made a pact: whoever lost would buy the other an ice cream. It had seemed a wonderfully small thing to wager.","“Tallest sunflower,” announced the judge, unfolding a tape measure with a flourish, and she held it against Dev’s stalk first, murmuring figures under her breath. Then she moved along to Imani’s, and Imani’s stomach lurched. Concealed beneath the cloth that skirted the pot was the upturned bucket she had balanced it on at seven o’clock that morning, to stop the pot from wobbling on the uneven ground. Until this very second, it had not occurred to her what the bucket would do to the measurement.","“Two hundred and forty-two centimetres,” read the judge. “Dev’s was two hundred and thirty-eight. We have a winner.”","She pinned a red rosette beside the pot and nodded, evidently satisfied. Around her, people applauded. Imani’s mother, near the entrance, was beaming so broadly that her cheeks must have ached. Dev clapped too, a fraction late, and his smile arrived slowly, as if it had been fetched from somewhere a very long way off.","Imani felt the silk ribbons of the rosette brush her wrist. It would be so easy, she reasoned. Nobody had lied, and nobody had cheated; the judge had measured precisely what she had been shown. And yet the bucket sat beneath its cloth like a stone in a shoe, a small, hard fact that every step would only make worse. She thought of the ice cream, of the three doors, of years of walking to school, and she understood that the prize was already costing her more than it was worth.","“Excuse me,” she heard herself say. Her voice sounded thin, as though it belonged to somebody else. The judge turned, eyebrows raised. Imani drew a breath, took a step towards the table, and reached for the corner of the cloth.","Behind her, the brass band launched into a march, bright and oblivious. Nobody seemed to notice that, inside the tent, the applause had died away."]},{"id":"33-2","level":"Level F3","title":"The Scruff on the Chart","paras":["In the summer of 1967, a young research student named Jocelyn Bell was working at Cambridge University on an unusual scientific instrument. It was a radio telescope, yet it bore no resemblance to the gleaming domes that most people imagine: it was a vast field of wooden posts, strung with miles of wire, which Bell and her fellow students had helped to construct by hammering in the posts and stretching out the cable by hand.","The telescope did not take photographs. Instead, it detected radio waves arriving from space, and a pen recorded them as a wavering line on a moving roll of paper. Every day the pen produced about thirty metres of chart, and somebody had to examine every centimetre of it. That responsibility fell to Bell, who worked through the endless paper with a ruler, a pencil and a formidable amount of patience.","A few weeks into the survey, she noticed something peculiar. Among the jagged lines lay a small, untidy mark, which she later described as “a bit of scruff”. Most observers would have dismissed it, since radio telescopes pick up all manner of interference and scruff was common. Bell, however, remembered having seen the same mark before, in exactly the same place, and she turned back through her earlier charts to confirm it.","This was puzzling. Interference from cars and machinery ordinarily followed the human day, but this mark appeared at the same point in the sky each time, keeping to the stars rather than the clock. Bell asked for the signal to be recorded at a much faster speed. When the new chart came back, the scruff had been stretched into a neat row of pulses, each arriving a little more than a second after the last.","No natural signal had ever been known to keep time like a clock. For a brief spell, the team wondered, only half seriously, whether they might be receiving a message, and they jokingly labelled the source LGM-1, short for “Little Green Men”. But when Bell discovered a second signal, then a third and a fourth, in different regions of the sky, the theory collapsed. It seemed absurd that several distant civilisations should all be “speaking” in precisely the same rhythm. The pulses had to come from something natural.","The sources became known as pulsars. A pulsar is a tiny, rapidly spinning star, left behind when a much larger star has exhausted its fuel and collapsed. As it spins, it emits a beam of radio waves, rather like a lamp turning on a stand, and each time the beam sweeps across the Earth, a telescope registers a pulse.","In 1974, a Nobel Prize was awarded for the discovery, but it went to Bell’s supervisor and a colleague, not to her. Many scientists thought this unfair, yet Bell responded with remarkable composure. Decades afterwards, when she received a large prize of her own, she donated all of the money to support students who are under-represented in physics.","Her story is frequently told to remind young scientists that discoveries do not always announce themselves with a bang. Sometimes they arrive as a smudge on a page, waiting patiently for the person willing to notice."]},{"id":"33-3","level":"Level F3","title":"The Stumble That Learned to Dance","paras":["In Bonwire, the mornings began with the sound of looms, a steady clack and thump that rolled from doorway to doorway like a drum passed along a street. Abena had grown up inside that rhythm and, much as with her own heartbeat, she had long since ceased to be aware of it.","Today she noticed everything, because her grandfather had stepped away from his loom and nodded towards the stool. “The final strip,” he said. Twenty-three narrow bands of cloth lay folded over the rail, each no wider than her hand and each patterned in gold, green and red; when the twenty-fourth was complete, they would be stitched edge to edge into a single cloth, made for a ceremony in the next town.","Abena sat, and as she pressed the pedals the threads rose and fell while the shuttle skipped between them with a soft whisper. For an hour all went well, until she glanced down at the pattern and her heart sank, for in her eagerness she had woven the zigzag one row too early, and it would now sit crooked against the strip beside it. The flaw was tiny, scarcely larger than a fingernail, but to her it glared like a drop of ink spilled across a clean white page.","She looked towards the doorway, where her grandfather was deep in conversation with a neighbour, his back turned. She could unpick the rows in secret, although that would take hours and the cloth was needed by Friday; alternatively, she could say nothing. “Nobody will notice one row,” she muttered, yet she remembered how her grandfather lifted each finished strip to the light and turned it slowly, as though he were reading it.","“Every strip has a name,” he had told her once. “The name is in the pattern, but the pattern is in the hands. Hurry, and the cloth remembers.” She had laughed at the time, since it had seemed a peculiar thing to say about cloth.","She was still staring at the fault when a shadow fell across the loom, and her grandfather bent close and studied the strip in a prolonged silence, until she could barely breathe.","“I am sorry,” she whispered. “I hurried.”","“Yes,” he said. “I can see where.” Then, to her astonishment, he smiled. “Do not unpick it. Look.” Taking the shuttle, he demonstrated how the following rows could climb from the stray zigzag, step by step, until the error became the first stair of an entirely new pattern. “In my father’s day we called this one ‘the stumble that learned to dance’. Some of the finest designs began as mistakes. But you must be brave enough to follow them.”","By evening the strip was finished, and the crooked little step sat at its centre, not concealed at all but woven into the design as though it had always been intended. On Friday the twenty-four strips were sewn together, and the cloth was carried away, gleaming like a river at sunset.","Nobody in the next town would ever discover which strip was Abena’s, but she would know, and so would her grandfather. And when the looms began again the following morning, clacking their old, patient rhythm, Abena found that she was listening."]},{"id":"33-4","level":"Level F3","title":"Rivers of Ice","paras":["Mountain valleys come in two distinct shapes. Those cut by rivers are narrow and steep-sided, with a cross-section like the letter V. Others, however, are broad and flat-bottomed, with towering walls that rise almost vertically on either side, forming a shape closer to a U. Geologists have long known that the U-shaped valleys were not made by water at all. They were carved by glaciers.","A glacier begins high in the mountains, in places where more snow falls in winter than melts in summer. Year after year, fresh snow buries the older layers, and the enormous weight squeezes the lower snow until it is compressed into dense, solid ice. Eventually the mass becomes so heavy that it starts to creep downhill under its own weight. Although a glacier looks motionless, it may travel anything from a few centimetres to several metres in a single day.","As the ice advances, it shapes the landscape in two main ways. The first is plucking. Meltwater seeps into cracks in the bedrock and freezes, gripping fragments of stone. When the glacier moves on, it drags these rocks away, rather as a tooth might be pulled from a jaw. The second is abrasion. Stones frozen into the base and sides of the glacier scrape against the rock beneath like sandpaper, grinding it smooth and leaving long scratches, known as striations, which point in the direction the ice was travelling.","A river winds around obstacles, cutting mainly downwards, which is why river valleys are narrow. A glacier, by contrast, is a single vast slab that cannot bend easily. It ploughs straight through, scouring the floor and the sides equally, and so it widens and deepens the valley into a smooth trough. When the ice finally melts, that trough is left behind.","The retreating ice leaves other clues. High on the mountainsides, the source of a glacier often carves a rounded, armchair-shaped hollow called a cirque, and where two neighbouring cirques cut back towards each other, only a thin, jagged ridge remains between them. Smaller glaciers that fed into the main one were less powerful, so their valleys were not cut as deeply. When the ice vanished, these side valleys were left hanging high above the main trough, and streams now tumble from them as waterfalls.","Glaciers also act as conveyor belts. The rubble they collect is carried along, then dumped when the ice melts, forming ridges and mounds of mixed clay, sand and boulders called moraines. Some huge boulders, known as erratics, are deposited far from the rock they came from, and geologists can sometimes trace them back to their origin.","Much of Britain was once covered by thick ice, and its mountain landscapes still bear the signs. Anyone who walks into a broad, steep-walled valley with a waterfall spilling from a ledge high above is, in effect, standing inside the footprint of a vanished river of ice."]},{"id":"33-5","level":"Level F3","title":"Miles of Stone","paras":["We began at Housesteads Roman Fort at nine o’clock, in a fine drizzle that could not decide whether it was rain or mist. My brother Kwesi had spent the entire car journey complaining that a wall was only a wall, while I had spent it reading aloud from the guidebook. Hadrian’s Wall, I had learned, stretches for about seventy-three miles across the north of England, from near Newcastle in the east to the shores of the Solway Firth in the west, and its construction began in AD 122 on the orders of the Emperor Hadrian.","“Seventy-three miles,” Kwesi had muttered. “By hand?”","“By soldiers,” I had replied. It was not much of an answer, but we were about to discover exactly how much it was worth.","Beyond the fort, the path climbed a grassy ridge, and there, quite suddenly, the wall was in front of us. It was not as tall as I had imagined; in places it rose no higher than my waist, and its grey stones were freckled with orange lichen. Yet it went on and on, rising and falling with the crags like the spine of some enormous sleeping animal, until the mist swallowed it. To the north, the ground fell away in a sheer cliff, and I could see why the builders had chosen this line, since any enemy would have had to climb the whole way in full view.","Roughly every mile, we passed the remains of a small square building set into the wall, with a gateway through its middle. These were milecastles, where soldiers once stood guard. The guidebook explained that our word “mile” derives from the Latin for a thousand paces, because Roman soldiers measured distance by counting their steps. When I read this out, Kwesi pretended not to be listening, although I noticed that he had begun to count his own.","By late morning the wind had scoured the mist away, and the whole country opened out below us: green hills, tiny farms, sheep dotted about like scattered rice, and a dark lake glittering beneath the crags. I knelt beside the wall and laid my palm against a stone. It was cold and rough, and it had been cut, shaped and hauled into place by somebody almost two thousand years ago, an effort that I found quite impossible to picture.","Kwesi had at last stopped complaining, and he was standing a little way off, hands buried in his pockets, gazing north across the desolate, empty land, apparently with nothing whatsoever to say.","“What would it have been like,” he asked at last, “to stand here and look at that, every day?”","I could not answer. I thought of all the soldiers who must have stood on this ridge, far from home, watching for something that might never come, and of the wind, which surely blew as hard for them as it did for us.","By the time we turned back, my feet ached and my hair was plastered flat with drizzle. But when I glanced behind me, the wall lay across the hills like a grey thread, stitched through the landscape by careful hands, and it seemed to me that it was no longer only a wall."]},{"id":"33-6","level":"Level F3","title":"After the Final Whistle","paras":["An hour after the final whistle, the stadium had surrendered its roar. The crowds, who had poured through the turnstiles in noisy tributaries, had drained away into the darkening streets, and what remained was a vast concave silence, as though the whole structure were holding its breath. Floodlights still burned on their tall masts, but they had been dimmed to a tired amber, and the pitch beneath them glowed an almost unnatural green.","In the stands, the emptiness felt strangely full. Thousands of plastic seats climbed away in curving terraces, their bright colours drained to grey by the fading light, and each one seemed to hold the memory of somebody who had leapt from it. Scarves had been left draped over railings, a single glove lay abandoned on a step, and a trodden programme fluttered along the concrete like a wounded bird. Everywhere the air smelled of cold chips, wet grass and spilled tea.","Down on the touchline, a small band of workers moved patiently through the litter. They wore orange jackets that glowed in the gloom, and they pushed wide brooms in slow, steady sweeps, gathering a drift of wrappers, paper cups and confetti into heaps. Their voices carried oddly in the cavernous space, rising to the roof and returning a moment late, so that every casual remark seemed to be spoken twice.","Beneath the stands, the players’ tunnel yawned like the mouth of a cave. Its walls were lined with faded photographs, and a puddle of muddy water had gathered at the foot of the steps, marking the place where, only an hour earlier, two teams had waited shoulder to shoulder for the signal to run out into the light. Nobody stood there now, although somewhere within, a door creaked as it swung slowly shut on its hinges.","The pitch itself bore the marks of the evening. Long scuffs curved across the penalty area where boots had skidded, and in the centre circle the turf was churned to bare brown earth. A groundskeeper knelt with a small fork, pressing the torn divots back into place, one at a time, as gently as if tucking a child into bed. By morning, the groundskeeper explained, the damage would be barely visible.","Above the far goal, the great scoreboard still showed the result, its white letters blazing on black. Nobody had thought to switch it off. It seemed to shine for an audience that had already gone home, insisting on a moment that was over.","Then, one by one, the floodlights were extinguished. Darkness poured down from the rim of the roof, swallowing the seats, the touchline and finally the pitch. For a heartbeat the scoreboard glowed alone, and then it, too, went out. All that remained was the distant hum of the city beyond the walls, and the quiet ticking of cooling metal as the stadium settled down to wait for the next time it would be needed."]},{"id":"33-7","level":"Level F3","title":"A Letter to Cambridge","paras":["Srinivasa Ramanujan was born on the 22nd of December 1887 in Erode, in southern India, but he grew up in the town of Kumbakonam, where his mother took him when he was one year old. In January 1898 he entered the Town High School there, and it was in that school that he came across a book that would shape the rest of his life.","The book was a Synopsis of elementary results in pure mathematics by G. S. Carr, and it was not a gentle textbook for beginners but a compact collection of theorems, formulae and short proofs. Ramanujan used it to teach himself, and he went on to make discoveries of his own, filling notebooks with results that eventually numbered nearly 3,900, a large proportion of them entirely new.","Ramanujan had no university education to support his work, and in 1912 he took a post as a clerk at the Madras Port Trust, which provided a steady wage while he continued with mathematics alongside his job. In January 1913 he did something bold: he wrote to G. H. Hardy, a well-known mathematician at Cambridge, enclosing a long list of theorems that he had not proved. In the letter he explained plainly that, although he had no university education, he had completed the ordinary school course.","Hardy studied the list together with a colleague, J. E. Littlewood. On the 8th of February 1913, Hardy replied. He explained that the results fell into three groups: some were already known, some were new but merely curious, and some appeared to be both new and important. It was clear that Ramanujan possessed a remarkable gift, and Hardy arranged for him to travel to England.","Ramanujan sailed from India on the 17th of March 1914 and arrived in London on the 14th of April. At the end of the month he moved into rooms at Trinity College, Cambridge. There he worked closely with Hardy and Littlewood, and in 1916 he received a degree of Bachelor of Arts by Research.","Two further honours followed in 1918. In May, he was elected a Fellow of the Royal Society, and in October he was elected a Fellow of Trinity College, the first Indian to be given that honour.","Hardy later recorded a well-known story about their friendship. He had arrived in a taxi numbered 1729 and remarked that it seemed a rather dull number. Ramanujan disagreed at once. It was, he said, the smallest number that can be written as the sum of two cubes in two different ways, since 1729 is both 1 cubed plus 12 cubed and 9 cubed plus 10 cubed.","Ramanujan’s notebooks were not forgotten. Mathematicians have continued to study the theorems they contain, and the pages that a clerk once wrote in southern India still yield ideas today."]},{"id":"34-1","level":"Level F4","title":"The Height Marks","paras":["On the last evening, the house had already begun to forget them, its rooms, stripped of rugs and pictures, returning every footstep as an echo. Pale rectangles on the walls marked the places where eleven years of family life had hung until that morning. Lena drifted from room to room with her hands buried in her pockets, like a visitor who had wandered in by mistake and was trying to decide whom she ought to apologise to.","In the hall, removal boxes stood stacked like a small cardboard town. Her father was wrapping the last of the glasses in newspaper, humming tunelessly, while her mother, telephone pressed to her ear, kept up the bright, brisk voice that she reserved for difficult days, saying “yes” and “no” and “we’ll manage”. Nobody noticed when Lena slipped upstairs.","The landing bulb had been packed away with everything else, so she climbed by the glow of the street lamp, which laid a long amber oblong across the floorboards. In her old bedroom she knelt beside the door frame, where pencil lines climbed the wood in uneven steps, each one labelled in her father’s slanting hand with a date and a name: “Lena, age 4”; “Lena, age 7, standing on tiptoe (disqualified)”. Together they rose like a slow, stubborn staircase, the newest sitting just above her shoulder.","Until tonight she had regarded them as a nuisance. Every birthday had brought the same ritual: the flattened book on her head, the pencil and the groan. Now, in the half-light, they seemed less like measurements than like a diary composed in a language that only the door could read.","“We can’t take the door,” said a voice behind her. Her father stood in the doorway with a glass still wrapped in newsprint, and although he spoke lightly, he did not quite meet her eye. “The new people will paint over it, I expect. That’s what people do.”","“I know,” said Lena, who did not add that painting over something seemed a curious way of announcing that it had never mattered. Her father crouched beside her, his knees clicking, and studied the lowest mark, the one barely a hand above the skirting board. “You were so small,” he murmured, and his voice snagged in the middle, like a sleeve catching on a nail.","Then he drew the pencil from behind his ear but, instead of adding a line, pressed the flat of his hand to the wood just above the highest mark and held it there, as though he were trying to warm it. “Let them paint,” he said gruffly. “It will have to go through a great deal of paint to get to that.”","Lena understood, without being able to explain how, that he was not really talking about the door. She laid her palm beside his; the wood was cool and slightly rough, and the two hands, one broad and one narrow, covered almost the same patch of shadow. Downstairs, her mother had stopped talking, and in the sudden hush the empty house seemed to be listening, so that for the first time all day it no longer sounded like a place that had forgotten anything."]},{"id":"34-2","level":"Level F4","title":"Give Us Back the Night","paras":["Step outside on a clear night in almost any town and look up. What greets you is not the sky our ancestors knew, a crowded, glittering river of stars that seemed to pour from one horizon to the other, but a dull orange-grey haze in which a few stubborn survivors are pinned. Scientists estimate that more than a third of the world’s population can no longer see the Milky Way from where they live. We have illuminated our streets so lavishly that we have, without ever quite intending to, switched off the heavens.","The consequences reach well beyond the loss of scenery. Living things have spent millions of years arranging their lives around the alternation of light and dark, and artificial glare throws that arrangement into confusion. Migrating birds, many of which travel at night and steer partly by the stars, can be lured off course by brightly lit buildings and may circle them until they are exhausted. Newly hatched sea turtles crawl towards the brightest horizon, which for countless generations meant the moonlit sea; beside a lit hotel, it can mean precisely the wrong direction. Even the humble moth, battering itself against a porch lamp, is squandering energy it needs to feed and find a mate.","Nor are people exempt. Our bodies interpret darkness as the signal to rest, and bedrooms flooded with light from outside may make it harder to sleep soundly. Then there is the matter of wonder. Generation after generation has gazed at the night sky and asked how vast the universe might be and where humanity fits within it, and a child who has never glimpsed the stars has been quietly denied the opportunity to ask.","Some will object that we cannot return to candles, and they are right, but nobody is proposing that we should. The difficulty is seldom too much lighting; it is careless lighting. A lamp that shines upwards, or sideways into a bedroom window, illuminates nothing that needs illuminating, whereas fittings that direct their beams downwards, towards the pavement, do the job and leave the sky alone. Warmer-coloured bulbs, reduced brightness after midnight and sensors that switch lights off when nobody is about are inexpensive, ordinary and effective, and they save money too, because energy that is not wasted need not be paid for.","Others fear that darker streets are less safe. Yet the evidence for this is weaker than most of us assume. What matters for safety is light that is well aimed rather than merely plentiful, and dazzling glare can in fact make it harder for our eyes to pick out what lies in the shadows.","Some places have already shown the way. Communities around the world have earned official recognition as dark-sky places by replacing their lamps and asking residents to switch off unnecessary lights, and visitors now travel long distances simply to lie on the grass and look up. If they can manage it, so can the rest of us. The stars have not gone anywhere; we have merely hidden them, and what we have hidden we are perfectly able to uncover. All that is required is the modest, sensible decision to light what we need and to leave the remainder to the night."]},{"id":"34-3","level":"Level F4","title":"Saturdays at Mr Iqbal’s","paras":["The summer I turned eleven, my dad, weary of finding me indoors with the curtains half drawn, arranged for me to spend my Saturdays at Mr Iqbal’s bookbinding workshop above the launderette on Fenner Street. I went reluctantly, picturing a dusty room and a dull old man, and I resolved to be bored with as much dignity as I could manage.","The workshop dismantled that resolution within minutes. It smelt of warm glue, leather and something sharp and green that I later discovered was paste, and every surface bore evidence of work in progress: presses with great iron screws, spools of waxed thread, and heaps of loose pages tied in bundles like sheaves of corn. Mr Iqbal himself was small and precise, with half-moon glasses and a habit of humming whenever he concentrated, and he regarded me not as a nuisance but as though I were a book whose binding he could not yet judge.","“Sit,” he said, handing me a battered paperback that had come apart at its spine. “Tell me what is wrong with it.” I said that the pages had fallen out. He waited. I said that the glue had failed. He waited longer. Eventually, by a process of elimination that felt like being slowly cornered, I noticed that the thread had rotted and that the cover had been forced to do a job it was never meant to do. “Good,” said Mr Iqbal, and that single word gave me more satisfaction than any prize I had ever been handed at school.","For weeks I did nothing but sew: needle through the fold, out, round and back, pulled tight, but never so tight that the paper puckered, and never so loose that the book would sag. My first attempts looked like something a cat had chewed. Mr Iqbal never criticised; he would simply cut my stitches with a little curved blade and say, “Again.” I came to dread that word, and then, without noticing the moment the change occurred, I began to hear it differently, less as a verdict than as an invitation.","In August, a woman brought in a family Bible whose spine was crumbling and whose pages had grown soft as cloth. Mr Iqbal let me hold it while he explained what he intended to do, and I noticed that he handled it the way one carries a brimming cup. “It is not our job to make it look new,” he said. “It is our job to make it able to go on.” I have pondered that sentence more often than any lesson I was ever formally taught.","On the last Saturday of the holidays, he presented me with a small notebook bound in dark blue cloth, its stitches so even that I hardly recognised them as mine until I spotted the tiny crooked knot at the base of the spine. “I left your knot in,” he said, “so that you will always know who made it.” I never told him that I had meant to thank him all summer, and that when the moment arrived the words simply would not bind. Yet I have kept that notebook for over thirty years, and it has never once come apart."]},{"id":"34-4","level":"Level F4","title":"How a Seed Knows When to Sprout","paras":["A seed is a plant waiting for its moment. Inside its hard outer coat lies a tiny embryo, packed with just enough stored food to begin growing, and it is in a state scientists call dormancy: alive, but almost entirely inactive. Dormancy is not laziness. It is a survival strategy, because a seed that sprouts at the wrong time, on a warm afternoon in midwinter, for instance, would be killed by the next frost. So how does a seed know when the time is right?","The first signal is nearly always water. A dry seed contains very little moisture, and until it takes some in, its chemistry cannot get going. When rain soaks the soil, the seed swells as it absorbs water, and its coat may crack. The moisture wakes up chemicals, called enzymes, that begin to turn stored food into energy. However, water alone is not enough. Most seeds also need oxygen, because they release energy from food in a process similar to breathing, and a suitable temperature, which is why seeds planted in cold ground often sit quietly until spring.","Many species add extra conditions to make certain. Some seeds from cold regions will not sprout until they have spent several weeks in the cold, and so they are protected from germinating during a mild spell in autumn. Some seeds have coats so tough that they must be worn thin, by rubbing against stones, by soaking, or by passing through the digestive system of a bird, before water can get in. Tiny seeds, which hold little food, often need light, a sign that they lie near enough to the surface for their first leaves to reach the sun. In parts of the world where wildfires are common, certain seeds wait for the chemicals in smoke.","Once every condition is met, the seed acts fast. The first part to emerge is the root, which anchors the seedling and starts to draw water from the soil. Next, a shoot pushes upwards, bending towards the light. Until its leaves open and begin making food from sunlight, the young plant survives entirely on the supplies that the seed provided.","This careful timing matters because a seed has only one chance. Sprouting is a gamble: a seed that commits too early risks frost or drought, while one that waits too long may be shaded out by neighbours that are already growing. Seeds therefore behave like cautious investors, spending their single store of energy only when the odds look favourable.","Some seeds can wait for astonishingly long. A date palm seed found in an ancient fortress in Israel was about two thousand years old when scientists planted it, and it sprouted. Not every seed is so patient, and many die if their conditions are never right, but this remarkable ability to pause, and then to respond at precisely the right instant, is one reason plants have spread to almost every corner of the planet."]},{"id":"34-5","level":"Level F4","title":"Platform Four, Before Dawn","paras":["At half past four, the station belongs to no one. The great iron roof, blackened by a century of steam and smoke, arches overhead like the ribs of some enormous sleeping creature, and beneath it the platforms stretch away into a darkness that the tired lamps do little more than dent. Every sound is magnified: a dropped coin rings like a bell, and when a distant door slams, the echo takes a long time to die.","The air is cold and faintly metallic, tasting of rails and rain. A pigeon shuffles along a girder, ruffling itself into a small grey cushion, and far below it a cleaner in a yellow jacket pushes a wide broom in slow, unhurried arcs, gathering up the remains of yesterday: ticket stubs, sweet wrappers, a single glove. He hums as he works, and the tune, stripped of its words by distance, could belong to any country.","Gradually, the platform acquires its people, one at a time, like ink spreading in water. A woman in a suit that looks slept in stands with her eyes closed, clutching a briefcase against her chest as if it were a shield, while on a bench nearby a girl with a cello case almost as tall as herself watches the departure board with the solemn patience of the very young, her feet not quite touching the ground. An elderly couple share a flask, passing the cup between them without a word, in the manner of people who said all the important things many years ago.","Then the board flickers. Letters shuffle, rattle and settle, and every head lifts at once, like a field of flowers turning to a change in the light. Somewhere beyond the buffers the rails begin to sing, a thin, rising note that swells until it fills the whole cavernous space, and two round lamps swim out of the gloom as the train arrives slowly, exhaling clouds of white breath, its windows glowing like a row of small, warm rooms.","Doors clunk open. The woman with the briefcase steps aboard first, without a backward glance. The girl hauls her cello after her, with help from the cleaner, who lifts it as gently as a sleeping child and receives a solemn nod in return. The old couple linger at the door, she tucking the flask into his bag, he straightening her collar although it does not need it, and then they, too, are gone, and the train, after a pause that feels a little too long, gathers itself and slides away.","The lamps seem brighter when it has gone. The pigeon hops down to inspect the glove. Along the eastern end of the platform the darkness has thinned to the colour of weak tea, and the first pale light slants beneath the roof, gilding the dust that hangs in the air, while the cleaner leans on his broom and watches the empty rails shine, as if they were still holding something."]},{"id":"34-6","level":"Level F4","title":"Ada and the Thinking Machine","paras":["In 1815, in London, a baby girl called Augusta Ada Byron was born. Her father was Lord Byron, a famous poet, but he left England when Ada was only a few months old, and she hardly knew him. Her mother, Annabella, who brought her up, wanted Ada’s education to be very different from her father’s, so Ada learned logic, mathematics and science, and not only poetry.","Ada had private tutors, and she was good with numbers and even better with ideas. As a child, she wrote about a machine that could carry a person through the air, and she studied how birds’ bodies were made in order to work out how wings might be built. She never built the machine, but the idea shows how her mind worked. To Ada, something that looked impossible was a puzzle to solve, not a wall to stop at.","When she was seventeen, Ada met Charles Babbage, a mathematician and inventor who was designing machines to do sums. His first design, called the Difference Engine, was meant to make tables of numbers without mistakes, because tables copied out by hand were often full of errors. Later he planned something much more daring, the Analytical Engine, which could be given a list of instructions and follow them, so that it could be used for many kinds of problem, not just one. Ada was fascinated, and the two became friends and wrote to each other for many years.","In 1842, an Italian engineer named Luigi Menabrea wrote an article in French about the Analytical Engine. Ada was asked to translate it into English, but she did much more than that, adding notes of her own that grew to about three times the length of the article. In them she showed, step by step, how the engine could be told to work out a list of numbers. Many people today call this the first computer program, although the machine was never finished, so the program was never run.","Ada’s best idea was not about sums at all, because she saw that the engine might work with symbols as well as numbers. If the rules of music could be written down using symbols, she said, the machine might one day make music of its own. At that time, people thought of such machines as clever adding tools, so this was a huge leap. She also took care to point out that the machine could only do what people told it to do and could not think up anything new by itself. People still talk about this warning today.","Ada’s notes were printed in 1843 with only her initials, A.A.L., on them. For many years afterwards, they were largely overlooked. Then, in the twentieth century, real computers were built, and people found out how much Ada had seen ahead of her time. Today a computer language is named after her, and every October there is a day to celebrate her work. She was not a builder of machines; she was something rarer: a person who saw, before the machines existed, what they might become."]},{"id":"34-7","level":"Level F4","title":"Planting an Idea","paras":["When a landscape loses its trees, the effects reach further than most people expect, and few have demonstrated this more convincingly than Wangari Maathai. Her work makes a persuasive case that one of the most effective ways of repairing a damaged place is also among the simplest: to plant trees, and to trust ordinary people to plant them.","Maathai was born on the 1st of April 1940 near Nyeri, in Kenya. She studied biology at Mount St. Scholastica College in Kansas in the United States, then gained a master’s degree from the University of Pittsburgh. In 1971 she earned a doctorate from the University of Nairobi, becoming the first woman in East and Central Africa to do so.","Back in Kenya, Maathai noticed that the land was changing: forests had been cleared, soil was being washed away, streams were drying up and firewood was becoming harder to find, while food supplies were growing less reliable. Her response was practical rather than dramatic, and in 1977 she founded the Green Belt Movement, which encouraged women to grow seedlings of native trees and plant them in their own communities.","The argument for this approach rests on what trees actually do. Their roots hold soil in place, so that rain is less likely to carry it away; they provide firewood and food; and they help to protect the water on which people depend. A tree is therefore not a decoration but a working part of the land, and planting one meets several needs at once.","Equally important was the way in which the trees were planted. The women who took part were given modest payment, and many were trained in skills such as forestry, food processing and bee-keeping, which helped them to earn a living. This mattered because a tree that is cared for by the person who depends on it is far more likely to survive than one planted and forgotten. Over 30,000 women have been trained in this way.","Some people might say that a few seedlings can never make a difference to a whole country. The results suggest otherwise. What began with a small nursery grew into a movement that has planted more than 51 million trees since 1977. Progress on that scale was built one seedling at a time, by people who each did a small job well.","In 2004, Maathai was awarded the Nobel Peace Prize, and she was the first African woman to receive it. She was also the first environmentalist to be honoured in this way. The Nobel committee praised her contribution to sustainable development, democracy and peace.","The lesson is plain. Large problems do not always need large machines or large budgets; sometimes they need a good idea, a supply of seedlings and people who are trusted to get on with the work."]},{"id":"34-8","level":"Level F4","title":"Learning the Law","paras":["Nelson Mandela was born on the 18th of July 1918 in the village of Mvezo, in the Eastern Cape region of South Africa. At his primary school in Qunu, his teacher gave him the English name Nelson, in accordance with the custom of giving all schoolchildren an English name in those days. It was a small event, yet it marked the start of a long journey through education that would eventually lead him into the law.","After primary school he continued his studies at Clarkebury Boarding Institute and then at Healdtown, a secondary school, before going on to the University of Fort Hare. He completed a Bachelor of Arts degree through the University of South Africa in 1943, studying by correspondence, which meant that lessons and assignments travelled by post. Then he began to study law at the University of the Witwatersrand in Johannesburg.","Mandela was determined to use his training to help others. At that time, the law in South Africa treated people unfairly according to the colour of their skin, and many people who needed a lawyer found it hard to be heard. In 1952, Mandela and his friend Oliver Tambo opened a law firm in Johannesburg. It was the first firm in the country to be run by Black partners, and it began in just two small rooms in a building called Chancellor House, in an area of Johannesburg named Ferreirasdorp. The building was later restored and reopened in 2011 as a museum and archive.","Word spread quickly, and the office was soon crowded with clients who were seeking help with unfair treatment. Tambo dealt with most of the paperwork, while Mandela spoke on behalf of clients in the magistrates’ courts. Their work showed how the skills of a lawyer, such as careful reading, clear speaking and patience, could be used to give people a voice.","Mandela later spent 27 years in prison, and he was released on the 11th of February 1990.","After his release, he took part in talks about how South Africa should be governed, and in 1993 he shared the Nobel Peace Prize with F. W. de Klerk. In April 1994 the country held its first election in which people of all races could take part. Mandela’s party won, and on the 10th of May 1994, at the Union Buildings in Pretoria, where thousands of people had gathered, he was inaugurated as president. He became the first Black president of South Africa.","As president, Mandela served until 1999, and he declined to stand for a second term. His story shows how a boy who was given a new name at school, and who studied patiently by post, went on to hold the highest office in his country and to receive more than 250 honours."]}]};
const NAMES = {fluency: 'Reading fluency', phonics: 'Phonics comprehension', comprehension: 'Comprehension'};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const q = new URLSearchParams(location.search), A = q.get('a') || '', ID = q.get('id') || '';
const T = TEXTS[A] && TEXTS[A].find(t => t.id === ID);
const reader = document.getElementById('reader'), body = reader.querySelector('.body'), inner = reader.querySelector('.inner');
let MIN = 20, MAX = 48;
// Largest font size between MIN and MAX at which everything fits on the screen with no scrolling (as the teacher
// tools' "Show on screen"); a long text that will not fit at MIN scrolls instead.
function fit(){
  if (reader.hidden) return;
  let lo = MIN, hi = MAX;
  inner.style.fontSize = hi + 'px';
  if (body.scrollHeight <= body.clientHeight) return;
  while (hi - lo > 1){ const mid = (lo + hi) >> 1; inner.style.fontSize = mid + 'px'; if (body.scrollHeight <= body.clientHeight) lo = mid; else hi = mid; }
  inner.style.fontSize = lo + 'px';
}
if (T){
  if (A === 'phonics'){ MIN = 22; MAX = 64; }
  document.title = T.title;
  inner.innerHTML = '<h1>' + esc(T.title) + '</h1>'
    + (T.images && T.images.length ? '<div class="pics">' + T.images.map(s => '<img src="' + esc(s) + '" alt="">').join('') + '</div>' : '')
    + '<div class="text">' + T.paras.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>';
  reader.hidden = false;
  fit();
  inner.querySelectorAll('img').forEach(i => { if (!i.complete) i.addEventListener('load', fit, {once: true}); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 250));
} else {
  // Opened without a code (or an old one): the list of every text, for the adult to pick from
  const p = document.getElementById('pick');
  let h = '<h1 style="text-align:left">Reading texts</h1>'
    + ((A || ID) ? '<p class="msg">That text was not found. Choose it below, or scan the code on the laptop again.</p>' : '<p>Scan the code on the teacher\'s laptop, or choose a text.</p>');
  Object.keys(NAMES).forEach(a => {
    h += '<h2>' + NAMES[a] + '</h2>';
    let last = null;
    (TEXTS[a] || []).forEach(t => {
      if (t.level !== last){ h += '<div class="lvl">' + esc(t.level) + '</div>'; last = t.level; }
      h += '<a class="tx" href="?a=' + encodeURIComponent(a) + '&id=' + encodeURIComponent(t.id) + '">' + esc(t.title) + '</a>';
    });
  });
  p.innerHTML = h; p.hidden = false;
}
</script>
