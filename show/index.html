hen the wind blows at the right speed. On a calm day they produce very little, so the valley would still need other sources of power to keep the lights on. Opponents say this shows that turbines cannot be the whole answer. They believe the money might be better spent on other ideas, such as covering roofs with solar panels.","In conclusion, the wind farm would help to reduce pollution and bring money to the village. However, it would change the landscape, and it may bother some of the people who live nearby. Each person has to weigh up how much they value cleaner energy against the beauty and quiet of the hills. Whatever the outcome, everyone in the valley deserves the chance to have their say."]},{"id":"27-5","level":"Level 27","title":"The Discovery of Penicillin","paras":["In the summer of 1928, a Scottish scientist named Alexander Fleming packed a bag and went on holiday. He worked in a laboratory at St Mary’s Hospital in London, where he was studying germs called bacteria. Before he left, he had spread bacteria onto several small glass dishes so they could grow, and he left the dishes stacked on his workbench.","When Fleming came back in September, he began to sort through the dishes. Most of them looked as he expected, but one caught his eye. A fuzzy patch of blue-green mould had grown on it. Moulds are common, and a scientist might easily have thrown the dish away. Fleming, however, looked closer and noticed something odd. All around the mould, the bacteria had disappeared. The dish was clear in a small ring, while the rest of it was cloudy with bacteria.","“That is strange,” he is said to have murmured. He guessed that the mould must be making a substance that killed the bacteria. He carefully grew more of the mould, which turned out to be a kind called Penicillium, and found that a liquid taken from it could stop many harmful bacteria from growing. He named the liquid penicillin.","Fleming knew that his discovery might be important, because bacteria cause many illnesses, some of which doctors could do little to treat at that time. He was careful, too, to test his liquid on many different kinds of bacteria, so that he could tell which ones it stopped. In 1929, he wrote about it in a science journal. Still, making penicillin was difficult. Fleming could grow only a tiny amount of the liquid, and it was not pure enough to be used as medicine. He tried to interest other scientists, but for years little happened.","In the late 1930s, a group of scientists at Oxford University, led by Howard Florey and Ernst Chain, read Fleming’s work with interest. They decided to try to make penicillin in larger amounts. It took long hours in the laboratory, and they had to work out how to purify the liquid so it would be safe. Slowly, they succeeded.","By the 1940s, factories were producing penicillin, and doctors began to use it to treat people with serious infections. It was the first widely used antibiotic, a group of medicines that fight bacteria. In 1945, Fleming, Florey and Chain shared a famous prize for their work.","Alexander Fleming’s story shows how important it is to notice small things. A dish that others might have thrown away led to a medicine that has helped millions of people. Fleming had the patience to look twice, and the Oxford team had the determination to turn a curious mould into a cure."]},{"id":"27-6","level":"Level 27","title":"The Arctic Tern: Champion Traveller","paras":["The Arctic tern is a slim seabird, weighing about as much as a bar of chocolate. It has a black cap, a bright red beak, and long, forked tail feathers that flutter like ribbons. Yet this small bird makes the longest journey of any animal on Earth.","In the northern summer, Arctic terns nest in the far north, in places such as Greenland, Iceland and northern Britain. When the northern autumn approaches, the days shorten and the fish become harder to find. The terns then fly all the way south to the seas around Antarctica, which are just entering their summer. In the spring, they fly back again. Some birds travel more than seventy thousand kilometres in a single year, which is well over one and a half times the distance around the Earth.","Because they move from one summer to the next, Arctic terns see more daylight than any other creature. They do not fly in a straight line. Instead, they take a winding path that lets them use the winds to help them, and they save energy by gliding. Birds tracked with tiny devices strapped to their legs have shown that they often zigzag across the ocean instead of flying in a straight line.","The terns are excellent fishers. They hover above the water, watching for small fish, and then plunge headfirst to grab them. Before they set off on their journey south, they must eat plenty of fish to store energy. During the journey, they rest on the sea or catch food while flying.","The terns are noisy and defiant nesters. They make shallow scrapes on open ground, usually on beaches or on rocky islands. Each pair lays one to three eggs, and both parents take turns keeping them warm. If any intruder wanders near, the terns will swoop down and peck it on the head. This behaviour is very effective at protecting the chicks, and even large animals are driven off, and human visitors are wise to wear hats.","Young terns learn to fly about three weeks after hatching. Until then, the parents bring them small fish, carrying each one carefully in the beak and dropping it beside the chick. They then follow their parents south on their first big journey. An Arctic tern can live for about thirty years, and over its lifetime, it may fly a distance equal to several trips to the Moon and back.","Scientists are keen to keep learning about these travellers. Small tracking devices are now so light that a bird can carry one without noticing. This is important, because changes in the sea and in the weather may affect where fish are found. If the fish move, the terns will need to find them. Protecting nesting places and keeping the oceans healthy will help these remarkable birds to keep making their long journeys for many years to come."]},{"id":"27-7","level":"Level 27","title":"Nurse, Traveller and Business Owner","paras":["Mary Seacole was born in 1805 in Kingston, a busy port city in Jamaica. Her father was a Scottish soldier, and her mother was a healer who used herbs and traditional remedies to help people who were unwell. Her mother also ran a boarding house, which was a kind of small hotel where visitors paid to stay. Mary grew up watching and helping, and she soon became skilled at looking after the guests and at caring for anyone who needed a hand.","Mary was curious about the world and keen to see more of it. When she was young, she visited England, and later she travelled to islands such as the Bahamas, Haiti and Cuba. On these journeys she bought spices, pickles and jams to sell back in Jamaica, which showed that she had a real talent for business. In 1851 she travelled to Panama, in Central America, where she helped to run a restaurant and gave out medicines to people who asked for them.","By 1855, soldiers from Britain were staying in the Crimea, a region beside the Black Sea and a very long way from home. Mary wanted to help them. She went to London and offered to work as a nurse, but her offer was turned down. Mary did not give up. She paid for her own journey and sailed to the Crimea with a man named Thomas Day.","Near the town of Balaclava, Mary and Thomas opened a place called the British Hotel. It was not a hotel in the usual sense. It was a hut made of metal sheets, and it worked as a storehouse, a canteen and a resting place all in one. Soldiers could rest there and buy hot food, drinks and supplies. Mary also went out to care for soldiers who were ill or wounded. They were so fond of her that they called her “Mother Seacole”.","When she returned to Britain, Mary wrote the story of her life. Her book, Wonderful Adventures of Mrs Seacole in Many Lands, was published in 1857 and became a best seller, so many people read about her adventures. An autobiography is a life story written by the person who lived it, and this one is often described as the first written in Britain by a Black woman. For many years afterwards, however, her name was not widely remembered.","Today, Mary Seacole is celebrated again. In 2004, she was voted the greatest Black Briton in a national poll. In 2016, a statue of her was unveiled in the gardens of St Thomas’ Hospital in London, a place where people are cared for every day. She is remembered as a traveller, a business owner and a carer with the courage to keep going when others said no. In 2007, her story was added to the national curriculum in England."]},{"id":"28-1","level":"Level 28","title":"The Lantern Stairs","paras":["When Mika stepped off the sky-ferry, she discovered two things about Hollowmere that nobody had thought to mention. The first was that the town hung from the underside of a floating rock, its crooked houses dangling downwards like icicles. The second was that the stairs hummed, so that every step trembled faintly beneath her boots, as though the entire island were purring.","“You will grow accustomed to it,” said a tall man who was waiting at the landing, wearing a long coat fastened with brass buttons and carrying a pole tipped with a hook. “I am Mr Adeyemi, Keeper of the Lantern Stairs, and you must be my new apprentice.” Mika nodded, unable to speak; she had dreamed of this position for three weeks, and now that it had finally arrived, her mouth had turned as dry as chalk.","There were nine hundred lanterns in Hollowmere, and by tradition every one of them was lit by hand at the appearance of the first star. Mr Adeyemi passed her a small glass jar in which a single glow-moth fluttered, its wings flickering like a candle flame. “Hold the jar to the wick and ask the lantern to wake,” he explained. “Nothing more is required.” “Ask it?” said Mika. “Politely,” he replied, with the faintest twinkle.","She climbed to the first lantern and did precisely as she had been instructed, but nothing happened. She tried again, more loudly. By the tenth lantern her cheeks were burning; although she had a steady hand and had learned the lamplighting rhyme by heart, the lanterns stubbornly refused to obey her. Behind her, Mr Adeyemi said nothing at all, which was somehow far worse than any scolding could have been.","As dusk deepened, neighbours lingered on their doorsteps. Mika sank onto a step and rested her chin on her knees, and it was then that she noticed a small creature, no bigger than a teapot, huddled in the corner of the landing. Its fur was the silver-grey of rain clouds, and it was trembling. Forgetting her embarrassment, she broke her bread roll in half and held out a piece, murmuring as gently as she would to a nervous kitten. The creature sniffed, nibbled, and then crept into her lap, where it began to hum in exactly the same note as the stairs.","Something warm brushed her fingers. The nearest lantern had begun to glow, and one after another, all the way up the winding staircase, the rest bloomed into life like a slow tide of gold rising towards the sky. Mr Adeyemi stepped out of the shadows. “Lanterns have never listened to orders, and they care nothing for rhymes,” he said. “They wake only for someone who is calm and kind, and I could not be certain that you possessed that gift.” “Why didn’t you tell me?” asked Mika. “Had I done so, you would merely have pretended,” he said.","Mika looked down at the creature, which had fallen asleep with its nose tucked beneath its tail. “What shall I call him?” she whispered. “A stair-sprite chooses its own name,” said Mr Adeyemi, “but I rather suspect that he has already chosen you.”"]},{"id":"28-2","level":"Level 28","title":"How a Compass Works","paras":["Explorers, sailors and hikers have all trusted a small tool that always points the same way, even in thick fog. It is called a compass, and it works because of magnetism. To understand how it works, it helps to know a few facts about magnets.","Every magnet has two ends, called poles. One is the north pole and the other is the south pole. If you bring the north pole of one magnet close to the south pole of another, they pull together. This pull is called attraction. If you bring two north poles close together, they push apart instead. This is called repulsion, and it happens with two south poles as well. Magnets attract only certain materials, such as iron, nickel and cobalt. Wood, plastic and glass are not affected at all, however strong the magnet may be.","Earth itself behaves like an enormous magnet. Deep inside our planet, a vast region of hot, liquid metal swirls around a solid centre. Scientists believe that this movement creates a magnetic field, an invisible force that surrounds the whole Earth and stretches far out into space. The field runs between two places close to the North Pole and the South Pole.","A compass takes advantage of this field. Inside it is a thin needle that is itself a small magnet. The needle is balanced on a tiny pin so that it can spin freely, and one end is usually painted red. When you hold the compass still, Earth’s magnetic field pulls on the needle until the red end swings round and points towards the north. Once you know where north is, you can work out which way is south, east and west as well.","The first compasses were made in China, using lodestone, a rock that is a natural magnet. Later designs used a magnetised needle floating in a bowl of water. Over many centuries, the compass improved, and it helped sailors to cross oceans that had never been mapped. Even with no land in sight, a captain could check which way the ship was heading.","A compass is not perfect, however. Its needle can be fooled by anything with a strong magnetic pull nearby, such as another magnet or a large piece of iron. A hiker who kept a compass next to a heavy metal tool could easily end up walking in the wrong direction. Also, a compass points to magnetic north, which is close to, but not exactly at, the true North Pole. Careful travellers know about this and allow for it.","Even so, the compass remains a trusted tool. It needs no batteries and no signal, and it works in mist, in darkness and in places where nothing else can help. For a device so small and simple, that is a remarkable achievement indeed."]},{"id":"28-3","level":"Level 28","title":"The Grandad Decision","paras":["The letter from school arrived on Monday morning, and Marcus read it three times before he could believe it. He had been selected for the chess team that would compete in the county final on Saturday. For two years he had practised on the bus, at lunchtime and beneath his bedcovers with a torch, and at last all that quiet determination had been noticed.","Then Dad came in from the kitchen, drying his hands on a tea towel. “Don’t forget Saturday, Marcus. It’s Grandad’s eightieth birthday, and we’re all meeting at the restaurant at twelve o’clock; Auntie Grace is even travelling up from Cornwall for it.” Marcus’s stomach lurched with dismay. The final began at ten o’clock and might well continue until after one o’clock, so there was no possible way of attending both.","That night he lay awake, staring at the ceiling. Mrs Okafor, his teacher, had told him that the team could not manage without him, for there were only five players and he was the strongest of them. Yet Grandad was the person who had first taught him to play, on a wobbly board where two missing pawns had been replaced by buttons. Every Sunday afternoon they had sat at the kitchen table while the kettle whistled, and Grandad had never once allowed him to win.","On Tuesday he tried to banish the problem from his mind, and on Wednesday he tried again. Then he compiled a list. In one column he wrote his reasons for playing: the trophy, the team, the chance to prove himself. In the other he wrote a single word: Grandad. He studied the two columns for a long while. One was long and one was short, and yet, oddly, the short one seemed to weigh far more.","On Thursday he went to Mrs Okafor’s classroom, his palms sticky. “I can’t play on Saturday,” he blurted. “It’s my grandad’s birthday.” She was silent for a moment, and Marcus braced himself. “I am disappointed, and I won’t pretend otherwise,” she said at last. “But I would think less of you if you had chosen differently. We shall ask Jin to take your place; he has been progressing steadily all term.” Relief and sadness swirled together inside Marcus like paint in water.","At the restaurant on Saturday, Grandad’s face crinkled into a smile when Marcus walked in, then slowly into a frown. “Shouldn’t you be at the tournament?” he asked. “I swapped with someone,” said Marcus, handing over a small parcel. Grandad shook his head. “You gave up your final for an old man’s lunch?” “It isn’t just lunch,” said Marcus. “You taught me everything I know.” Grandad cleared his throat and studied the tablecloth. When at last he spoke, his voice was gruff. “Best present I’ve ever had,” he said, “and I haven’t even opened it.”","At half past two, a message buzzed on Mum’s phone: the team had finished third, and Jin had won his final game. Marcus read it twice and smiled, surprised to find that it did not feel like losing. Grandad, meanwhile, had already set up a small travelling chess set beside the birthday cake. “Now,” he said, with a twinkle, “shall we discover whether you have improved?”"]},{"id":"28-4","level":"Level 28","title":"The Smiling Axolotl","paras":["Deep beneath the surface of a cool, murky lake, an odd creature glides past the reeds. It has a wide, flat head, tiny black eyes and a mouth that seems to curl into a permanent smile. Feathery frills sprout from each side of its head like a pink or red crown. This is an axolotl, a kind of salamander, and it is one of the most unusual animals on Earth.","Axolotls come from the lakes and canals of Xochimilco, near Mexico City. A fully grown axolotl is usually about twenty to thirty centimetres long, and its skin is soft and smooth, with no scales or fur. Its tail is long and flat, like a fin, which helps it to swim. It has four short legs with tiny, delicate toes, but it spends most of its time gliding through the water rather than walking.","Most amphibians change dramatically as they grow. A young frog, for example, loses its gills, develops lungs and hops out onto dry land. The axolotl is different. It keeps its gills and its tail fin, and it remains in the water for its whole life. Scientists say that it never completely grows up, although it is able to breed like an adult. The feathery frills on its head are its gills, and they take oxygen from the water.","Axolotls are skilful hunters. They live in dim, cloudy water where it is hard to see, so they depend on smell and on sensing movement rather than on their eyesight. When a worm, a small fish or a snail drifts close by, the axolotl senses it, opens its mouth wide and sucks the prey in whole, together with a gulp of water.","The axolotl’s most astonishing talent is regrowth. If it loses a leg or part of its tail, its body can grow a new one, complete with bones, muscles and nerves, and it can even repair parts of its heart. A human being cannot do this. Scientists around the world study axolotls in the hope that their secrets might one day help to heal human injuries.","In the wild, most axolotls are dark brown or olive, speckled with gold, which helps them to hide among the mud and plants. Some that are bred in laboratories and homes are pale pink or white, with bright red gills. With good care, an axolotl can live for more than ten years. A female can lay hundreds of eggs at a time, which she attaches to underwater plants.","Sadly, wild axolotls are now extremely rare. The lakes where they live have shrunk, and the water has been polluted by the growing city nearby. Many people are working hard to clean the canals and to create safe places where axolotls can live and breed. Meanwhile, thousands of axolotls are cared for in tanks around the world, so this smiling salamander is not forgotten."]},{"id":"28-5","level":"Level 28","title":"The Glass Workshop","paras":["The workshop door was so heavy that Uncle Femi had to lean his whole weight against it, and when it finally swung open, a wave of heat rolled over me as though someone had pressed a hot palm against my face. Inside, the room was dim except for a round furnace at its centre, which glowed a fierce, dazzling orange and roared with a deep, steady sound like a lion purring in its sleep. Somewhere in the gloom a radio was playing, though I could hardly hear it above the noise.","“Stay behind the yellow line, Leila,” said Uncle Femi, pulling on a pair of thick leather gloves. Shelves lined every wall, crowded with glass animals, twisted bottles and jugs in the colours of sea and sunset, and wherever the light from the furnace touched them, they shimmered as though they were alive. The air smelt of hot metal and something sweet, like burnt sugar.","He lowered a long steel pipe into the furnace, twirled it slowly like a spoon in a jar of honey, and lifted out a blob of molten glass that sagged and stretched, so luminous that I had to squint. Uncle Femi never stopped turning the pipe, not even for a moment. “If I stop, it will droop and fall,” he said. “Glass is patient, but it isn’t kind.”","He rolled the blob through a tray of crushed blue glass until it glittered like frost, then raised the pipe to his lips and blew. I held my breath as the glass swelled into a bubble, as delicate as a soap bubble yet glowing like a small sun. He pressed a wad of wet newspaper against it to coax it into shape, and the paper hissed and puffed out clouds of steam. His hands, which looked so rough and clumsy at home, moved with the sure, steady precision of a surgeon.","Next, he took a pair of long tweezers and pinched the bubble to make a neck, then tugged out a thin curl for a tail, and slowly a bird emerged, with a small round body, a lifted head and a tail that swept like a feather. Every few moments he returned it to a smaller furnace, which he called the glory hole, to keep it pliable; the name made me smile. He worked without hurrying and without speaking, as composed as a cat watching a window.","At last he tapped the bird gently from the pipe and set it inside a long oven. “It has to cool slowly, overnight,” he explained, “because if it cools too quickly, it will crack.” Through the little window I watched the bird glow dull red, then orange, then fade to a deep, clear blue, with a single tiny bubble trapped in its chest like a heart.","The workshop grew quiet. Sweat trickled down Uncle Femi’s face, and he wiped it away with his sleeve and grinned. “Come back in the morning,” he said. “It’s yours.” The glass animals on the shelves seemed to watch me leave, their eyes glinting in the firelight, and I could hardly sleep that night for wondering what the morning would bring."]},{"id":"28-6","level":"Level 28","title":"The First Flight","paras":["On the morning of the 17th of December 1903, a small group of people stood on a windswept beach near Kitty Hawk, North Carolina, in the United States. A cold wind was blowing hard across the sand. In front of them stood an odd-looking machine made of spruce wood and cloth, with two long wings, one above the other. It had been built by two brothers, Wilbur and Orville Wright, and they hoped it would carry a person through the air.","The brothers were not soldiers or famous scientists. They ran a bicycle shop in Dayton, Ohio. They had been fascinated by flight ever since they were boys, and they had spent years studying how birds twist their wings to turn. They built kites and gliders, tested many wing shapes in a wooden wind tunnel that they made themselves, and even designed their own lightweight engine, because no company could supply one that was suitable.","They chose Kitty Hawk because it had strong, steady winds and soft sand to land on. The beach was also far from any town, so they could work without being disturbed. Three days earlier, they had tried to fly, but the machine, which they called the Flyer, had failed to rise properly and needed repairs. Now it was ready again, and this time it was Orville’s turn to pilot.","At about half past ten, Orville lay flat on the lower wing, next to the engine, and released the wire that held the machine back. The Flyer rolled along a wooden rail, lifted off, wobbled, and rose into the air. It flew for only twelve seconds and covered about thirty-seven metres. Yet it was the first time in history that a machine carrying a person had taken off by its own power, flown steadily and landed safely.","Three more flights followed that morning, and each was better than the one before. Every time, the machine rose a little further and stayed up a little longer before settling gently back onto the sand. The brothers took turns, and Wilbur made the fourth and final flight. It lasted fifty-nine seconds and covered about two hundred and sixty metres. The small group on the beach had just watched history being made.","The celebrations did not last long. While the men were talking, a sudden gust of wind caught the parked Flyer, tumbled it across the sand and damaged it badly. It never flew again. But that hardly mattered. The brothers had shown that people could fly, and they soon sent a telegram home to tell their family the news. Within a few years, they were building aeroplanes that could stay in the air for over half an hour.","Today the original Flyer is displayed in a museum in Washington, D.C. Visitors can gaze at its wooden frame and its cloth wings and wonder how such a fragile machine changed the world."]},{"id":"28-7","level":"Level 28","title":"The Doctor Who Went to Space","paras":["On the 12th of September 1992, the space shuttle Endeavour roared away from its launch pad carrying seven astronauts. Among them was Dr Mae Jemison, who became the first African American woman to travel into space. Her journey to that launch had begun many years earlier.","Mae was born in Alabama in 1956 and moved to Chicago as a young child. Her parents encouraged her to be curious, and she spent hours reading library books and visiting museums. She loved science and worked hard at school. At the age of sixteen, she started university at Stanford, where she studied chemical engineering, which is the use of chemistry and machines to make useful things, alongside African American studies. She then trained as a doctor at Cornell University, qualifying in 1981.","Being a doctor took Mae far from home. She joined the Peace Corps, an American organisation that sends volunteers overseas to help local communities. For around two years, she worked as a medical officer in Sierra Leone and Liberia, two countries in West Africa, helping to look after the health of the people who worked there.","When Mae returned home, she still had a dream of travelling into space. She applied to NASA, the American space agency, and she was one of only fifteen people chosen from about two thousand applicants. After that came years of training, because astronauts must learn how to work safely in a spacecraft and how to cope with life without gravity.","On Endeavour, Mae’s job was to be a mission specialist, someone who carries out the scientific work on board. The shuttle circled the Earth for nearly eight days, and the seven crew members took part in more than forty experiments. The shuttle carried a science laboratory in its cargo area, where much of the work took place. Mae helped with studies that showed how living things behave without gravity. One looked at how bone cells change in space. Another looked at how frog eggs grow and develop far above the ground. She also worked on ways of helping astronauts who feel dizzy and unwell when they first arrive in space. The test subjects included the crew themselves, as well as fish, fruit flies and frogs.","After she left NASA in 1993, Mae kept working to help others learn. She taught at Dartmouth College, and in 1994 she started The Earth We Share, a science camp that welcomed young people from different countries. She also took charge of a project called 100 Year Starship, which explores how people might one day travel to other stars.","Since then, she has given many talks about science and space. Mae Jemison’s story shows how curiosity, hard work and an early love of learning can carry a person a very long way, even beyond the sky."]},{"id":"29-1","level":"Level 29","title":"Painting the Sky","paras":["Rainbows seem like magic. One moment there is nothing but grey rain, and the next, a vast arch of colour glows against the dark clouds. Yet there is nothing magical about it. A rainbow is the result of sunlight meeting water, and the explanation begins with a surprising fact: the sunlight that looks white is actually a blend of many colours.","The scientist Isaac Newton proved this more than three hundred years ago. He shone a narrow beam of sunlight through a triangular block of glass called a prism. On the other side, the white light spread out into a band of colours: red, orange, yellow, green, blue, indigo and violet.","The glass separates the colours because light changes direction slightly when it passes from one substance into another, such as from air into glass. This bending is known as refraction. Each colour bends by a different amount. Red light bends the least and violet light bends the most, so the colours fan out from one another instead of staying together.","A raindrop can behave like a tiny prism. When sunlight enters a drop, it bends and begins to split into its colours. The light then travels to the back of the drop, where it bounces off the inside surface, rather like light bouncing off a curved mirror. This is called reflection. Finally, the light leaves through the front of the drop, bending a second time as it passes back into the air, which spreads the colours even further apart.","Millions of raindrops do this at the same moment. Every drop sends all its colours off in different directions, but your eye can catch only one colour from each drop, depending on the angle at which the light arrives. Light from higher drops reaches you as red, while light from lower drops reaches you as violet. That is why red is always on the outer edge of a rainbow and violet on the inner edge.","To see a rainbow, you need both sun and rain, with the sun behind you and the falling rain in front. If the sun climbs too high in the sky, the rainbow sinks below the horizon and vanishes from view. This explains why rainbows are usually seen in the early morning or late afternoon, when the sun is low.","Although we call them arches, rainbows are really complete circles. The ground simply gets in the way and hides the lower part. Passengers in aeroplanes, who look down on the rain from above, sometimes see the whole glowing circle.","Finally, a rainbow is not an object sitting in one place. Two people standing side by side each see their own slightly different rainbow, made by different raindrops. In a sense, every rainbow belongs to just one pair of eyes."]},{"id":"29-2","level":"Level 29","title":"The Slow River","paras":["Yaw dug his paddle into the water as though he were trying to leave the river behind him. In the middle of the canoe, his sister Efua sat with a map spread across her knees, humming quietly to herself, while ahead the river slid between banks of bending willows, brown and glossy as melted chocolate. They had been travelling since dawn, and Yaw had been counting the minutes ever since.","“Steady, Yaw,” called Aunt Yaa from the stern, where she steered. She was a river ranger who had spent months planning this three-day trip, and she knew every bend of the water. “We aren’t racing anyone.” “But we’re supposed to reach the lake by evening,” Yaw protested. “We shall get there when we get there,” said his aunt, and he could hear from her voice that she was smiling. The morning mist had long since lifted, and the water glittered in the sunshine.","Yaw did not answer. For the next hour he paddled harder than ever, jaw set, ignoring the blisters that stung his palms and the ache that crept across his shoulders. Spray splashed his face, and twice the canoe scraped against a hidden stone, but he was so intent on speed that he failed to notice the hush settling over the water until Efua laid a hand on his shoulder. “Yaw. Stop paddling. Look.”","He turned, scowling. On a branch that overhung the water, barely an arm’s length away, perched a small bird with a back the colour of a summer sky and a chest like a glowing ember. A kingfisher. It regarded them with perfect composure, quite unafraid, and then it plunged, a flash of blue, and rose again with a silver fish glittering in its beak.","Yaw’s mouth fell open. He would have swept straight past it. All morning, he realised, he had been so preoccupied with getting somewhere that he had never once noticed where he was. Now that the canoe drifted, the river came alive around him: dragonflies hovered like tiny helicopters, a heron stood as motionless as a statue in the shallows, and the reeds whispered and rustled with hidden things.","“The river keeps its secrets,” said Aunt Yaa, resting her paddle across her knees, “for those who travel slowly enough to discover them.” Efua raised an eyebrow. “You knew he would rush.” “Everyone rushes at first,” said Aunt Yaa. “I did. Some lessons are worth far more when you find them out for yourself.” Yaw felt his ears grow hot, but he found, to his surprise, that he was grinning.","They reached the lake long after sunset, when the sky had turned the colour of plums and the first stars were pricking through the darkness. Yaw did not mind in the slightest. He sat on the shore with a torch and his notebook, in which he had drawn, for the very first time, a kingfisher, and beneath it, in careful letters, he wrote: Arrived late. Worth it."]},{"id":"29-3","level":"Level 29","title":"Room for Everyone","paras":["Somewhere in your town there is a building where anyone can walk in, borrow almost anything they like and walk out again without paying a penny. It is not a shop, and it has no tills or advertisements. It is a library, and I firmly believe that it is one of the most valuable places a community can possess. Information is now available on every phone, so some people wonder whether libraries are still necessary. I intend to show that they are.","First, a library gives everybody an equal chance to read. Books are expensive, and a family that must count every pound cannot always afford a shelf of them. A library removes that barrier entirely. A child who borrows an adventure story on Saturday has exactly the same choice as a child whose parents buy new books every week. Studies have often found that pupils who read for pleasure tend to do better in school across all subjects, not simply in English.","Second, libraries offer far more than books. Many lend newspapers, audiobooks, films and computers, and most run clubs, workshops and story sessions for people of every age. Some provide a quiet desk for a student who has no space to study at home, and others help elderly visitors to send their first email. A library is, in short, a shared classroom that welcomes every newcomer.","Third, libraries are staffed by people who know how to find things out. A librarian can guide a reluctant reader towards a book that suddenly makes reading enjoyable, or show a researcher how to judge whether a website can be trusted. On the internet, anybody may publish anything, and the truth is often buried beneath rumour. Skilled guidance in sorting reliable facts from careless claims is more useful now than ever.","Fourth, a library is a place where people meet. Neighbours who might never otherwise speak sit at adjoining tables, and a shy child may make a first friend over a shared love of dragons. We spend more and more time alone with our screens. A welcoming public space that asks nothing in return is therefore rare, and it strengthens the bonds that hold a community together.","Some people object that libraries cost taxpayers money and that everything can be found online. It is true that running a library is not free. However, the cost is small when it is shared among everyone. The return is enormous, because each book may be borrowed dozens of times. Moreover, not every household has a reliable internet connection, and a screen cannot recommend a book or greet a visitor with a smile.","In conclusion, a library offers fairness, learning, trustworthy guidance and friendship, all beneath a single roof. If we allow such places to fade away, we will lose something that is hard to rebuild. Surely a community that values its children should protect the one building that opens its doors to every one of them? Let us use our libraries, defend them and, above all, keep them busy."]},{"id":"29-4","level":"Level 29","title":"The Lemon Battery","paras":["By half past eight on the morning of the Science Fair, my hands were already trembling. I stood behind my table in the school hall, surrounded by cardboard rockets and wobbling papier-mâché planets, staring at my project, which bore a title that I had copied out in my best handwriting: “Can Fruit Make Electricity?” I had spent two weeks preparing it, and I was quite convinced that it was brilliant.","The idea was simple. I had pushed a zinc-coated nail and a strip of copper into each of four lemons, then joined them in a chain with crocodile clips and wires. The juice inside a lemon is acidic, and when it touches two different metals, it produces a tiny electric current; four lemons together, I had read, should generate enough to light a small LED bulb. At home the experiment had worked perfectly, and my little brother had cheered so loudly that the dog next door began to bark.","But at ten o’clock, with the judges due at any minute, I connected the final wire and … nothing. The bulb stayed dark. I checked every clip, squeezed each lemon and even whispered encouragement. My best friend, Declan, wandered over from the next table and peered doubtfully at my display. “Maybe they’re not ripe,” he suggested. “It’s not about ripeness, Declan,” I hissed. “It’s the acid that matters.”","Panic turned my fingers icy. The judges had already reached the table two along, where a boy was demonstrating a robot arm made from cardboard, when Mr Brennan, my teacher, strolled past and glanced at my display, at the dark bulb and at my face. “Problem?” he asked. I explained everything in one long breath. He did not touch a single wire. “Electricity is a bit like some people, Ines,” he said thoughtfully. “It can be very particular about which way round it likes to go.” And off he wandered, whistling.","I stared at the bulb. Then, slowly, a fact from my research surfaced from the back of my mind: an LED has two legs, and current will flow through it in one direction only. The evening before, when I had packed up my display, I must have disconnected the bulb and later replaced it the wrong way round. With shaking fingers I unclipped it and swapped its legs over, and it burst into a bright, steady glow. I gasped so loudly that Declan dropped his pencil case.","The judges arrived a minute later, and this time I explained everything calmly: the metals, the acid, the chain of lemons and the LED. When one of them asked what I had learned, I told her the truth. “That a project not working is only a problem until you find out why.” She smiled and wrote something on her clipboard.","I did not win; first prize went to Aisha, whose fan was powered by the sun. But before I left, Mr Brennan pinned a certificate to my display that read Best Problem Solver. As I carried my lemons home in a carrier bag, I decided that, in some ways, it was even better."]},{"id":"29-5","level":"Level 29","title":"Thunder on the Moor","paras":["All afternoon the moor had lain beneath a heavy, breathless heat, its heather faded to the dull purple of an old bruise. Not a breath of wind stirred the bracken. Skylarks that had sung since morning fell silent one by one, and even the sheep, scattered like grey pebbles across the slope, huddled together beside the crumbling wall. From the doorway of the old stone barn, where Dad and I had stopped to shelter, I watched the horizon turn from blue to slate.","The clouds arrived slowly, piling upon one another like dark mountains and swallowing the sun in a single, silent gulp. Their edges glowed a sickly yellow, and beneath them the light thinned to a strange green-grey that turned every rock and gorse bush flat and colourless. The air smelt of hot dust and something metallic, as if the whole sky were a coin held against the tongue.","Then, without warning, the first gust swept across the heather, and the whole hillside shivered. Grass flattened in long, rippling waves. A carrier bag, snatched from nowhere, tumbled past the barn and vanished over the wall. The temperature dropped so suddenly that I pulled my sleeves down over my hands, and a low, grumbling rumble rolled across the valley, like furniture being dragged across a distant floor.","A fork of lightning split the horizon, so vivid that for an instant every stone and stalk stood out in sharp white detail, printed on my eyes long after the light had gone. I began to count, as Dad had taught me: one, two, three, four, five. The thunder cracked, so loud that I felt it in my ribs, and then it rolled away, muttering, into the hills. “Five seconds,” said Dad quietly. “About a mile off. It’s still coming.”","The rain followed at once. It began with a few heavy drops that struck the dry earth and raised little puffs of dust, then thickened into a roaring curtain that hid the far hills completely. Water hammered on the barn roof, ran in silver ropes from the slates and swelled the ruts of the track into brown, chattering streams. The smell of wet earth and crushed heather rose all around us, rich and sweet, and I breathed it in until my chest ached.","For a quarter of an hour the storm circled the moor as though it had lost something and was searching for it. Lightning flickered, thunder muttered, and the sheep bleated in protest. Then, gradually, the gaps between flash and rumble stretched longer, the rain softened to a whisper, and the great clouds began to slide eastwards, trailing grey veils behind them.","A last shaft of sunlight broke through and lit the wet heather so that it blazed with purple fire, and every blade of grass was strung with drops, like beads of glass. Somewhere above us a skylark tried one uncertain note, then another, and at last poured out its song. “Come on,” said Dad, smiling and shaking the water from his hair. “Let’s see what the moor looks like now.”"]},{"id":"29-6","level":"Level 29","title":"A Penny for a Letter","paras":["Today, sending a letter is simple and cheap. Nearly two hundred years ago, though, letters were the only way to send news over long distances, and the post was so costly that many families could hardly afford to use it. Before 1840, the price of a letter depended on how far it travelled and on how many sheets of paper it contained. Even worse, it was usually the person receiving the letter who had to pay, not the person who sent it.","This system caused all kinds of trouble. Poor families sometimes could not afford to collect the letters that had been sent to them. Some people invented clever tricks to avoid paying. They marked secret signs on the outside of the envelope, so that the person it was meant for could read the message without ever opening it, and then politely refuse to accept the letter.","A social reformer named Rowland Hill, who had once been a schoolteacher, believed that this had to change. In 1837, he published a pamphlet arguing for a simple new system. Every ordinary letter, he suggested, should cost just one penny to send anywhere in Britain, however far it went. And the sender, not the receiver, should pay in advance, by sticking a small label on the envelope.","Not everybody liked the idea. Many officials in the Post Office were convinced that a cheaper service would lose money. Ordinary people, however, were enthusiastic. Merchants, newspapers and thousands of families signed petitions in support of the plan, and in 1839 Parliament agreed to try it out.","On the 1st of May 1840, the first adhesive postage stamp in the world went on sale. It was printed in black ink and showed a small portrait of the young Queen Victoria, so it became known as the Penny Black. It could officially be used from the 6th of May. The stamps had no perforated edges, so clerks and customers had to cut them apart from the sheet with scissors. Each stamp cost one penny, and a sheet held two hundred and forty of them, the same number of pennies as there were in a pound.","The change was dramatic. Within a year, the number of letters posted in Britain had more than doubled, and it kept on rising for years afterwards. Families could write to relatives who had moved far away, and businesses could send bills and orders cheaply. People began to send cards, invitations and news that they might never have posted before. Post offices were soon busier than ever. Within a few years, other countries had copied the idea.","The Penny Post made it easier than ever for ordinary people to keep in touch. Nearly two centuries later, stamps are still used all over the world, and it all began with a small black square showing a young queen."]},{"id":"29-7","level":"Level 29","title":"A Licence Earned in France","paras":["Bessie Coleman was born in Texas on the 26th of January 1892 and grew up in a busy, hard-working family of thirteen children. In 1915, she moved to Chicago, a big city in the north of the United States, to look for better opportunities. There she lived with two of her brothers and worked as a manicurist, which means someone who looks after people’s hands and nails.","Chicago was a busy city full of new ideas, and before long Bessie had a big one of her own. One of her brothers had spent time in France, and he told her that women there were learning to fly aeroplanes. Bessie was determined to become a pilot too.","There was a problem, however. At that time, no flying school in the United States would accept her, because she was Black and because she was a woman. Bessie did not give up. It was a hard thing to hear, but she looked for another way. Robert Abbott, who published a newspaper called the Chicago Defender, suggested that she try France instead. So Bessie began to learn French and saved money from her work to pay for the journey.","In November 1920, Bessie sailed from New York across the Atlantic Ocean to France. She joined the Caudron Brothers’ School of Aviation in Le Crotoy, a small town by the sea. There she began the long task of learning to fly. Her training aeroplane was a biplane, which has two wings, one above the other, and it was steered with a tall stick and a bar worked by the pilot’s feet. Learning all this in a new country, in a language she had only recently learned, took courage and hard work.","On the 15th of June 1921, Bessie’s efforts paid off. An international organisation called the Fédération Aéronautique Internationale gave her a pilot’s licence, which is an official document saying that a person is allowed to fly. The organisation keeps the official rules and records for flying around the world. She had earned it in about seven months, and she had become the first African American woman to earn a pilot’s licence.","After almost a year away, Bessie returned to New York in September 1921, where Black and white newspaper reporters were waiting to greet her. She was eager to share her new skill, so she began giving flying displays in which she performed loops and figure eights high above the crowds. Reporters wrote about her, and large audiences came to watch.","Bessie also had firm beliefs about who should be allowed to see her shows. She refused to take part in any event that kept Black people out. She also hoped to open a flying school of her own, where other people could learn to fly."]},{"id":"30-1","level":"Level 30","title":"The Last Bus","paras":["Nadia checked her watch for the third time in as many minutes. The bus shelter was empty except for a crumpled newspaper that skittered across the pavement whenever the wind gusted. Above her, the streetlight flickered and buzzed like a trapped insect. The air smelt of wet stone, as if it might rain at any moment. It was almost half past nine, and the last bus to Wickford was already late.","She tugged her coat tighter around her shoulders and glanced anxiously at the small suitcase that rested against her feet. Inside, wrapped carefully in tissue paper, was the birthday present she had spent three months saving for: a silver locket, engraved with her grandmother’s initials. Nadia had rehearsed her words all week, yet now they seemed to have deserted her.","At last, headlights swept around the corner and the bus wheezed to a halt. The doors folded open with a hiss. The driver, a stocky woman with cropped grey hair, drummed her fingers on the steering wheel and peered at her over her glasses. “Where to, love?” she asked. “Wickford, please,” Nadia replied, her voice barely above a whisper.","She found a seat by the window and pressed her forehead against the cool glass, watching her own faint reflection drift across the darkened shop fronts. Street lamps blurred into streaks of amber as the bus rumbled through the sleeping town. The only other passengers, a sleepy man and a woman with a guitar case, barely looked up. Nadia thought about the locket again. She had washed cars, walked the neighbours’ dogs and sold her old books to save enough money. Her dad had warned her that the journey would be long and lonely, but Nadia had insisted. Nothing, she had decided, was going to spoil this surprise, however long or lonely the journey might be.","Halfway through the journey, the woman leaned across the aisle. “Visiting family?” she asked, not unkindly. Nadia hesitated, unsure how much to reveal to a stranger. “My grandmother,” she said at last. “It’s her seventieth birthday tomorrow, and she thinks I’m at home revising for my exams.” The woman chuckled. “Then you’re in for a treat, love, and so is she.”","The bus shuddered to a stop in Wickford, and Nadia stepped down into the cold night air. The village lay silent except for the distant, mournful hoot of an owl. She hauled her suitcase along a lane fringed with dripping hedges. Her feet ached, and the suitcase seemed heavier with every step. At last the cottage appeared, a single lamp glowing in its window like a beacon.","Nadia hesitated at the gate. What if her grandmother was already asleep? What if she was cross at being disturbed so late? Then the front door swung open, and there, silhouetted against the lamplight, stood her grandmother in her dressing gown, peering out into the darkness. “Nadia?” she whispered. “Is that really you?” Her voice trembled, and in the lamplight Nadia could see that her eyes were shining.","All the words Nadia had rehearsed so carefully evaporated once more, but this time it did not matter. She dropped her suitcase and ran. Behind them, the lamplight spilled across the path, warm and golden."]},{"id":"30-2","level":"Level 30","title":"The Secret Gardener","paras":["Throughout June, Zara had studied the derelict plot behind Elm Court from her bedroom window, though she would never have admitted to being curious. For as long as she could remember it had been a wilderness of nettles and corroded wheelbarrow parts, and its guardian, the caretaker Mr Hendry, defended it with a ferocity out of all proportion to its worth. “Keep out,” he would growl whenever a football strayed over the fence. “That ground isn’t for children, and it isn’t for anybody.”","It was therefore a considerable surprise when, one Saturday, she noticed a row of green shoots pushing through the soil beside the shed. The nettles had been cut back, and someone had dug a neat trench and set bean canes into it, lashed together at the top like a small wigwam. By Sunday the earth was dark and damp, although not a drop of rain had fallen, and on Monday a scarecrow, fashioned from a broom and a moth-eaten cardigan, presided over the end of the row.","“Somebody’s been busy,” said her friend Tobi, peering through a gap in the fence. “Perhaps it’s a secret society.” “Or a ghost with a watering can,” Zara replied, only half joking. What troubled her was not who was responsible but why anyone would labour so carefully in secret, as if being seen might spoil something.","On Tuesday she set her alarm, packed a torch and a flask of squash, and settled behind the recycling bins. At half past five the sky was the colour of dishwater and even the pigeons had not yet begun to complain. Zara crouched with aching knees, watching the plot, while the only movement came from a snail crossing the path with enormous dignity.","She was on the point of abandoning her vigil when a door clicked and footsteps crunched across the gravel. A stooped figure in a flat cap rounded the corner of the flats, a full watering can in each hand. He set them down, knelt with a small grunt and began to loosen the soil around the beans with his bare fingers, as tenderly as if he were smoothing a child’s hair.","It was Mr Hendry. The man who bellowed at footballs was humming quietly to himself. Then Zara shifted her weight, a bin lid clanged, and he spun round, his face folding back into its habitual scowl. “You,” he said. “What possible reason have you for being out here at this hour?”","Zara stood up slowly. “I was looking for the gardener,” she said. “I think I’ve found him.”","For a moment neither of them spoke. Then the old man exhaled, and his shoulders slackened. “My wife’s at her sister’s until August,” he said gruffly. “She has grown beans on this plot every summer for forty years, but this spring her knees refused. I want it looking right when she comes home. Not a word to anyone.”","Zara grinned. “Can I help?” Mr Hendry regarded her for a long moment, then held out one of the watering cans. “Mind the shoots,” he said. “And next time your football comes over, knock first.”"]},{"id":"30-3","level":"Level 30","title":"Meerkats: Life in the Mob","paras":["Meerkats are slender, sociable mammals that inhabit the arid grasslands and semi-deserts of southern Africa. An adult weighs less than a kilogram and stands barely as tall as a school ruler, yet it is a remarkably resourceful animal. It is best known for its habit of rearing up on its hind legs, balanced by its tail like a tripod, to survey the landscape.","Meerkats live in cooperative groups called mobs, which typically number between twenty and fifty individuals. Each member contributes to the survival of the mob. Together they dig a large network of burrows with many entrances. These shelter them from the fierce midday heat and offer refuge whenever danger threatens. Because the food around a burrow eventually runs short, a mob may occupy several burrows in turn. After the chill of the desert night, its members gather outside each morning, warming their thinly furred bellies in the sun.","Since eagles, hawks, jackals and snakes all prey on meerkats, the mob cannot afford to forage carelessly. While most members search for food, one or more act as sentries, climbing onto a rock, a termite mound or a low bush to scan the sky and the ground. The dark patches of fur around a sentry’s eyes reduce the glare of the sun, rather like sunglasses. Sentries take turns, so that no individual goes hungry for long.","When a sentry detects a threat, it gives an alarm call, and the calls are far from identical. A sharp, urgent bark signals a bird of prey overhead, and the entire mob dives for cover at once. A lower, more drawn-out call indicates a predator on the ground, in which case the meerkats may gather to watch the intruder before withdrawing. Researchers have established that mob members respond differently to each type of call, which suggests that the sounds carry precise information. They are not simply cries of fear.","Foraging occupies most of the day. Meerkats possess an acute sense of smell and sharp hearing, allowing them to locate prey that other animals overlook. Their diet consists chiefly of insects, spiders and small lizards, although they also eat scorpions. Using long, curved claws, they scratch at the sand and dig out prey concealed beneath the surface. Adults also instruct their young: they bring pups scorpions whose stings have been removed, and with repeated practice the youngsters learn to handle live prey safely.","Newborn pups, whose eyes are shut at birth, remain in the burrow for their first three weeks. While the parents are away foraging, other members of the mob take turns as babysitters. A babysitter guards the pups throughout the day and frequently forgoes breakfast in the process. Even meerkats that are not the pups’ parents share this responsibility.","Life in the desert is unforgiving, yet meerkats endure it through cooperation. Sentries keep watch, babysitters protect the young and adults teach the pups, so the survival of the mob depends on every member playing a part."]},{"id":"30-4","level":"Level 30","title":"The Substitute","paras":["When Mr Abernathy-Clough marched into Class 5B on Monday morning, clutching a briefcase the size of a small suitcase and wearing a tie speckled with tiny penguins, twenty-eight children held their breath. Miss Baker had lost her voice, and all weekend a rumour had been racing along the corridor: substitute teachers could be tricked.","“It’s foolproof,” Dev had assured them in the cloakroom. “He doesn’t know any of us, so if we swap names, he’ll never get the register right.” Nobody had thought to ask what would happen if the scheme went wrong. Dev’s plans generally combined a great deal of enthusiasm with very little forethought.","“Good morning, Class 5B,” boomed Mr Abernathy-Clough, peering at the register through enormous spectacles. “When I read your name, please answer ‘present’. Amira Hussain?”","There was a pause. Then Felix, who was sitting at the front, raised his hand. “Present,” he squeaked, in what he believed was a convincing impression of Amira. Several children snorted into their sleeves.","Mr Abernathy-Clough blinked once, made a note and carried on. “Felix Reid?” At the back of the room, Amira lifted a hand and growled, “Present, sir,” as gruffly as she could manage, which sounded like a frog with a head cold. Tobias had to bury his whole face in his lunchbox.","The rest of the register was a triumph, or so it seemed. Rosa answered to “Dev”, Dev answered to “Rosa”, and Ellis, who was exceptionally tall, answered to “Little Sam”, an achievement that very nearly ended in helpless giggling. Throughout, Mr Abernathy-Clough nodded gravely, as though children exchanged identities every day of the week.","“Splendid,” he said at last, closing the register with a snap. “A full house. Now, Rosa, would you kindly distribute the books?” Dev leapt up and dashed round the room, delighted. “And Little Sam,” the teacher added, “please open the window. It has become rather warm in here.” Ellis, who had to duck beneath the light, obeyed.","All morning the substitute treated them precisely as they had asked. He praised “Amira’s” beautiful handwriting, which was really Felix’s. He invited “Amira” to read aloud, and Felix, who could not manage a sentence without stumbling, was obliged to trip his way through a page about Roman roads. By break time, the class was no longer certain who was fooling whom.","At lunchtime, Mr Abernathy-Clough tapped a folded sheet of paper on the desk. “I ought to confess,” he said, “that Miss Baker left me a seating plan. It has photographs.” The silence was so complete that they could hear the penguin tie rustling. “I have known exactly who you are since five to nine. However, I have not enjoyed a register so much in thirty years, and I would be sorry to have spoiled it.” He smiled. “Now, would the real Dev kindly tie his shoelaces before he trips over them?”"]},{"id":"30-5","level":"Level 30","title":"Raising the Iron Tower","paras":["On the 31st of March 1889, a small procession of officials began to climb the stairs of a tower that had not existed two years earlier. At its head was Gustave Eiffel, the engineer whose company had built it, and the climb was long and slow. At the summit, high above the rooftops of Paris, he raised the French flag. The tallest structure in the world was finished. More than two years of work had come to an end.","The tower had been designed for the World’s Fair of 1889, an enormous exhibition held in Paris to show off amazing new inventions from around the world. The organisers wanted a spectacular entrance to the fairground, and a competition was held to find one. A plan for a tower of iron, taller than anything ever built, was prepared by engineers working for Eiffel’s company, and it was chosen. Work began in January 1887. Nobody knew whether such a tall tower of iron would stand firm, and many people watched the site with doubt.","Building the tower was less like ordinary construction than like assembling a gigantic puzzle. Nearly all of the pieces were made in Eiffel’s factory on the edge of Paris, where each one was cut and drilled with great accuracy. The tower needed about eighteen thousand separate iron parts, and every one had to fit its neighbours exactly. Carts then carried them to the site, where around three hundred workers joined them together with about two and a half million rivets.","The four enormous legs rose first, held steady by temporary scaffolding until a platform could join them at the first level. Once that was in place, the tower climbed faster, with cranes lifting each section into position. Many of the workers laboured at heights that would have unnerved most people, yet the whole project took just over two years, and it was ready in time for the opening of the fair. Visitors could now climb to the platforms and look out across the whole city.","Not everyone admired the result. Soon after work began, a group of well-known artists and writers published a letter protesting against what they called a useless and monstrous tower that would disfigure the city. Eiffel replied calmly and did not change his plans. He argued that the tower would have a beauty of its own, because its shape had been governed by the need to withstand the wind.","At about three hundred metres, the tower held the record as the tallest structure in the world until 1930. Its permit allowed it to stand for only twenty years, and it might have been taken down in 1909. But Eiffel had encouraged scientists to carry out experiments there, and its height made it ideal for a radio aerial. The tower proved so useful that the city let it stay, and it has since become the most recognisable landmark in France."]},{"id":"30-6","level":"Level 30","title":"How a Vacuum Flask Works","paras":["A hot chocolate poured from a vacuum flask on a winter walk can still be steaming hours after it was made, and on a summer day the same flask can keep a drink pleasantly icy. This apparent feat of magic depends entirely on the way the flask is constructed and on the way heat behaves.","Heat always moves from a warmer place to a cooler one, and it does so by three distinct routes. In conduction, heat is passed through solid materials from particle to particle, which is why the handle of a metal spoon soon warms up in a hot mug. In convection, heat is carried by moving liquids or gases, as when warm air rises above a radiator. In radiation, heat travels as invisible rays, which is how the Sun’s warmth reaches us across empty space.","A vacuum flask is engineered to obstruct all three. It is essentially two containers, one nested inside the other and joined only at the neck. Almost all of the air has been pumped out of the gap between the inner and outer walls, leaving a vacuum: a space containing next to nothing. Since conduction and convection both depend on particles to pass heat along or carry it away, they are very nearly ruled out, and the two most important routes for heat to escape are blocked.","Radiation remains, because heat rays are able to cross empty space. To combat it, the surfaces facing the vacuum are coated with a thin, shiny layer, much like the silver on a mirror. This coating reflects the rays back towards the drink rather than allowing them to pass through, so a hot drink keeps its warmth. By the same principle, the coating turns heat from the outside away from a cold drink, which therefore stays cool.","The weakest point is the top, where heat could escape through the opening. A flask therefore has a tightly fitting stopper made of plastic or cork. These materials are poor conductors, and the stopper also traps the air above the drink, restricting convection. Every time the flask is opened, some heat is lost, so it is sensible to keep the lid on for as long as possible.","The vacuum flask was invented in 1892 by a Scottish scientist named James Dewar, who had no thought of picnics. He needed a means of storing extremely cold liquids for his experiments. Within a few years, others realised that the same design could keep drinks hot, and the idea spread around the world.","Even the finest flask cannot keep a drink hot indefinitely, because a little heat always escapes through the stopper and the neck. Nevertheless, by defeating every route that heat can take, the flask keeps hot things hot and cold things cold for many hours."]},{"id":"30-7","level":"Level 30","title":"The Girl Who Checked the Numbers","paras":["Katherine Johnson was born on the 26th of August 1918 in White Sulphur Springs, a small town in West Virginia, in the United States. From a very young age she loved numbers, and she never stopped counting. “I counted everything,” she remembered later. “I counted the steps to the road, the steps up to church, the number of dishes and silverware I washed …”","In June 1953, Katherine began work at a research laboratory at Langley, in Virginia. It later became part of NASA. At that time, a “computer” was not a machine but a person who worked out difficult sums by hand. This meant carrying out long calculations again and again, until the answers were certain. Katherine joined a group of clever women who did this job. Because of the rules of the time, the Black women mathematicians at Langley worked in a separate area from their colleagues. Katherine carried on regardless, and she worked with such accuracy that her answers were trusted.","As the years passed, her work turned towards space flight. Her task was to calculate a trajectory, the curved path that a spacecraft follows through the sky. In this job, the smallest slip could send a capsule to the wrong place, so every single figure had to be exactly right. Her calculations helped to plan the flight of Alan Shepard. On the 5th of May 1961, he became the first American to travel into space.","Soon afterwards, electronic computers began to do much of the arithmetic. The machines were far quicker than any person, but they were new, and not everybody was sure that they could be trusted. In 1962, before the astronaut John Glenn set off to circle the Earth, he asked for Katherine to check the machine’s numbers by hand. His flight took place on the 20th of February 1962, and he became the first American to orbit the Earth. He wanted a person he trusted to look at the numbers first.","Katherine worked at Langley for 33 years, until 1986. Her calculations also helped with the Apollo missions, including Apollo 11 in 1969, which carried astronauts to the Moon. She later worked on the Space Shuttle, a spacecraft that could be used again and again. In her later years, she encouraged students to take up science and technology. On the 24th of November 2015, when she was 97 years old, President Barack Obama gave her the Presidential Medal of Freedom. This is the highest honour given to a civilian, which means a person who is not in the armed forces.","Katherine Johnson began as a child who could not stop counting. She became a mathematician whose careful work was trusted with some of the most important journeys of her time, and she showed that a person can do great things whatever the rules around them. Her story reminds us that careful, honest work can earn the trust of others."]},{"id":"31-1","level":"Level F1","title":"Agnes Pryce, Postwoman of Cwm Derwen","paras":["Agnes Pryce was born in 1893 in Cwm Derwen, a scattering of farms wedged into a steep Welsh valley where the nearest town lay eleven miles away, over a mountain pass. Her mother was a shepherd and her father a tailor, and it was said that Agnes learned to read from the labels on her father’s reels of thread. By the age of nine, she could recite every price in the village shop’s ledger, a talent the shopkeeper found impressive and faintly alarming.","When Agnes was seventeen, the valley’s postman retired, and nobody could be persuaded to replace him. The round covered twenty-two miles of rough track, crossing two rivers and a bog that had swallowed more than one boot. Agnes applied, to general astonishment. Told that a young woman could not possibly manage it, she promptly walked the entire route in a single afternoon, arriving back at the post office before closing time. She was given the job that evening.","For the next forty-nine years, Agnes carried far more than letters. The valley had no doctor’s surgery and no telephone, so she also carried messages, medicine and news. She learned which households would welcome a cup of tea and a chat, and which preferred a nod over the gate. In a battered notebook she recorded every family’s name and one thing she had noticed about them: a birthday, a lame sheepdog, a stubborn hip. A letter delivered by Agnes, people joked, arrived with a weather report and the latest local opinion attached.","Her most celebrated feat came in the winter of 1947, when heavy snow closed the pass for six weeks. Agnes refused to let the valley feel cut off. She built a sledge from an old farm gate and, dragging it behind her, delivered the post on foot as usual. She also organised the farms into a chain, so that a sack of flour or a bottle of medicine could be passed from door to door faster than any one person could carry it. Nobody was ever quite sure who had first suggested the idea, but everybody knew who had made it work.","In 1959, when a new road allowed the Post Office to send a van, Agnes retired at the age of sixty-six. The valley presented her with a clock, a bunch of flowers and, at her own request, a sturdy new pair of boots, which she promised to wear out. She did not rest for long. She turned the empty room behind the old post office into a lending library, filled with books donated by her neighbours. People came for the books, although, they admitted, they came mostly for the conversation.","The library stayed open for more than twenty years. Agnes’s notebook is now kept in a museum in the nearest town. Its final entry, written in her careful hand, consists of just two words: “All delivered.”"]},{"id":"31-2","level":"Level F1","title":"A Field Worth Keeping","paras":["Dear Councillor Hargreaves,","I am writing on behalf of the Willowbrook Residents’ Group to urge the council to reconsider its plan to sell Tanner’s Field for car parking. For eleven years, this field has stood unused at the end of Mill Lane, and I understand entirely why it looks like an opportunity. I would argue, however, that it is a far greater opportunity than a car park could ever be.","We propose to plant a community orchard: forty apple, pear and plum trees, with a mown path, a few benches and a small shed for tools. A young fruit tree begins to bear fruit within a few years, and after that it will feed a neighbourhood for generations. Every autumn, the fruit would be free to anyone who lives nearby, and any surplus could be shared with the food bank on Church Street.","The benefits reach well beyond the fruit itself. In spring, the blossom would give bees and other insects an early meal, while the branches would shelter birds all year round. On hot days, the trees would cast shade in a town that has too little of it. Most importantly, an orchard is a place where people meet. At present, a resident of Mill Lane may live beside a neighbour for years without exchanging more than a nod. Working alongside one another, we believe, would change that.","I anticipate your objection. Parking is a genuine problem, and the council’s budget is limited. But consider the costs. A car park would need to be surfaced, lit and drained at considerable expense, and it would serve only those who drive into the town centre for an hour or two. Our orchard would cost far less. A local nursery has offered the trees at a reduced price, and more than sixty volunteers, of all ages, have already promised to give up their weekends to plant and tend it. The primary school has even offered to help with the planting. I would also point out that the High Street car park regularly has empty spaces before noon.","Consider, too, the children of Willowbrook. Many of them have never seen fruit growing on a tree, and an orchard would become a living classroom in which they could watch the seasons turn, from the first blossom to the last apple. It would also offer a shaded bench and a gentle walk to older residents, who currently have nowhere to sit between the shops and the bus stop.","There is a further difference. A car park, once built, is unlikely ever to be undone. An orchard, by contrast, grows more valuable with every year that passes.","I would be delighted to show you the field and our plans in person. I hope you will give the residents of Willowbrook the chance to prove what we can do.","Yours sincerely,","Yasmin Farooqui","Chair, Willowbrook Residents’ Group"]},{"id":"31-3","level":"Level F1","title":"The Beech Wood in October","paras":["By the middle of October, the beech wood has stopped pretending to be green. The leaves, which in summer made a roof so dense that hardly a fern could grow beneath it, have turned the colour of copper pennies and toasted bread, and the whole wood glows as though lit from within. Walking beneath them, you feel less like a visitor than like someone who has stepped inside a lantern.","The trunks rise smooth and grey, unmarked by the deep furrows of oak or ash, like the legs of enormous elephants, and the air between them is cool, carrying the first faint bite of winter. High above, the branches spread in a lattice so fine that the sky appears in the gaps as pieces of a blue jigsaw. The light that filters down is low and slanting. It lays long bars of gold across the ground and turns each drifting leaf, for a moment, into a flake of fire.","Underfoot, the fallen leaves have gathered ankle-deep. They rustle, crackle and sigh at every step, and in the still air the sound carries far ahead of you, so that nothing in the wood can be surprised by your arrival. Beneath the top layer, the older leaves have darkened and softened into a damp brown blanket that smells of earth and mushrooms and rain. It is a smell that seems to hold the whole year inside it. Now and then a breeze combs through the canopy, and a shower of leaves spins down like slow, silent rain.","Everywhere there are signs of a wood preparing itself. Beech nuts, gathered in prickly cases the size of a thumbnail, lie scattered among the leaves, some split open to show their small, three-cornered seeds. A squirrel streaks up a trunk with a nut in its mouth, pausing halfway to scold the intruder before vanishing into the branches. Somewhere beyond, a wood pigeon clatters out of a tree, and the noise of its wings echoes for a long time. Far off, a jay gives one harsh cry, and the silence closes behind it like water.","On a rotting stump, a cluster of pale fungi has appeared overnight, their caps packed together like a crowd pressed against a window. Their sudden arrival is a reminder that the wood’s real work goes on out of sight, in the soil, where threads of fungus feed on fallen leaves and slowly turn them back into earth.","As the afternoon fades, the gold deepens to amber and the shadows lengthen between the trunks. A single leaf lets go of its twig and turns over and over on its way down, taking so long that you almost expect it to change its mind. It lands without a sound. The wood does not hurry, and after a while you find that you have stopped hurrying too."]},{"id":"31-4","level":"Level F1","title":"How Light Carries Messages","paras":["Every time you watch a video or send a message to a friend on the other side of the world, the information may travel for part of its journey as flashes of light inside a strand of glass. These strands, known as optical fibres, are so thin that a single one is little wider than a human hair, yet together they form a network that stretches across continents and beneath the oceans.","An optical fibre has two main layers. At the centre is the core, a thread of exceptionally pure glass. Around it lies a second layer called the cladding, which is made from a different type of glass. A plastic coat covers the outside, protecting the delicate strand from scratches and from being bent too sharply. The crucial detail is that the two glasses are not identical: light travels a little more slowly through the core than through the cladding.","This difference is what keeps the light trapped. When a beam inside the core meets the boundary with the cladding at a shallow angle, it does not escape. Instead, it bounces back into the core, rather like a ball ricocheting off a wall. This effect is known as total internal reflection. The light zigzags along the fibre from side to side, and it can follow gentle bends and curves without leaking out.","To send a message, the information must first be turned into a code. A tiny laser or lamp at one end switches on and off many millions of times each second, producing pulses of light. A pattern of pulses can stand for letters, sounds or pictures, in much the same way that a pattern of dots and dashes can spell words in Morse code. At the far end, a detector notices the flashes and changes them back into the original message.","Fibres have several advantages over older copper cables. Light can carry far more information than electricity, so a single fibre can handle thousands of conversations at once. The signals are not disturbed by interference from nearby electrical equipment, and they weaken more slowly, which means they can travel much further before needing a boost. Even so, over very long distances the light gradually dims, so devices called amplifiers are placed along the cable at regular intervals to strengthen it.","Fibres also have drawbacks. Glass is brittle, so a cable must be handled with care, and a cable on the seabed can be damaged by a ship’s anchor, interrupting the messages it carries. Repairing a break demands skilled engineers, who must join the two tiny cores so precisely that no light leaks out at the join.","Despite these difficulties, a simple discovery about how light bends and bounces has become the invisible backbone of modern communication. Most of the time, we never notice it, which is exactly how the engineers would like it."]},{"id":"31-5","level":"Level F1","title":"The Crows of New Caledonia","paras":["Among the forested islands of the South Pacific, New Caledonia is home to a bird whose behav
